<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Wild Willows — Metrics Dashboard</title>
		<meta
			name="description"
			content="Anonymous gameplay metrics for Wild Willows, a cozy nature-restoration life sim."
		/>
		<meta name="robots" content="noindex" />
		<style>
			:root {
				--bg: #eef2e3;
				--bg2: #e5ecd6;
				--card: #fffdf7;
				--ink: #2f3a27;
				--muted: #6b7263;
				--faint: #9aa189;
				--accent: #4a7c46;
				--accent-dark: #35602f;
				--accent-soft: #dceccf;
				--gold: #d9a441;
				--sky: #6ea8c8;
				--rose: #d77b8f;
				--rule: #dfe0cf;
				--shadow: 0 1px 2px rgba(47, 58, 39, 0.06), 0 6px 20px rgba(47, 58, 39, 0.07);
				--radius: 18px;
			}
			* {
				box-sizing: border-box;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				background:
					radial-gradient(1200px 480px at 80% -10%, #f4f8ec 0%, transparent 60%),
					linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
				background-attachment: fixed;
				color: var(--ink);
				font:
					15px/1.55 -apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				min-height: 100vh;
			}
			.wrap {
				max-width: 1180px;
				margin: 0 auto;
				padding: clamp(1rem, 3vw, 2.5rem) clamp(0.9rem, 3vw, 2rem) 5rem;
			}

			/* ---- header ---- */
			header.top {
				display: flex;
				flex-wrap: wrap;
				align-items: flex-end;
				gap: 1rem 1.4rem;
				margin-bottom: 1.6rem;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 0.8rem;
			}
			.brand .leaf {
				width: 46px;
				height: 46px;
				flex: none;
				border-radius: 14px;
				background: linear-gradient(140deg, var(--accent) 0%, var(--accent-dark) 100%);
				display: grid;
				place-items: center;
				box-shadow: var(--shadow);
			}
			.brand h1 {
				font-size: clamp(1.35rem, 3.5vw, 1.9rem);
				margin: 0;
				letter-spacing: -0.02em;
			}
			.brand p {
				margin: 0.1rem 0 0;
				color: var(--muted);
				font-size: 0.92rem;
			}
			.meta {
				margin-left: auto;
				text-align: right;
				color: var(--muted);
				font-size: 0.82rem;
			}
			.meta .live {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				font-weight: 600;
				color: var(--accent-dark);
			}
			.dot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: var(--accent);
				box-shadow: 0 0 0 0 rgba(74, 124, 70, 0.5);
				animation: pulse 2s infinite;
			}
			@keyframes pulse {
				0% {
					box-shadow: 0 0 0 0 rgba(74, 124, 70, 0.45);
				}
				70% {
					box-shadow: 0 0 0 8px rgba(74, 124, 70, 0);
				}
				100% {
					box-shadow: 0 0 0 0 rgba(74, 124, 70, 0);
				}
			}
			button.refresh {
				margin-top: 0.4rem;
				font: inherit;
				font-size: 0.82rem;
				cursor: pointer;
				border: 1px solid var(--rule);
				background: var(--card);
				color: var(--accent-dark);
				padding: 0.35rem 0.8rem;
				border-radius: 999px;
				box-shadow: var(--shadow);
				transition: transform 0.1s;
			}
			/* The `hidden` attribute is only a UA style rule, so any element this page
			   gives an explicit `display` to ignores it — which left the filter
			   dropdowns sitting above the sign-in form, styled as if they worked.
			   State this once, loudly, rather than tracking down each offender. */
			[hidden] {
				display: none !important;
			}
			/* Sign-in screen. Small, centred, and the only thing on the page — there is
			   nothing else to look at until it is answered. */
			.loginwrap {
				display: flex;
				justify-content: center;
				padding: 3rem 1rem;
			}
			.card.login {
				width: 100%;
				max-width: 380px;
				display: flex;
				flex-direction: column;
				gap: 0.7rem;
			}
			.card.login h2 {
				margin: 0;
				font-size: 1.15rem;
			}
			.card.login label {
				display: flex;
				flex-direction: column;
				gap: 0.25rem;
				font-size: 0.8rem;
				color: var(--muted);
			}
			.card.login input {
				font: inherit;
				font-size: 0.92rem;
				color: var(--ink);
				border: 1px solid var(--rule);
				border-radius: 10px;
				background: #fff;
				padding: 0.45rem 0.6rem;
			}
			.card.login input:focus {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.card.login button {
				margin-top: 0.3rem;
				align-self: flex-start;
			}
			.loginerr {
				margin: 0;
				font-size: 0.82rem;
				color: #a33f52;
				background: #fbeaee;
				border: 1px solid #f0cdd5;
				border-radius: 10px;
				padding: 0.45rem 0.6rem;
			}
			#whoami {
				font-size: 0.78rem;
				color: var(--muted);
			}
			#whoami .wrole {
				background: var(--accent-soft);
				color: var(--accent-dark);
				border-radius: 999px;
				padding: 0.05rem 0.45rem;
				font-size: 0.7rem;
				font-weight: 700;
			}
			button.linkish {
				font: inherit;
				font-size: 0.78rem;
				background: none;
				border: 0;
				padding: 0;
				color: var(--accent-dark);
				text-decoration: underline;
				cursor: pointer;
			}
			/* The Problems toggle. Neutral until something is actually wrong, then it
			   goes amber — so the button's colour carries the state without needing to
			   be read. */
			button.refresh.probs.on {
				background: var(--accent-soft);
				color: var(--accent-dark);
				border-color: var(--accent);
			}
			button.refresh.probs .pbadge {
				display: inline-block;
				margin-left: 0.35rem;
				padding: 0 0.4rem;
				border-radius: 999px;
				background: #f6e8c9;
				color: #a9781c;
				font-weight: 700;
				font-size: 0.74rem;
				font-variant-numeric: tabular-nums;
			}
			button.refresh.probs.bad {
				border-color: #e2c481;
			}
			/* Hide/show control in the Devices table. Deliberately quiet: it is a
			   maintenance switch, not something to draw the eye on every load. */
			button.devtoggle {
				font: inherit;
				font-size: 0.75rem;
				cursor: pointer;
				border: 1px solid var(--rule);
				background: var(--card);
				color: var(--muted);
				padding: 0.15rem 0.6rem;
				border-radius: 999px;
			}
			button.devtoggle:hover {
				color: var(--accent-dark);
				border-color: var(--accent);
			}
			.vfilter {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				margin-top: 0.5rem;
				font-size: 0.78rem;
				color: var(--muted);
			}
			.vfilter select {
				font: inherit;
				font-size: 0.8rem;
				cursor: pointer;
				color: var(--accent-dark);
				border: 1px solid var(--rule);
				background: var(--card);
				border-radius: 999px;
				padding: 0.3rem 0.7rem;
				box-shadow: var(--shadow);
			}
			.vfilter.is-off {
				opacity: 0.4;
			} /* range selector is moot while "All versions" is picked */
			.vfilter.is-off select {
				cursor: not-allowed;
			}
			.filter-note {
				display: inline-block;
				margin-left: 0.5rem;
				font-size: 0.74rem;
				font-weight: 700;
				color: var(--accent-dark);
				background: var(--accent-soft);
				border-radius: 999px;
				padding: 0.1rem 0.55rem;
			}
			button.refresh:hover {
				transform: translateY(-1px);
			}
			button.refresh:active {
				transform: translateY(0);
			}

			/* ---- section ---- */
			section {
				margin: 2.2rem 0 0;
			}
			.sec-head {
				display: flex;
				align-items: baseline;
				gap: 0.6rem;
				margin: 0 0.2rem 0.85rem;
			}
			.sec-head h2 {
				font-size: 1.04rem;
				margin: 0;
				letter-spacing: -0.01em;
			}
			.sec-head .sub {
				color: var(--faint);
				font-size: 0.82rem;
			}

			/* ---- kpi cards ---- */
			.grid {
				display: grid;
				gap: 0.8rem;
			}
			.kpis {
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			}
			/* The Overview row is a fixed set of six. auto-fit would drop the last one
			   to a line of its own at common laptop widths, so pin the count once
			   there is room for it; below that it falls back to the rule above.
			   minmax(0, 1fr) rather than 1fr so a long number can't widen its track. */
			@media (min-width: 900px) {
				.kpis-6 {
					grid-template-columns: repeat(6, minmax(0, 1fr));
				}
			}
			.card {
				background: var(--card);
				border: 1px solid var(--rule);
				border-radius: var(--radius);
				padding: 1rem 1.1rem;
				box-shadow: var(--shadow);
			}
			.kpi .v {
				font-size: clamp(1.5rem, 4.5vw, 2rem);
				font-weight: 700;
				letter-spacing: -0.02em;
				line-height: 1.05;
			}
			.kpi .k {
				color: var(--muted);
				font-size: 0.8rem;
				margin-top: 0.25rem;
			}
			.kpi .hint {
				color: var(--faint);
				font-size: 0.72rem;
				margin-top: 0.35rem;
			}
			.kpi .v small {
				font-size: 0.55em;
				font-weight: 600;
				color: var(--faint);
				margin-left: 0.15em;
			}
			.accent {
				color: var(--accent-dark);
			}

			.two {
				grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
			}
			.three {
				grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
			}

			.card h3 {
				margin: 0 0 0.9rem;
				font-size: 0.96rem;
			}
			.card h3 .tag {
				float: right;
				font-size: 0.74rem;
				font-weight: 600;
				color: var(--faint);
			}

			/* ---- horizontal bar rows ---- */
			.bars {
				display: flex;
				flex-direction: column;
				gap: 0.55rem;
			}
			.bar {
				display: grid;
				grid-template-columns: minmax(64px, 34%) 1fr auto;
				align-items: center;
				gap: 0.6rem;
			}
			.bar .lab {
				color: var(--muted);
				font-size: 0.82rem;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				text-transform: capitalize;
			}
			.bar .track {
				display: block;
				background: var(--accent-soft);
				border-radius: 999px;
				height: 12px;
				overflow: hidden;
			}
			/* display:block — these are <span>s, and inline elements silently ignore width/height */
			.bar .fill {
				display: block;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(90deg, var(--accent) 0%, var(--accent-dark) 100%);
				min-width: 3px;
				transition: width 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
			}
			.bar .num {
				font-size: 0.8rem;
				color: var(--ink);
				font-variant-numeric: tabular-nums;
				min-width: 2.4ch;
				text-align: right;
			}
			.fill.sky {
				background: linear-gradient(90deg, #8cc0da, var(--sky));
			}
			.fill.gold {
				background: linear-gradient(90deg, #e6bd62, var(--gold));
			}
			.fill.rose {
				background: linear-gradient(90deg, #e5a0af, var(--rose));
			}

			/* ---- funnel ---- */
			.funnel {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			.step {
				position: relative;
				background: var(--accent-soft);
				border-radius: 12px;
				overflow: hidden;
			}
			.step .sfill {
				background: linear-gradient(90deg, var(--accent), var(--accent-dark));
				height: 100%;
				position: absolute;
				inset: 0;
				width: 0;
				border-radius: 12px;
				transition: width 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
			}
			.step .srow {
				position: relative;
				display: flex;
				justify-content: space-between;
				align-items: center;
				padding: 0.6rem 0.85rem;
				gap: 1rem;
			}
			.step .sname {
				font-weight: 600;
				font-size: 0.86rem;
			}
			.step .sval {
				font-variant-numeric: tabular-nums;
				font-size: 0.84rem;
				display: flex;
				gap: 0.55rem;
				align-items: baseline;
			}
			.step .spct {
				color: var(--accent-dark);
				font-weight: 700;
			}
			.step.lite .sname,
			.step.lite .sval {
				color: var(--ink);
			}
			.step .drop {
				color: var(--rose);
				font-size: 0.72rem;
			}

			/* ---- donut / distribution ---- */
			.legend {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem 0.9rem;
				margin-top: 0.8rem;
			}
			.legend .li {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				font-size: 0.8rem;
				color: var(--muted);
			}
			.legend .sw {
				width: 11px;
				height: 11px;
				border-radius: 3px;
				flex: none;
			}
			.donutwrap {
				display: flex;
				align-items: center;
				gap: 1rem;
				flex-wrap: wrap;
			}
			.donutwrap svg {
				flex: none;
			}

			/* ---- characters ---- */
			.charwrap {
			}
			.chargrid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
				gap: 0.7rem;
			}
			.charcard {
				background: linear-gradient(180deg, #fffdf7, #f6f3e8);
				border: 1px solid var(--rule);
				border-radius: 16px;
				padding: 0.7rem 0.5rem 0.6rem;
				text-align: center;
				box-shadow: var(--shadow);
				transition: transform 0.12s ease;
			}
			.charcard:hover {
				transform: translateY(-3px);
			}
			.charcard svg {
				width: 100%;
				height: auto;
				max-width: 92px;
			}
			.charcard .cmeta {
				margin-top: 0.3rem;
				font-size: 0.72rem;
				color: var(--muted);
				line-height: 1.35;
			}
			.charcard .cmeta b {
				color: var(--accent-dark);
				font-weight: 700;
			}
			.charcard .badge {
				display: inline-block;
				margin-top: 0.25rem;
				font-size: 0.66rem;
				color: var(--gold);
				font-weight: 700;
				letter-spacing: 0.02em;
			}

			/* ---- player highlights ---- */
			.hlgrid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
				gap: 0.8rem;
			}
			.hlcard {
				display: flex;
				gap: 0.75rem;
				align-items: center;
				background: linear-gradient(180deg, #fffdf7, #f6f3e8);
				border: 1px solid var(--rule);
				border-radius: 16px;
				padding: 0.75rem 0.85rem;
				box-shadow: var(--shadow);
				transition: transform 0.12s ease;
			}
			.hlcard:hover {
				transform: translateY(-3px);
			}
			.hlav {
				flex: none;
				width: 66px;
			}
			.hlav svg {
				width: 100%;
				height: auto;
			}
			.hlbody {
				flex: 1;
				min-width: 0;
			}
			.hlname {
				display: flex;
				align-items: center;
				gap: 0.45rem;
				font-weight: 700;
				color: var(--ink);
				font-size: 0.96rem;
				margin-bottom: 0.35rem;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.hltop {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				flex-wrap: wrap;
				margin-bottom: 0.5rem;
			}
			.hltag {
				font-size: 0.66rem;
				font-weight: 700;
				letter-spacing: 0.02em;
				color: var(--accent-dark);
				background: var(--accent-soft);
				border-radius: 999px;
				padding: 0.12rem 0.55rem;
			}
			/* Demo → full carry-over. Gold rather than the usual green: this is the
			   milestone worth spotting from across the page, not another stat. */
			.hltag.hlconv {
				color: #7a5410;
				background: linear-gradient(180deg, #f7e6bd, #f0d79b);
				border: 1px solid #e2c481;
				cursor: help;
			}
			.hledi {
				font-size: 0.6rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				border-radius: 999px;
				padding: 0.1rem 0.45rem;
			}
			.hledi.demo {
				color: #a9781c;
				background: #f6e8c9;
			}
			.hledi.full {
				color: var(--accent-dark);
				background: var(--accent-soft);
			}
			/* A save the report treats as an open window rather than play. */
			.hlidle {
				font-size: 0.6rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				border-radius: 999px;
				padding: 0.1rem 0.45rem;
				color: #8a6a1f;
				background: #f3ead2;
				cursor: help;
			}
			.hlstats {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.5rem 0.35rem;
			}
			.hlstat {
				display: flex;
				flex-direction: column;
			}
			.hlstat b {
				font-size: 0.96rem;
				color: var(--ink);
				font-variant-numeric: tabular-nums;
				line-height: 1.1;
			}
			.hlstat span {
				font-size: 0.64rem;
				color: var(--faint);
			}
			.hlcard {
				cursor: pointer;
			}
			.hlcard:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			/* Caretakers seen in the last 5 minutes — the same window as the "Active now" KPI. */
			.hlcard.active-now {
				border-color: var(--accent);
				box-shadow:
					0 0 0 1px var(--accent),
					var(--shadow);
			}
			.hltag.hllive {
				color: #fff;
				background: var(--accent);
			}

			/* ---- player modal ---- */
			.modal-overlay {
				position: fixed;
				inset: 0;
				background: rgba(30, 38, 24, 0.55);
				display: flex;
				align-items: flex-start;
				justify-content: center;
				padding: 4vh 1rem;
				z-index: 100;
				overflow-y: auto;
			}
			.modal {
				background: var(--bg);
				border-radius: 20px;
				max-width: 880px;
				width: 100%;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
				padding: 1.4rem 1.4rem 1.8rem;
				position: relative;
			}
			.modal-close {
				position: absolute;
				top: 0.9rem;
				right: 1rem;
				border: none;
				background: var(--card);
				border-radius: 999px;
				width: 34px;
				height: 34px;
				font-size: 1.2rem;
				line-height: 1;
				cursor: pointer;
				color: var(--muted);
				box-shadow: var(--shadow);
			}
			.modal-close:hover {
				color: var(--ink);
			}
			.modal-head {
				display: flex;
				gap: 1rem;
				align-items: center;
				margin-bottom: 1.1rem;
				padding-right: 2.4rem;
			}
			.modal-head .mav {
				flex: none;
				width: 84px;
			}
			.modal-head .mav svg {
				width: 100%;
				height: auto;
			}
			.modal-head h2 {
				margin: 0 0 0.3rem;
				font-size: 1.3rem;
			}
			.modal-head .msub {
				color: var(--muted);
				font-size: 0.82rem;
				display: flex;
				gap: 0.5rem 0.7rem;
				flex-wrap: wrap;
				align-items: center;
			}
			.checklist {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
				gap: 0.45rem 0.8rem;
			}

		<script>
			'use strict';

			/* ------------------------------------------------------------------ *
			 * Color helpers — ported 1:1 from src/color.ts so avatars match the
			 * exact palette the game renders in-app.
			 * ------------------------------------------------------------------ */
			function hexToHsl(hex) {
				let c = String(hex || '#000000').replace('#', '');
				if (c.length === 3)
					c = c
						.split('')
						.map((ch) => ch + ch)
						.join('');
				const r = parseInt(c.slice(0, 2), 16) / 255;
				const g = parseInt(c.slice(2, 4), 16) / 255;
				const b = parseInt(c.slice(4, 6), 16) / 255;
				const max = Math.max(r, g, b),
					min = Math.min(r, g, b);
				const l = (max + min) / 2;
				if (max === min) return { h: 0, s: 0, l: l * 100 };
				const d = max - min;
				const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
				let h;
				if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
				else if (max === g) h = ((b - r) / d + 2) * 60;
				else h = ((r - g) / d + 4) * 60;
				return { h, s: s * 100, l: l * 100 };
			}
			function hslToHex(h, s, l) {
				h = ((h % 360) + 360) % 360;
				s = Math.max(0, Math.min(100, s)) / 100;
				l = Math.max(0, Math.min(100, l)) / 100;
				const k = (n) => (n + h / 30) % 12;
				const a = s * Math.min(l, 1 - l);
				const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
				const to = (v) =>
					Math.round(v * 255)
						.toString(16)
						.padStart(2, '0');
				return `#${to(f(0))}${to(f(8))}${to(f(4))}`;
			}
			function shade(hex, dl) {
				const { h, s, l } = hexToHsl(hex);
				return hslToHex(h, s, l + dl);
			}
			const HAT_BASE = {
				straw: { a: '#c9a35c', b: '#d8b56e', line: '#a3814f' },
				leaf: { a: '#5d8a4a', line: '#436b35' },
				beanie: { a: '#b5707a', b: '#9e5f69' },
				cap: { a: '#5f86b0', b: '#4f739a', line: '#3f5f80' },
				bucket: { a: '#9aa86a', b: '#86945a' },
				party: { a: '#d77bb1', b: '#e89ac0', line: '#b45f95' },
				flower: { a: '#e87a9e' },
				wizard: { a: '#7d6b9e', b: '#8f7bb5', line: '#645380' },
				crown: { a: '#e0b23e', b: '#f0c95e', line: '#b8902e' },
				mushroom: { a: '#c9584c', b: '#d4685c', line: '#a84237' },
				ranger: { a: '#8a734f', b: '#9c845c', line: '#5d4a36' },
				bandana: { a: '#b05555', b: '#c96a5f', line: '#8d3f3f' },
				visor: { a: '#4f9a94', b: '#5fada6', line: '#3a7a74' },
				acorn: { a: '#a0763f', b: '#b0854b', line: '#7a5730' },
				beret: { a: '#a8455a', b: '#bc5a6e', line: '#843546' },
				witch: { a: '#2f2a3a', b: '#3c3550', line: '#211d2b' },
				newspaper: { a: '#e8e4d8', b: '#d8d3c4', line: '#a29a8a' },
				frog: { a: '#6aa84f', b: '#7cb95f', line: '#4f8038' },
				'cat-ears': { a: '#4a444f', b: '#5a5461', line: '#332f3a' },
				tophat: { a: '#3f3b47', b: '#4d4857', line: '#2b2833' },
				chef: { a: '#f2efe6', b: '#fbf9f3', line: '#d5d0c2' },
				pirate: { a: '#3a3340', b: '#4a4252', line: '#272231' },
				headphones: { a: '#5c6470', b: '#6f7885', line: '#3f4650' },
				halo: { a: '#f4d97a', b: '#fbeaa8', line: '#d0ae45' },
			};
			function hatPalette(hat, custom) {
				const base = HAT_BASE[hat] || HAT_BASE.straw;
				if (!custom) return { a: base.a, b: base.b ?? shade(base.a, 8), line: base.line ?? shade(base.a, -14) };
				return { a: custom, b: shade(custom, 8), line: shade(custom, -14) };
			}
			function flowerPalette(custom) {
				const base = ['#e87a9e', '#f4c95f', '#c45ad0', '#e8954f'];
				if (!custom) return base;
				const c = hexToHsl(custom),
					b0 = hexToHsl(base[0]);
				return base.map((hex) => {
					const b = hexToHsl(hex);
					return hslToHex(c.h + (b.h - b0.h), c.s + (b.s - b0.s), c.l + (b.l - b0.l));
				});
			}

			/* small helpers */
			const esc = (s) =>
				String(s).replace(
					/[&<>"']/g,
					(c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
				);
			const n = (x) => (x == null || isNaN(x) ? 0 : x);
			const fmt = (x) => n(x).toLocaleString('en-US');
			const pct = (x) => `${Math.round(n(x))}%`;

			/* ------------------------------------------------------------------ *
			 * Avatar — ported from CharacterPreview (src/ui/icons.tsx). Returns an
			 * SVG string. Names are never rendered.
			 * ------------------------------------------------------------------ */
			function avatarSVG(app) {
				const a = app || {};
				const skin = a.skin || '#eec39a',
					hair = a.hair || '#6e4a33',
					outfit = a.outfit || '#4a7c59';
				const hat = a.hat || 'none',
					hatColor = a.hatColor || null;
				const hairstyle = a.hairstyle || 'short',
					beard = a.beard || 'none',
					body = a.body || 'slim';
				const bw = body === 'round' ? 8 : 0;
				const hp = hatPalette(hat, hatColor);
				const fl = flowerPalette(hatColor);
				// visor, halo and headphones layer over the hair rather than covering it
				const bareHead =
					hat === 'none' || hat === 'halo' || hat === 'headphones' || hat === 'visor' || hat === 'cat-ears';
				let s = '';
				s += `<ellipse cx="50" cy="104" rx="${26 + bw / 2}" ry="7" fill="#000" opacity="0.12"/>`;
				if (hairstyle === 'long') s += `<path d="M29 30 Q26 78 34 86 L66 86 Q74 78 71 30 Z" fill="${hair}"/>`;
				if (hairstyle === 'curly-long')
					s += `<g fill="${hair}"><path d="M29 30 Q26 76 34 84 L66 84 Q74 76 71 30 Z"/><circle cx="31" cy="62" r="8"/><circle cx="69" cy="62" r="8"/><circle cx="33" cy="78" r="8"/><circle cx="67" cy="78" r="8"/><circle cx="50" cy="84" r="9"/><circle cx="41" cy="83" r="8"/><circle cx="59" cy="83" r="8"/></g>`;
				if (hairstyle === 'ponytail')
					s += `<g fill="${hair}"><ellipse cx="67" cy="32" rx="9" ry="10"/><ellipse cx="75" cy="47" rx="8" ry="13"/><ellipse cx="75" cy="61" rx="6.5" ry="11"/></g><ellipse cx="73" cy="41" rx="4.5" ry="3.2" fill="#c9913f"/>`;
				if (hairstyle === 'pigtails')
					s += `<g fill="${hair}"><ellipse cx="27" cy="33" rx="8.5" ry="10"/><ellipse cx="21" cy="49" rx="7.5" ry="12"/><ellipse cx="73" cy="33" rx="8.5" ry="10"/><ellipse cx="79" cy="49" rx="7.5" ry="12"/></g><ellipse cx="24" cy="42" rx="4.2" ry="3" fill="#c9913f"/><ellipse cx="76" cy="42" rx="4.2" ry="3" fill="#c9913f"/>`;
				if (hairstyle === 'afro') s += `<circle cx="50" cy="33" r="28" fill="${hair}"/>`;
				if (hairstyle === 'bob')
					s += `<g fill="${hair}"><ellipse cx="30" cy="42" rx="8" ry="14"/><ellipse cx="70" cy="42" rx="8" ry="14"/></g>`;
				if (hairstyle === 'braid')

			/* ------------------------------------------------------------------ *

			function kpi(v, k, hint) {
				return `<div class="card kpi"><div class="v">${v}</div><div class="k">${k}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
			}
			function barRows(entries, opts) {
				opts = opts || {};

				if (!rows.length) return `<div class="emptynote">No data yet.</div>`;
				const max = opts.max || Math.max(...rows.map((r) => r[1]), 1);
				return `<div class="bars">${rows
					.map(
						([lab, val]) =>
							`<div class="bar"><span class="lab" title="${esc(lab)}">${esc(opts.labelMap ? opts.labelMap[lab] || lab : lab)}</span>` +
							`<span class="track"><span class="fill ${cls}" style="width:${Math.max(2, (val / max) * 100)}%"></span></span>` +
							`<span class="num">${opts.fmtNum ? opts.fmtNum(val) : fmt(val)}</span></div>`,
					)
					.join('')}</div>`;
			}
			function objToEntries(obj) {
				return Object.entries(obj || {}).sort((a, b) => n(b[1]) - n(a[1]));
			}

			function donut(segments, size) {
				size = size || 128;
				const total = segments.reduce((a, s) => a + n(s.value), 0) || 1;
				const r = size / 2 - 10,

				const rings = segments
					.map((s) => {
						const frac = n(s.value) / total;
						const dash = `${frac * C} ${C - frac * C}`;
						const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${-off * C}" transform="rotate(-90 ${cx} ${cy})"/>`;
						off += frac;
						return el;
					})
					.join('');
				const svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="20" font-weight="700" fill="#2f3a27">${fmt(total)}</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="10" fill="#9aa189">total</text></svg>`;
				const legend = `<div class="legend">${segments.map((s) => `<span class="li"><span class="sw" style="background:${s.color}"></span>${esc(s.label)} · <b>${fmt(s.value)}</b></span>`).join('')}</div>`;
				return `<div class="donutwrap">${svg}<div>${legend}</div></div>`;
			}

				const top = n(steps[0] && steps[0].value) || 1;
				return `<div class="funnel">${steps
					.map((st, i) => {
						const w = Math.max(3, (n(st.value) / top) * 100);
						const drop = i > 0 && steps[i - 1].value ? Math.round((1 - n(st.value) / n(steps[i - 1].value)) * 100) : 0;
						return (
							`<div class="step"><span class="sfill" style="width:${w}%"></span><div class="srow">` +
							`<span class="sname">${esc(st.label)}</span>` +
							`<span class="sval"><span class="spct">${pct((st.value / top) * 100)}</span><span>${fmt(st.value)}</span>` +
							`${i > 0 && drop > 0 ? `<span class="drop">−${drop}%</span>` : ''}</span></div></div>`
						);
					})
					.join('')}</div>`;
			}

			function histCols(obj, opts) {
				opts = opts || {};
				const entries = opts.order
					? opts.order.filter((k) => k in (obj || {})).map((k) => [k, obj[k]])
					: Object.entries(obj || {});
				if (!entries.length) return `<div class="emptynote">No data yet.</div>`;
				const max = Math.max(...entries.map((e) => n(e[1])), 1);
				return `<div class="cols">${entries
					.map(([k, v]) => {
						const h = Math.max(3, (n(v) / max) * 82);
						return `<div class="col"><span class="cn">${fmt(v)}</span><span class="cbar" style="height:${h}px"></span><span class="cl">${esc(opts.labelMap ? opts.labelMap[k] || k : k)}</span></div>`;
					})
					.join('')}</div>`;
			}

			const r1 = (x) => Math.round(n(x) * 10) / 10;
			/* Per-edition rollup computed from the players array. A player is "demo" only
			 * when explicitly stamped edition:"demo"; everything else is the full game. */
			function editionStats(arr) {
				const c = arr.length;
				const sum = (f) => arr.reduce((a, p) => a + n(f(p)), 0);
				const rate = (k) => (c ? Math.round((arr.filter((p) => p.activation && p.activation[k]).length / c) * 100) : 0);
				const playSec = sum((p) => p.playSeconds);
				const returning = arr.filter((p) => n(p.sessions) > 1).length;
				return {
					count: c,
					playHours: r1(playSec / 3600),
					avgMin: c ? Math.round(playSec / 60 / c) : 0,
					avgSessions: c ? r1(sum((p) => p.sessions) / c) : 0,
					totalActions: sum((p) => p.totalActions),
					avgActions: c ? Math.round(sum((p) => p.totalActions) / c) : 0,
					avgAch: c ? r1(sum((p) => p.achievements && p.achievements.earned) / c) : 0,
					avgHealth: c ? Math.round(sum((p) => p.biomeSummary && p.biomeSummary.avgHealth) / c) : 0,
					avgBiomes: c ? r1(sum((p) => p.unlockedBiomes) / c) : 0,
					collected: rate('collected'),
					crafted: rate('crafted'),
					placed: rate('placed'),
					attractedAnimal: rate('attractedAnimal'),
					unlockedSecondBiome: rate('unlockedSecondBiome'),
					returningPct: c ? Math.round((returning / c) * 100) : 0,
				};
			}
			function vsTable(rows, demo, full) {
				const legend = `<div class="vslegend"><span class="li"><span class="sw" style="background:#d9a441"></span>Demo</span><span class="li"><span class="sw" style="background:var(--accent)"></span>Full</span></div>`;
				const body = rows
					.map((row) => {
						const dv = demo[row.key],
							fv = full[row.key];
						const suf = row.suf || '';
						const share = n(dv) + n(fv) > 0 ? (n(dv) / (n(dv) + n(fv))) * 100 : 50;
						return (
							`<div class="vsrow"><span class="vlab">${row.label}</span>` +
							`<span class="vnums"><span class="vd">${fmt(dv)}${suf}</span><span class="vf">${fmt(fv)}${suf}</span></span>` +
							`<span class="vbar"><i style="width:${share}%"></i></span></div>`
						);
					})
					.join('');
				return `${legend}<div class="vs">${body}</div>`;
			}

			function sec(title, sub, body) {
				return `<section><div class="sec-head"><h2>${title}</h2>${sub ? `<span class="sub">${sub}</span>` : ''}</div>${body}</section>`;
			}
			function card(inner) {
				return `<div class="card">${inner}</div>`;
			}
			function cardTitled(title, tag, inner) {
				return `<div class="card"><h3>${title}${tag ? `<span class="tag">${tag}</span>` : ''}</h3>${inner}</div>`;
			}

			/* Shared action labels (used by the all-time totals and the per-player modal). */
			const LANG_LABELS = {
				en: 'English',
				'en-kid': 'English (Kids)',
				es: 'Spanish',
				fr: 'French',
				de: 'German',
				pt: 'Portuguese',
				'pt-br': 'Portuguese (BR)',
				it: 'Italian',
				nl: 'Dutch',
				pl: 'Polish',
				ru: 'Russian',
				ja: 'Japanese',
				ko: 'Korean',
				zh: 'Chinese',
			};
			/* Preference labels. Shared by the per-player modal and the site-wide
			   "Settings & accessibility" section, so one player's card and the rollup
			   above it can never disagree about what a stored value is called. */
			const CB_LABELS = { off: 'Off', redgreen: 'Red–green', blueyellow: 'Blue–yellow', mono: 'Monochrome' };
			const TS_LABELS = { sm: 'Small', md: 'Medium', lg: 'Large', xl: 'Extra large' };
			const THEME_LABELS = { light: 'Light', dark: 'Dark', system: 'Match system' };
			const FONT_LABELS = {
				storybook: 'Storybook',
				rounded: 'Rounded',
				classic: 'Classic',
				plain: 'Plain',
				typewriter: 'Typewriter',
			};

			const ACTION_LABELS = {
				resourcesCollected: 'Resources collected',
				terraformActions: 'Terraform actions',
				plantsPlanted: 'Plants planted',
				itemsCrafted: 'Items crafted',
				objectsPlaced: 'Objects placed',
				animalsReturned: 'Animals returned',
				itemsDiscarded: 'Items discarded',
				animalsObserved: 'Animals observed',
				chestDeposits: 'Chest deposits',
				tasksCompleted: 'Tasks completed',
				toolsUpgraded: 'Tools upgraded',
				homeUpgrades: 'Home upgrades',
				recolors: 'Recolors',
				chestWithdrawals: 'Chest withdrawals',
				objectsMoved: 'Objects moved',
				objectsRemoved: 'Objects removed',
				homesBuilt: 'Homes built',
			};

			/* Compact duration: minutes under an hour, else "Xh Ym". */
			function fmtDur(sec) {
				const m = Math.round(n(sec) / 60);
				if (m < 60) return m + 'm';
				const h = Math.floor(m / 60),
					r = m % 60;
				return r ? `${h}h ${r}m` : `${h}h`;
			}

			/* How long a session actually lasts.
			 *
			 * The server has computed this histogram all along and nothing has ever
			 * drawn it. It is drawn here WITH its coverage stated, because the buckets
			 * are a subset — only sessions a client recorded a length for land in them,
			 * so the total can be a couple of dozen while Sessions above reads in the
			 * hundreds. Shown as a share of the sessions it covers, not of all of them,
			 * or the percentages would be quietly wrong. */
			const SESSION_BUCKET_ORDER = ['<2m', '2-10m', '10-30m', '30m+'];
			const SESSION_BUCKET_LABELS = {
				'<2m': 'Under 2 min',
				'2-10m': '2 – 10 min',
				'10-30m': '10 – 30 min',
				'30m+': 'Over 30 min',
			};
			function sessionShapeHTML(s) {
				const sl = s.sessionLengths || (s.sessionLengthDistribution ? { buckets: s.sessionLengthDistribution } : null);
				if (!sl) return '';
				const buckets = sl.buckets || {};
				const covered = sl.sessionsCovered != null ? sl.sessionsCovered : Object.values(buckets).reduce((a, v) => a + n(v), 0);
				if (!covered) return '';
				const entries = SESSION_BUCKET_ORDER.filter((k) => buckets[k] != null).map((k) => [k, n(buckets[k])]);
				const total = n(sl.totalSessions);
				// The caveat is the point of the panel, so it goes in the subtitle where
				// it cannot be scrolled past, not in a footnote.
				const tag =
					total && covered < total
						? `${fmt(covered)} of ${fmt(total)} sessions measured (${pct(sl.coveragePct)})`
						: `${fmt(covered)} sessions measured`;
				return `<div style="margin-top:.8rem">${cardTitled(
					'How long a session lasts',
					tag,
					barRows(entries, { labelMap: SESSION_BUCKET_LABELS, cls: 'sky' }) +
						(total && covered < total
							? `<p class="emptynote">Only sessions a client recorded a length for reach these buckets — older builds report none. The shares above are of the ${fmt(covered)} measured, not of all ${fmt(total)}.</p>`
							: ''),
				)}</div>`;
			}

			/* New caretakers per day.
			 *
			 * The range control here scopes THIS CHART ONLY, and the subtitle says so.
			 * It deliberately does not filter the rest of the page: almost every number
			 * above is a lifetime total carried on a save (play time, actions, biome
			 * health), not something attributable to a day, so a picker that appeared to
			 * scope the whole report would be answering a question the data can't. */
			const DAY_RANGE = { preset: '30', from: '', to: '' };

			function visibleDays(daily) {
				const days = (daily && daily.days) || [];
				if (!days.length) return [];
				if (DAY_RANGE.preset === 'custom') {
					const from = DAY_RANGE.from || days[0].day;
					const to = DAY_RANGE.to || days[days.length - 1].day;
					return days.filter((d) => d.day >= from && d.day <= to);
				}
				if (DAY_RANGE.preset === 'all') return days;
				return days.slice(-Number(DAY_RANGE.preset));
			}

			/* A dense day-by-day bar chart. Its own renderer rather than histCols,
			 * which puts a number and a label under every column — fine for four
			 * tutorial steps, unreadable at ninety days. Here the count lives in the
			 * tooltip and the axis is labelled at intervals. */
			function dayCols(days, key) {
				if (!days.length) return `<div class="emptynote">No days in this range.</div>`;
				const max = Math.max(...days.map((d) => n(d[key])), 1);
				const step = Math.ceil(days.length / 8);
				const fmtDay = (iso) => {
					const [y, m, dd] = iso.split('-');
					return `${MONTHS[Number(m) - 1]} ${Number(dd)}`;
				};
				const bars = days
					.map((d, i) => {
						const v = n(d[key]);
						const h = v ? Math.max(2, (v / max) * 96) : 0;
						const lab = i % step === 0 || i === days.length - 1 ? fmtDay(d.day) : '';
						return (
							`<div class="dcol" title="${esc(fmtDay(d.day))} · ${fmt(v)}">` +
							`<span class="dbar${v ? '' : ' zero'}" style="height:${h}px"></span>` +
							`<span class="dl">${lab}</span></div>`
						);
					})
					.join('');
				return `<div class="dcolwrap"><div class="dmax">${fmt(max)}</div><div class="dcols">${bars}</div></div>`;
			}

			const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
			const DAY_PRESETS = [
				{ key: '7', label: '7d' },
				{ key: '30', label: '30d' },
				{ key: '90', label: '90d' },
				{ key: 'all', label: 'All' },
			];

			function dailyHTML(s) {
				const daily = s.daily;
				if (!daily || !daily.days || !daily.days.length) return '';
				const shown = visibleDays(daily);
				const totalNew = shown.reduce((a, d) => a + n(d.created), 0);
				const busiest = shown.slice().sort((a, b) => n(b.created) - n(a.created))[0];
				const picker =
					`<div class="dpick">` +
					DAY_PRESETS.map(
						(p) =>
							`<button type="button" class="dbtn${DAY_RANGE.preset === p.key ? ' on' : ''}" data-range="${p.key}">${p.label}</button>`,
					).join('') +
					`<span class="dsep"></span>` +
					`<label>From <input type="date" class="dinput" data-range-from value="${esc(DAY_RANGE.from || daily.firstDay)}" min="${esc(daily.firstDay)}" max="${esc(daily.lastDay)}"></label>` +
					`<label>To <input type="date" class="dinput" data-range-to value="${esc(DAY_RANGE.to || daily.lastDay)}" min="${esc(daily.firstDay)}" max="${esc(daily.lastDay)}"></label>` +
					`</div>`;
				const sub = shown.length
					? `${fmt(totalNew)} new in ${fmt(shown.length)} ${shown.length === 1 ? 'day' : 'days'}` +
						(busiest && busiest.created ? ` · busiest ${esc(busiest.day)} with ${fmt(busiest.created)}` : '')
					: 'no days in this range';
				// Saves created only. The payload also carries a per-day `lastSeen`, but
				// it is the day each save was LAST active — not daily actives — and a
				// second chart of it next to this one invited exactly the misreading it
				// was captioned to prevent. Left in the API for anything that wants it.
				return sec(
					'New caretakers per day',
					'this chart only — the rest of the page is all-time',
					picker + cardTitled('Saves created', sub, dayCols(shown, 'created')),
				);
			}

			/* What caretakers choose to look like.
			 *
			 * The server has tallied every appearance choice across every save this
			 * whole time and nothing has ever rendered it. It is the one panel here
			 * that answers an art question rather than a numbers one: which hats are
			 * worth drawing more of, and which nobody has ever picked.
			 *
			 * Colour fields are shown AS the colour. A bar chart of '#6e4a33' vs
			 * '#eec39a' is unreadable — the whole point of the choice is what it looks
			 * like, so swatches, sorted by how often they were chosen. */
			const APPEARANCE_FIELDS = [
				{ key: 'hat', label: 'Hats', kind: 'name' },
				{ key: 'hairstyle', label: 'Hairstyles', kind: 'name' },
				{ key: 'body', label: 'Body', kind: 'name' },
				{ key: 'beard', label: 'Beards', kind: 'name' },
				{ key: 'skin', label: 'Skin tones', kind: 'color' },
				{ key: 'hair', label: 'Hair colours', kind: 'color' },
				{ key: 'outfit', label: 'Outfit colours', kind: 'color' },
				{ key: 'hatColor', label: 'Hat colours', kind: 'color' },
			];
			function swatches(entries) {
				return `<div class="swgrid">${entries
					.map(
						([v, c]) =>
							`<span class="swchip" title="${esc(String(v))} · ${fmt(c)}"><span class="dot" style="background:${esc(
								String(v),
							)}"></span><span class="cnt">${fmt(c)}</span></span>`,
					)
					.join('')}</div>`;
			}
			function appearanceHTML(s) {
				const ap = s.appearancePopularity || {};
				const choices = ap.choices || {};
				const cards = APPEARANCE_FIELDS.map((f) => {
					const entries = objToEntries(choices[f.key]).filter((e) => e[0] && e[0] !== 'unknown');
					if (!entries.length) return '';
					// "none" is a real answer for a hat or a beard — how many people
					// chose NOT to wear one is as interesting as which one they picked.
					const TOP_N = 5;
					const top = entries.slice(0, TOP_N);
					// When the list is cut, the tag says so. "6 options chosen" above five
					// bars reads as if six were on screen, and the missing one is always
					// the least-picked — which is the one worth knowing about.
					const tag =
						entries.length > TOP_N
							? `top ${TOP_N} of ${fmt(entries.length)} chosen`
							: `${fmt(entries.length)} ${entries.length === 1 ? 'option' : 'options'} chosen`;
					return cardTitled(f.label, tag, f.kind === 'color' ? swatches(top) : barRows(top, { cls: 'gold' }));
				}).filter(Boolean);
				if (!cards.length) return '';
				return sec(
					'What caretakers look like',
					`the customization ${fmt(ap.savesWithAppearance)} people actually picked`,
					`<div class="grid two">${cards.join('')}</div>`,
				);
			}

			/* What the play-time numbers are NOT counting, and why.
			 *
			 * Two separate caveats ride on every duration on this page: windows left
			 * open (excluded by default), and the fact that rev 1 clients counted
			 * untouched windows as play while rev 2 does not. Both were reported in the
			 * payload and shown nowhere, which is the worst of both — the numbers were
			 * already qualified, the reader just couldn't see it. */
			function clockNoteHTML(s) {
				const a = s.anomalies;
				if (!a) return '';
				const clock = a.clock || {};
				const revs = Object.entries(clock.byRev || {}).filter((e) => n(e[1]) > 0);
				const mixed = revs.length > 1;
				if (!a.idlePlayers && !mixed) return '';
				const bits = [];
				if (a.idlePlayers) {
					bits.push(
						`<div class="clocknote"><b>${fmt(a.idlePlayers)} ${a.idlePlayers === 1 ? 'save' : 'saves'} left a window open</b> — ` +
							`${fmt(a.idleHours)} hours and ${fmt(a.idleActions)} actions of it. ` +
							(a.excluded
								? `Excluded from ${esc(a.affects)}; they still count everywhere else.`
								: `<em>Currently included.</em> Switch “Idle windows” to Exclude to drop them from ${esc(a.affects)}.`) +
							`<span class="cnrule">${esc(a.rule)}</span></div>`,
					);
				}
				if (mixed) {
					bits.push(
						`<div class="clocknote"><b>Two play-time definitions in one total.</b> ${esc(clock.note || '')} — ` +
							revs.map(([k, v]) => `${fmt(v)} on ${esc(k)}`).join(', ') +
							`. Read any trend that crosses the change as two series, not one.` +
							(clock.idleGateMinutes ? `<span class="cnrule">rev 2 stops the clock after ${n(clock.idleGateMinutes)} min untouched</span>` : '') +
							`</div>`,
					);
				}
				return `<div style="margin-top:.8rem">${cardTitled('About these durations', 'what the clock does and does not count', bits.join(''))}</div>`;
			}

			/* ------------------------------------------------------------------ *
			 * Per-player modal — a full picture of one caretaker's playthrough
			 * ------------------------------------------------------------------ */
			let PLAYERS_BY_ID = {};
			let modalEl = null;
			let LANDING = null; // latest GET /LandingStats/ payload (null until loaded / if unavailable)
			let SAVEHEALTH = null; // latest GET /SaveHealth/ payload — records that would not decode
			let GAMEPLAYHEALTH = null; // latest GET /GameplayHealth/ payload — refusals + interface crashes

			/** How this caretaker has their settings — every option in Settings →
			 *  Accessibility, plus audio. Sourced from the `prefs` block each solo
			 *  session uplinks (snapshotPrefs in src/solo/metricsUplink.ts); these live
			 *  in localStorage, so a save that has not reported since the block was
			 *  added simply has no `prefs` and the card is skipped rather than drawn
			 *  full of made-up defaults.
			 *
			 *  Booleans render as the same on/off checklist the Milestones card uses,
			 *  so "off" reads as a deliberate state rather than missing data — the
			 *  point of a per-player view is being able to confirm an option is OFF,
			 *  not just spot the ones that are on. `interactHint` is inverted here
			 *  because it ships ON: what is worth seeing is that this player turned it
			 *  off. Everything with more than two values (colorblind mode, text size,
			 *  font, theme) gets a labelled row instead, using the same label maps as
			 *  the site-wide rollup. */
			function prefsCardHTML(p) {
				const pr = p.prefs;
				if (!pr || typeof pr !== 'object') return '';
				const toggles = [
					['Reduce motion', !!pr.reduceMotion],
					['High contrast', !!pr.highContrast],
					['Simpler wording', !!pr.simpleText],
					['Interact hint off', pr.interactHint === false],
				];
				const a11yOn = toggles.some(([, on]) => on) || (pr.colorblindMode && pr.colorblindMode !== 'off');
				const checks = `<div class="checklist">${toggles
					.map(
						([l, on]) =>
							`<span class="checkitem"><span class="ck ${on ? 'on' : 'off'}">${on ? '✓' : '·'}</span>${l}</span>`,
					)
					.join('')}</div>`;

				const lookup = (map, v) => (v == null || v === '' ? '—' : map[v] || esc(String(v)));
				// The theme is two facts, not one: 'system' is a choice that only tells
				// you what they are looking at once it is resolved, so show the resolved
				// value beside it — but only when it adds something.
				const themeText =
					pr.theme === 'system' && pr.themeResolved
						? `${THEME_LABELS.system} → ${lookup(THEME_LABELS, pr.themeResolved)}`
						: lookup(THEME_LABELS, pr.theme);
				const rows = [
					['Colorblind aid', lookup(CB_LABELS, pr.colorblindMode)],
					['Text size', lookup(TS_LABELS, pr.textScale)],
					['Font', lookup(FONT_LABELS, pr.fontChoice)],
					['Appearance', themeText],
				];

				// Audio is a pair of independent switches plus a level each. A level is
				// only meaningful while its switch is on, so a muted channel reads
				// "Off" outright instead of "Off · 60%", which invites the wrong reading.
				const vol = (v) => (v == null ? '' : ` · ${Math.round(n(v) * 100)}%`);
				const chan = (on, v) => (on === false ? 'Off' : `On${vol(v)}`);
				rows.push(['Music', chan(pr.musicEnabled, pr.musicVolume)]);
				rows.push(['Sound effects', chan(pr.sfxEnabled, pr.sfxVolume)]);

				const list = `<div class="reclist" style="margin-top:.8rem">${rows
					.map(([l, v]) => `<div class="recrow"><b>${l}</b><span>${v}</span></div>`)
					.join('')}</div>`;
				return cardTitled(
					'Settings & accessibility',
					a11yOn ? 'using accessibility options' : 'all accessibility options off',
					checks + list,
				);
			}

			/** Build the modal body for one player: header, headline stats, progress,
			 *  milestones, a full action breakdown, time-by-area, and recent achievements. */
			function playerModalHTML(p) {
				const bs = p.biomeSummary || {},
					ach = p.achievements || {},
					act = p.activation || {},
					counts = p.counts || {};
				const edi = p.edition === 'demo' ? 'demo' : 'full';
				const areaMin =
					p.areaMinutes && Object.keys(p.areaMinutes).length
						? p.areaMinutes
						: Object.fromEntries(Object.entries(p.areaSeconds || {}).map(([k, v]) => [k, Math.round(n(v) / 60)]));
				const joined = p.daysSinceJoined != null ? `joined ${p.daysSinceJoined}d ago` : '';
				const last = p.hoursSinceActive != null ? `last seen ${p.hoursSinceActive}h ago` : '';
				const tut = n(p.tutorialStep) >= 99 ? 'Done' : `Step ${n(p.tutorialStep)}`;

				const kpis = `<div class="grid kpis">${[
					kpi(fmtDur(p.playSeconds), 'Played', `${fmt(n(p.playMinutes))}m total`),
					kpi(fmt(n(p.sessions)), n(p.sessions) === 1 ? 'Session' : 'Sessions', `${n(p.avgSessionMinutes)}m avg`),
					kpi(fmt(n(p.totalActions)), 'Actions', `${n(p.actionsPerMinute)}/min`),
					kpi(`${n(ach.earned)}<small>/${n(ach.total)}</small>`, 'Achievements', `${fmt(n(ach.points))} pts`),
				].join('')}</div>`;

				const progress = cardTitled(
					'Progress',
					null,
					`<div class="grid kpis">${[
						kpi(fmt(n(p.unlockedBiomes || bs.biomesUnlocked)), 'Biomes unlocked'),
						kpi(fmt(n(bs.biomesFullyRestored)), 'Biomes restored'),
						kpi(`${n(bs.avgHealth)}<small>%</small>`, 'Avg biome health'),
						kpi(fmt(n(bs.totalAnimalsReturned)), 'Animals returned'),
					].join('')}</div>`,
				);

				const cdid = (k) => n(counts[k]) > 0;
				const flags = [
					['Collected a resource', act.collected || cdid('resourcesCollected')],
					['Terraformed the land', act.terraformed || cdid('terraformActions')],
					['Planted something', act.planted || cdid('plantsPlanted')],
					['Crafted an item', act.crafted || cdid('itemsCrafted')],
					['Placed an object', act.placed || cdid('objectsPlaced')],
					['Attracted an animal', act.attractedAnimal || n(bs.totalAnimalsReturned) > 0],
					['Upgraded a tool', act.upgradedTool || cdid('toolsUpgraded')],
					['Built a home', act.builtHome || cdid('homesBuilt')],
					['Upgraded a home', act.upgradedHome || cdid('homeUpgrades')],
					['Unlocked 2nd biome', act.unlockedSecondBiome || n(p.unlockedBiomes || bs.biomesUnlocked) >= 2],
				];
				// Demo players get one more: did they reach the end of the demo? The demo
				// stops itself after DEMO_FOREST_MINUTES spent standing in the forest
				// (src/demo.ts), so forest dwell time IS the finish line — several saves
				// sit at exactly 600s because that is where the thank-you popup froze
				// them. Read from the player's own row, which means a finished demo whose
				// save was wiped on dismiss reads as unfinished here; the device-scoped
				// `demoCompletion` block in the summary is the one that survives that.
				const DEMO_FOREST_SECONDS = 10 * 60;
				if (edi === 'demo') {
					flags.push(['Finished the demo', n((p.areaSeconds || {}).forest) >= DEMO_FOREST_SECONDS]);
				}
				const checklist = cardTitled(
					'Milestones',
					null,
					`<div class="checklist">${flags
						.map(
							([l, on]) =>
								`<span class="checkitem"><span class="ck ${on ? 'on' : 'off'}">${on ? '✓' : '·'}</span>${l}</span>`,
						)
						.join('')}</div>`,
				);

				const totalActs = Object.values(counts).reduce((a, b) => a + n(b), 0);
				const actionsCard = cardTitled(
					'Everything they did',
					`${fmt(totalActs)} actions`,
					barRows(objToEntries(counts), { labelMap: ACTION_LABELS }),
				);
				const areaCard = Object.keys(areaMin).length
					? cardTitled(
							'Time by area',
							null,
							barRows(objToEntries(areaMin), { cls: 'sky', fmtNum: (v) => `${fmt(v)}m` }),
						)
					: '';

				const recent = (ach.recent || []).slice(0, 8);
				const recCard = recent.length
					? cardTitled(
							'Recent achievements',
							`${n(ach.earned)} earned`,
							`<div class="reclist">${recent
								.map(
									(r) =>
										`<div class="recrow"><b>${esc(r.name || r.id || '')}</b><span>${r.earnedAt ? new Date(r.earnedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''}</span></div>`,
								)
								.join('')}</div>`,
						)
					: '';

				const onboard = cardTitled(
					'Onboarding',
					null,
					`<div class="grid kpis">${[
						kpi(p.creationSeconds != null ? `${n(p.creationSeconds)}<small>s</small>` : '—', 'Creation time'),
						kpi(
							p.timeToFirstActionSeconds != null ? `${n(p.timeToFirstActionSeconds)}<small>s</small>` : '—',
							'Time to 1st action',
						),
						kpi(tut, 'Tutorial'),
					].join('')}</div>`,
				);

				const prefsCard = prefsCardHTML(p);

				const meta = esc(
					[p.platform, p.os, p.version, LANG_LABELS[p.language] || p.language].filter(Boolean).join(' · '),
				);
				const when = [joined, last].filter(Boolean).join(' · ');
				/* Carried over from the demo. Spelled out here rather than left as a
				 * chip: the modal is where you go to find out what actually happened,
				 * and "1h 46m in the demo, then bought it" is the story. */
				const mc = p.conversion || {};
				const mconv = p.convertedFromDemo
					? `<span class="hltag hlconv" title="${mc.exact ? 'Stamped when the save was exported' : 'Inferred from this save’s demo row — it predates the export stamp'}">demo → full${
							mc.demoPlaySeconds ? ` · ${fmtDur(mc.demoPlaySeconds)} in the demo` : ''
						}${mc.at ? ` · ${mc.exact ? '' : '~'}${new Date(mc.at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : ''}</span>`
					: '';
				return (
					`<button class="modal-close" data-close aria-label="Close">×</button>` +
					`<div class="modal-head"><div class="mav">${avatarSVG(p.appearance)}</div><div><h2>${esc(p.name || 'Unnamed')}</h2>` +
					`<div class="msub"><span class="hledi ${edi}">${edi}</span>${mconv}${p.idle ? `<span class="hlidle" title="Over ${n(p.playMinutes)} minutes at ${n(p.actionsPerMinute)} actions/min — counted as a window left open, not play">idle window</span>` : ''}${meta ? `<span>${meta}</span>` : ''}${when ? `<span>${when}</span>` : ''}</div></div></div>` +
					kpis +
					`<div class="grid two" style="margin-top:.8rem">${progress}${checklist}</div>` +
					`<div style="margin-top:.8rem">${actionsCard}</div>` +
					(areaCard
						? `<div class="grid two" style="margin-top:.8rem">${areaCard}${recCard}</div>`
						: recCard
							? `<div style="margin-top:.8rem">${recCard}</div>`
							: '') +
					(prefsCard
						? `<div class="grid two" style="margin-top:.8rem">${onboard}${prefsCard}</div>`
						: `<div style="margin-top:.8rem">${onboard}</div>`)
				);
			}

			/** Open the modal for a player id (looked up from the last render). */
			function openPlayerModal(pid) {
				const p = PLAYERS_BY_ID[pid];
				if (!p) return;
				if (!modalEl) {
					modalEl = document.createElement('div');
					modalEl.className = 'modal-overlay';
					modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true"></div>`;
					document.body.appendChild(modalEl);
					modalEl.addEventListener('click', (e) => {
						if (e.target === modalEl || (e.target.closest && e.target.closest('[data-close]'))) closePlayerModal();
					});
				}
				modalEl.querySelector('.modal').innerHTML = playerModalHTML(p);
				modalEl.style.display = 'flex';
				document.body.classList.add('modal-open');
			}
			function closePlayerModal() {
				if (modalEl) modalEl.style.display = 'none';
				document.body.classList.remove('modal-open');
			}

			/* ------------------------------------------------------------------ *
			 * Main render
			 * ------------------------------------------------------------------ */
			/* Whether the failure panels are on screen. Off by default, remembered
			 * across reloads — if you opened them because you were chasing something,
			 * a refresh mid-chase shouldn't close them again. */
			const SHOW_PROBLEMS_KEY = 'ww-dashboard-show-problems';
			let SHOW_PROBLEMS = false;
			try {
				SHOW_PROBLEMS = localStorage.getItem(SHOW_PROBLEMS_KEY) === '1';
			} catch {
				/* private mode — default to hidden */
			}

			/* What the badge counts.
			 *
			 * Deliberately NOT refusals. A refusal is the server saying "not enough
			 * materials" — that is the game working, and every player generates them,
			 * so a lifetime refusal count would sit in the thousands and mean nothing.
			 * Badging it would train you to ignore the badge, which is the one failure
			 * mode a hidden panel cannot survive.
			 *
			 * Crashes and records that will not decode are different: neither should
			 * ever happen, so any number above zero is worth the walk. */
			function problemCount() {
				const crashes = (GAMEPLAYHEALTH && GAMEPLAYHEALTH.clientErrors && GAMEPLAYHEALTH.clientErrors.total) || 0;
				const badSaves = (SAVEHEALTH && SAVEHEALTH.affected) || 0;
				return { crashes: n(crashes), badSaves: n(badSaves), total: n(crashes) + n(badSaves) };
			}

			function syncProblemsButton() {
				const btn = document.getElementById('problems');
				const label = document.getElementById('problems-label');
				if (!btn || !label) return;
				// Nothing to show at all (endpoints unavailable) — hide the control rather
				// than offer a button that opens an empty page.
				const havePanels = !!(GAMEPLAYHEALTH || SAVEHEALTH);
				btn.hidden = !havePanels;
				if (!havePanels) return;
				const p = problemCount();
				const bits = [];
				if (p.crashes) bits.push(`${fmt(p.crashes)} ${p.crashes === 1 ? 'crash' : 'crashes'}`);
				if (p.badSaves) bits.push(`${fmt(p.badSaves)} unreadable ${p.badSaves === 1 ? 'save' : 'saves'}`);
				// It swaps the whole page, so when it is on the button is a way BACK, not
				// a "hide" — labelling a mode switch by what it conceals leaves you
				// hunting for the way out.
				label.innerHTML = SHOW_PROBLEMS
					? '← Dashboard'
					: 'Problems' + (p.total ? `<span class="pbadge">${fmt(p.total)}</span>` : '');
				btn.title = p.total
					? bits.join(' · ') + ' — plus every refusal the server has given'
					: 'No crashes or unreadable saves. Click for refusals and the full breakdown.';
				btn.classList.toggle('on', SHOW_PROBLEMS);
				btn.classList.toggle('bad', p.total > 0);
				btn.setAttribute('aria-expanded', SHOW_PROBLEMS ? 'true' : 'false');
			}

			/* The last payload, kept so the date picker can redraw without refetching.
			 * The range only scopes a chart the server already sent in full, so a
			 * round-trip per click would be latency for nothing. */
			let LAST_DATA = null;
			function rerender() {
				if (LAST_DATA) render(LAST_DATA);
			}

			function render(data) {
				LAST_DATA = data;
				const s = (data && data.summary) || {};
				const players = (data && data.players) || [];
				const A = s.audience || {},
					E = s.engagement || {},
					R = s.retention || {},
					P = s.progression || {};
				const flt = (data && data.filters) || {};
				const out = [];

				/* ---- Overview KPIs ---- */
				const versionLabel = flt.version ? `v${flt.version}${flt.versionMode === 'min' ? ' & newer' : ''}` : '';
				const activeFilters = [versionLabel, flt.edition, flt.platform].filter(Boolean).map(esc);
				const overviewSub = activeFilters.length
					? `filtered to ${activeFilters.join(' · ')}`
					: 'who is out there right now';
				out.push(
					sec(
						'Overview',
						overviewSub,
						`<div class="grid kpis kpis-6">${[
							kpi(fmt(s.players), 'Total caretakers', 'unique anonymous saves'),
							kpi(`<span class="accent">${fmt(A.activeNow)}</span>`, 'Active now', 'seen in the last 5 minutes'),
							kpi(fmt(A.activeLast24h), 'Active · 24h'),
							kpi(fmt(A.activeLast7d), 'Active · 7d'),
							kpi(fmt(A.activeLast14d), 'Active · 14d'),
							kpi(fmt(A.newLast24h), 'New · 24h', `${fmt(A.newLast7d)} in the last 7 days`),
						].join('')}</div>`,
					),
				);

				/* ---- New caretakers per day ----
				 * Directly under Overview: same audience question with a time axis, and
				 * the 24h / 7d tiles above are two points on this line. */
				const dailySection = dailyHTML(s);
				if (dailySection) out.push(dailySection);

				/* ---- What is going wrong ----
				 * Everything else on this page counts what players DID. That leaves a whole
				 * class of problem invisible: a recipe gated on the wrong biome refuses
				 * everyone who finds it and every activity counter still looks healthy,
				 * because a refusal isn't an activity. A crash in the interface is worse —
				 * it produces no events at all, and the player just closes the game.
				 *
				 * Refusals are keyed by message key rather than message text, so one problem
				 * doesn't split across languages. */
				let healthSection = '';
				// Renders whenever the endpoint answers, including at zero — unlike Save
				// health below, which stays quiet because an unreadable save is genuinely
				// exceptional. Refusals are not: any player who runs short of materials
				// makes one, so a count of zero here almost certainly means the panel
				// isn't wired up rather than that nothing has gone wrong. Hiding it made
				// those two states look identical, and left no way to tell a healthy
				// instance from an endpoint that never deployed.
				if (GAMEPLAYHEALTH) {
					const gh = GAMEPLAYHEALTH;
					const ref = gh.refusals || {};
					const cli = gh.clientErrors || {};
					// The key's last segment reads well enough on its own ("notEnough",
					// "recipeLocked") and the full path is noise in a bar chart.
					const shortCode = (c) => String(c).split('.').pop();
					const refusalRows = (ref.top || [])
						.map(
							(r) =>
								`<tr><td><code>${esc(shortCode(r.code))}</code></td><td class="num">${fmt(r.count)}</td>` +
								`<td class="num">${r.status || '—'}</td>` +
								`<td class="num">${r.lastSeenAt ? new Date(r.lastSeenAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'}</td></tr>`,
						)
						.join('');
					const crashRows = (cli.top || [])
						.map(
							(e) =>
								`<tr><td>${esc(e.message)}</td><td><code>${esc(e.where || '?')}</code></td>` +
								`<td class="num">${fmt(e.count)}</td>` +
								`<td class="num">${e.lastSeenAt ? new Date(e.lastSeenAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'}</td></tr>`,
						)
						.join('');
					healthSection = sec(
						'What is going wrong',
						'refusals and interface crashes — counts and message keys only',
						`<div class="grid kpis">${[
							kpi(
								`<span class="accent">${fmt(cli.total)}</span>`,
								'Interface crashes',
								`${fmt(cli.distinct)} distinct`,
							),
							kpi(fmt(ref.total), 'Refusals', `${fmt(ref.distinct)} distinct reasons`),
							kpi(fmt(ref.serverFaults), 'Server faults', '5xx — the game falling over, not saying no'),
						].join('')}</div>` +
							(refusalRows
								? `<div class="card" style="margin-top:.8rem"><h3>Most refused<span class="tag">what players are being turned away from</span></h3>` +
									`<table class="vs"><thead><tr><th>Reason</th><th class="num">Hits</th><th class="num">Status</th><th class="num">Last seen</th></tr></thead><tbody>${refusalRows}</tbody></table></div>`
								: '') +
							(crashRows
								? `<div class="card" style="margin-top:.8rem"><h3>Crashes<span class="tag">top 25 by count</span></h3>` +
									`<table class="vs"><thead><tr><th>Message</th><th>Where</th><th class="num">Hits</th><th class="num">Last seen</th></tr></thead><tbody>${crashRows}</tbody></table></div>`
								: '') +
							(!refusalRows && !crashRows
								? `<div class="card" style="margin-top:.8rem"><h3>Nothing recorded yet<span class="tag">the panel is live</span></h3>` +
									`<p class="emptynote">No refusals or crashes have been reported since this instance started collecting. ` +
									`Refusals are ordinary — a player short on materials makes one — so if this stays empty during real play, ` +
									`check that the <code>Refusal</code> and <code>ClientError</code> tables exist.</p></div>`
								: ''),
					);
				}

				/* ---- Save health ----
				 * Records that would not decode, from GET /SaveHealth/. Sits directly above
				 * the player highlights: an unreadable save is the only thing on this page a
				 * player feels directly, and it used to be visible only to someone tailing
				 * server logs. Renders nothing at zero, so a healthy instance stays quiet. */
				let saveSection = '';
				if (SAVEHEALTH && SAVEHEALTH.affected > 0) {
					const sh = SAVEHEALTH;
					const KIND_LABELS = { unreadable: 'Could not decode at all', refused: 'Partial — salvage refused' };
					const rows = (sh.recent || [])
						.map(
							(r) =>
								`<tr><td><code>${esc(r.table || '?')}</code></td><td><code>${esc(r.recordId || '?')}</code></td>` +
								`<td>${esc(KIND_LABELS[r.kind] || r.kind || '?')}</td><td class="num">${fmt(r.count)}</td>` +
								`<td class="num">${r.lastSeenAt ? new Date(r.lastSeenAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'}</td></tr>`,
						)
						.join('');
					saveSection = sec(
						'Save health',
						'stored records that could not be read — ids and counts only',
						`<div class="grid kpis">${[
							kpi(
								`<span class="accent">${fmt(sh.savesAffected)}</span>`,
								'Saves affected',
								'player rows that would not open',
							),
							kpi(fmt(sh.affected), 'Records affected', 'across every table'),
							kpi(fmt(sh.events), 'Read failures', 'total attempts that hit a bad record'),
						].join('')}</div><div class="grid two" style="margin-top:.8rem">` +
							cardTitled('By table', 'which data is rotting', barRows(objToEntries(sh.byTable), { cls: 'gold' })) +
							cardTitled(
								'By kind',
								'how it failed',
								barRows(objToEntries(sh.byKind), { labelMap: KIND_LABELS, cls: 'gold' }),
							) +
							`</div>` +
							(rows
								? `<div class="card" style="margin-top:.8rem"><h3>Most recent<span class="tag">last 25</span></h3>` +
									`<table class="vs"><thead><tr><th>Table</th><th>Record</th><th>Failure</th><th class="num">Hits</th><th class="num">Last seen</th></tr></thead><tbody>${rows}</tbody></table></div>`
								: ''),
					);
				}

				/* ---- Landing page (site traffic + mailing list) ----
				 * Fed by the public GET /LandingStats/ rollup (aggregate counters only —
				 * mailing-list emails stay behind the admin-only ListMailingList). Loaded
				 * best-effort alongside /Metrics/; the section simply doesn't render if the
				 * endpoint isn't deployed yet. Unaffected by the version/edition filters —
				 * these are site numbers, not game numbers.
				 *
				 * Built here (it needs `LANDING`), but pushed LAST — see the bottom of this
				 * function. These are site numbers rather than game numbers, so they sit below
				 * everything about the game itself. */
				let landingSection = '';
				if (LANDING && LANDING.totals) {
					const lt = LANDING.totals;
					const CLICK_LABELS = {
						appstore: 'Mac App Store',
						itch: 'itch.io',
						demo: 'Free demo',
						theme: 'Theme played',
						gallery: 'Gallery opened',
						privacy: 'Privacy page',
						support: 'Support page',
						'get-nav': 'Get the game (nav)',
						'edu-nav': 'For teachers (nav)',
						'pdf-guide': 'Educator guide (click)',
						'pdf-worksheets': 'Worksheets (click)',
						'school-copy': 'Classroom copy request',
						other: 'Other',
					};
					const ldays = LANDING.days || [];
					const todayRow = ldays.find((d) => d.day === LANDING.today) || {};
					// Server-side download counts from the two PDF endpoints — the honest
					// number, since it also catches direct links teachers pass around,
					// which never fire the landing page's click beacon.
					const dl = lt.downloads || {};
					const dlToday = todayRow.downloads || {};
					const DL_LABELS = { guide: 'Educator Guide', worksheets: 'Student Worksheets' };
					const dayCols = {};
					for (const d of ldays.slice(-14)) dayCols[String(d.day).slice(5)] = n(d.visits);
					landingSection = sec(
						'Landing page',
						'wild.willows.harperfabric.com — visits, link clicks & mailing list',
						`<div class="grid kpis">${[
							kpi(fmt(lt.visits), 'Visits', `${fmt(lt.uniques)} first-time visitors`),
							kpi(
								`<span class="accent">${fmt(todayRow.visits)}</span>`,
								'Visits today',
								`${fmt(todayRow.totalClicks)} clicks · ${fmt(todayRow.signups)} signups today`,
							),
							kpi(fmt(lt.totalClicks), 'Link clicks', 'store, demo & theme buttons'),
							kpi(
								fmt(lt.totalDownloads),
								'PDF downloads',
								`${fmt(dl.guide)} guide · ${fmt(dl.worksheets)} worksheets`,
							),
							kpi(
								`<span class="accent">${fmt(lt.signups)}</span>`,
								'Mailing list',
								'signups all-time · emails visible only to admin',
							),
						].join('')}</div><div class="grid two" style="margin-top:.8rem">` +
							cardTitled(
								'Clicks by link',
								'all-time',
								barRows(objToEntries(lt.clicks), { labelMap: CLICK_LABELS, cls: 'gold' }),
							) +
							cardTitled('Daily visits', `last ${Object.keys(dayCols).length || 0} days`, histCols(dayCols)) +
							`</div>` +
							cardTitled(
								'Classroom PDFs',
								`downloaded all-time · ${fmt(Object.values(dlToday).reduce((a, v) => a + n(v), 0))} today`,
								barRows(objToEntries(dl), { labelMap: DL_LABELS, cls: 'sky' }),
							),
					);
				}

				/* ---- Engagement KPIs ---- */
				out.push(
					sec(
						'Engagement',
						'time spent tending the wild',
						`<div class="grid kpis">${[
							kpi(`${fmt(E.totalPlayHours)}<small>hrs</small>`, 'Total play time'),
							kpi(`${fmt(E.avgPlayMinutesPerPlayer)}<small>min</small>`, 'Avg per caretaker'),
							kpi(fmt(E.totalSessions), 'Sessions', `${n(E.avgSessionsPerPlayer)} avg per caretaker`),
							kpi(`${fmt(E.avgSessionMinutes)}<small>min</small>`, 'Avg session length'),
							kpi(fmt(E.totalActions), 'Total actions', `${fmt(E.avgActionsPerPlayer)} avg per caretaker`),
							kpi(
								`<span class="accent">${pct(R.returningRatePct)}</span>`,
								'Return rate',
								`${fmt(R.returningPlayers)} came back`,
							),
						].join('')}</div>` + sessionShapeHTML(s) + clockNoteHTML(s),
					),
				);

				/* ---- Editions: demo vs full ---- */
				const edOf = (p) => (p.edition === 'demo' ? 'demo' : 'full');
				const demoPlayers = players.filter((p) => edOf(p) === 'demo');
				const fullPlayers = players.filter((p) => edOf(p) === 'full');
				const dStat = editionStats(demoPlayers),
					fStat = editionStats(fullPlayers);
				const edSum = s.editions || {};
				const playersDonut = donut(
					[
						{ label: 'Full', value: edSum.full != null ? edSum.full : fStat.count, color: '#4a7c46' },
						{ label: 'Demo', value: edSum.demo != null ? edSum.demo : dStat.count, color: '#d9a441' },
					].filter((x) => x.value),
				);
				const vsRows = [
					{ key: 'count', label: 'Caretakers' },
					{ key: 'playHours', label: 'Total play time', suf: 'h' },
					{ key: 'avgMin', label: 'Avg play / caretaker', suf: 'm' },
					{ key: 'avgSessions', label: 'Avg sessions / caretaker' },
					{ key: 'totalActions', label: 'Total actions' },
					{ key: 'avgActions', label: 'Avg actions / caretaker' },
					{ key: 'avgAch', label: 'Avg achievements earned' },
					{ key: 'avgHealth', label: 'Avg biome health', suf: '%' },
					{ key: 'avgBiomes', label: 'Avg biomes unlocked' },
					{ key: 'returningPct', label: 'Returned (2+ sessions)', suf: '%' },
					{ key: 'collected', label: 'Collected a resource', suf: '%' },
					{ key: 'crafted', label: 'Crafted an item', suf: '%' },
					{ key: 'placed', label: 'Placed an object', suf: '%' },
					{ key: 'attractedAnimal', label: 'Attracted an animal', suf: '%' },
					{ key: 'unlockedSecondBiome', label: 'Unlocked 2nd biome', suf: '%' },
				];
				out.push(
					sec(
						'Editions · demo vs full',
						'how the free demo compares to the full game',
						cardTitled('Caretakers by edition', 'who is playing', playersDonut) +
							`<div class="card" style="margin-top:.8rem"><h3>Every metric, side by side<span class="tag">demo vs full</span></h3>` +
							vsTable(vsRows, dStat, fStat) +
							`</div>`,
					),
				);

				/* ---- Player highlights (rendered here, appended at the bottom) ---- */
				let charSection = '';
				// Everyone who played more than 5 minutes — most engaged first. Each card is
				// clickable and opens a full breakdown modal (looked up by playerId).
				PLAYERS_BY_ID = {};
				for (const p of players) if (p && p.playerId) PLAYERS_BY_ID[p.playerId] = p;
				/* Idle windows are excluded from this section outright.
				 *
				 * The 5-minute gate is a PLAY-TIME gate, and a window left open all
				 * afternoon clears it without anybody touching the game — so the idle
				 * saves were not just present here, they sorted to the TOP, and
				 * "Most playtime" was being awarded to an abandoned tab. A section
				 * called Player highlights should show players.
				 *
				 * They are only hidden from this wall, not dropped: they still count in
				 * the head count, the funnel and every aggregate above, they are still in
				 * PLAYERS_BY_ID so a modal opened for one still works, and the count of
				 * what was left out is printed in the subtitle rather than left implied. */
				const qualified = players.filter((p) => p && n(p.playSeconds) > 300);
				const idleHidden = qualified.filter((p) => p.idle).length;
				const engaged = qualified.filter((p) => !p.idle);
				if (engaged.length) {
					const top = [...engaged].sort(
						(a, b) =>
							n(b.playSeconds) - n(a.playSeconds) ||
							n(b.totalActions) - n(a.totalActions) ||
							n(b.achievements && b.achievements.points) - n(a.achievements && a.achievements.points),
					);

					// Superlative badges: each dimension's true leader (within the shown set)
					// earns its tag; a standout who leads several shows up to two of them.
					const supTags = {};
					const assignSup = (key, label) => {
						let best = 0,
							idx = -1;
						top.forEach((p, i) => {
							const v = n(key(p));
							if (v > best) {
								best = v;
								idx = i;
							}
						});
						if (idx >= 0) (supTags[idx] = supTags[idx] || []).push(label);
					};
					assignSup((p) => p.playSeconds, 'Most playtime');
					assignSup((p) => p.totalActions, 'Most active');
					assignSup((p) => p.achievements && p.achievements.earned, 'Most achievements');
					assignSup((p) => p.biomeSummary && p.biomeSummary.biomesFullyRestored, 'Most restored');

					const stat = (v, l) => `<div class="hlstat"><b>${v}</b><span>${l}</span></div>`;
					// "Active now" uses the same 5-minute window as the Overview KPI, so the two
					// always agree about who is currently playing.
					const isActiveNow = (p) => p.minutesSinceActive != null && n(p.minutesSinceActive) <= 5;
					const cards = top
						.map((p, i) => {
							const bs = p.biomeSummary || {};
							const edi = p.edition === 'demo' ? 'demo' : 'full';
							const live = isActiveNow(p);
							const tags = (supTags[i] || [])
								.slice(0, 2)
								.map((t) => `<span class="hltag">${t}</span>`)
								.join('');
							// The green border is the ask, but colour alone isn't a reliable cue, so the
							// card also carries it in its tooltip and an aria-label for screen readers.
							const liveTag = live ? `<span class="hltag hllive">Active now</span>` : '';
							// The best thing a card can say about a player: they played the
							// demo, bought the game, and carried this meadow across.
							const cv = p.conversion || {};
							const convTag = p.convertedFromDemo
								? `<span class="hltag hlconv" title="Played the demo${cv.demoPlaySeconds ? ` for ${fmtDur(cv.demoPlaySeconds)}` : ''}, then bought the game and imported this save${cv.at ? ` · ${cv.exact ? '' : 'around '}${new Date(cv.at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : ''}">demo → full</span>`
								: '';
							return `<div class="hlcard${live ? ' active-now' : ''}" data-pid="${esc(p.playerId || '')}" role="button" tabindex="0" title="${live ? 'Active now · c' : 'C'}lick for full breakdown"${live ? ' aria-label="Active now"' : ''}><div class="hlav">${avatarSVG(p.appearance)}</div><div class="hlbody"><div class="hltop">${liveTag}${convTag}${tags}<span class="hledi ${edi}">${edi}</span></div><div class="hlstats">${[
								stat(fmtDur(p.playSeconds), 'played'),
								stat(fmt(n(p.sessions)), n(p.sessions) === 1 ? 'session' : 'sessions'),
								stat(fmt(n(p.totalActions)), 'actions'),
								stat(`${n(p.achievements && p.achievements.earned)}★`, 'achievements'),
								stat(fmt(n(bs.totalAnimalsReturned)), 'animals'),
								stat(fmt(n(p.unlockedBiomes || bs.biomesUnlocked)), 'biomes'),
							].join('')}</div></div></div>`;
						})
						.join('');
					charSection = sec(
						'Player highlights',
						`everyone who played more than 5 min · ${top.length} caretakers` +
							(idleHidden ? ` · ${fmt(idleHidden)} idle ${idleHidden === 1 ? 'window' : 'windows'} hidden` : '') +
							` · click a card for the full breakdown`,
						`<div class="card"><div class="hlgrid">${cards}</div></div>`,
					);
				}

				/* ---- Acquisition + Activation funnels ---- */
				const acq = s.acquisition || {};
				const fun = s.funnel || {};
				const dc = s.demoCompletion || {};
				const acqCards = cardTitled(
					'Acquisition funnel',
					'per device',
					funnel([
						{ label: 'Opened the app', value: acq.devices },
						{ label: 'Created a character', value: acq.converted },
					]) +
						`<div class="grid three" style="margin-top:1rem">${[
							// Raw opens is the one number here a single machine can dominate:
							// devices and conversion move by one device, this moves by every
							// launch. The hint says what has been taken out of it, so the
							// figure is never quietly smaller than the last time you looked.
							kpi(
								fmt(acq.totalOpens),
								'App opens',
								(acq.excludedDevices || {}).matched
									? `excludes ${fmt(acq.excludedDevices.opens)} from ${fmt(acq.excludedDevices.matched)} hidden ${acq.excludedDevices.matched === 1 ? 'device' : 'devices'}`
									: '',
							),
							kpi(`<span class="accent">${pct(acq.conversionPct)}</span>`, 'Conversion'),
							kpi(pct(acq.bounceRatePct), 'Bounced'),
						].join('')}</div>`,
				);
				const demoCard = dc.demoInstalls
					? cardTitled(
							'Demo completion',
							'reached the 5-animal hard-stop',
							funnel([
								{ label: 'Made a character', value: dc.createdCharacter },
								{ label: 'Finished the demo', value: dc.reachedGoal },
							]) +
								`<div class="grid three" style="margin-top:1rem">${[
									kpi(fmt(dc.demoInstalls), 'Demo installs'),
									kpi(
										`<span class="accent">${pct(dc.completionPct)}</span>`,
										'Completion',
										'of demo players who started',
									),
									kpi(fmt(dc.reachedGoal), 'Finished'),
								].join('')}</div>`,
						)
					: '';

				/* ---- Carried over from the demo ----
				 * "Finished the demo" measures the demo. THIS measures whether the demo
				 * sells the game: they bought it and brought their meadow across, which
				 * is a stronger statement than either an install or a completion. Its
				 * own card because burying it in a completion funnel undersells it. */
				const cvs = s.conversions || {};
				const convCard = cvs.demoToFull
					? cardTitled(
							'Carried over from the demo',
							'bought the game and imported their save',
							`<div class="grid three">${[
								kpi(
									`<span class="accent">${fmt(cvs.demoToFull)}</span>`,
									cvs.demoToFull === 1 ? 'Caretaker' : 'Caretakers',
									cvs.inferred
										? `${fmt(cvs.inferred)} matched to their demo save${cvs.stamped ? `, ${fmt(cvs.stamped)} stamped at export` : ''}`
										: 'stamped when the save was exported',
								),
								kpi(pct(cvs.ratePct), 'Of demo saves', `${fmt(cvs.demoSavesSeen)} demo saves reported in`),
								kpi(
									`${fmt(cvs.avgDemoMinutesBeforeBuying)}<small>m</small>`,
									'Demo play first',
									'average, before carrying over',
								),
							].join('')}</div>`,
						)
					: '';
				// Every activation signal we have. "Created" is the entry point (always first
				// and largest); the rest are sorted by count so the funnel always reads
				// top-down. They're independent booleans, not strict prerequisites, so sorting
				// by count — not by an assumed sequence — is the honest way to show them.
				const funRest = [
					{ label: 'Collected a resource', value: fun.collected },
					{ label: 'Terraformed the land', value: fun.terraformed },
					{ label: 'Planted something', value: fun.planted },
					{ label: 'Crafted an item', value: fun.crafted },
					{ label: 'Placed an object', value: fun.placed },
					{ label: 'Attracted an animal', value: fun.attractedAnimal },
					{ label: 'Upgraded a tool', value: fun.upgradedTool },
					{ label: 'Built a home', value: fun.builtHome },
					{ label: 'Upgraded a home', value: fun.upgradedHome },
					{ label: 'Unlocked 2nd biome', value: fun.unlockedSecondBiome },
				]
					.filter((st) => st.value != null)
					.sort((a, b) => n(b.value) - n(a.value));
				const funSteps = funnel([{ label: 'Created character', value: fun.created }, ...funRest]);
