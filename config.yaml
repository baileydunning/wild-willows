# Wild Willows — Harper application config
#
# ENDPOINTS ONLY: the hosted Harper serves no static files. The game UI ships
# inside the desktop app (locally, `npm run dev:web` serves it and proxies API
# calls here). Everything the site serves — the landing page, the policy and
# age-suitability pages, support, teachers, the dashboard, images, the classroom
# PDFs, robots.txt and sitemap.xml — comes from endpoints in resources.js (see
# the export map at the end of that file), not from static hosting.
rest: true

graphqlSchema:
  files: 'schema.graphql'

jsResource:
  files: 'resources.js'

# Seed-table files only — enumerated (brace glob) rather than data/*.json
# because data/weather.json is NOT a seed file: it's build-time config imported
# by server/weather.ts + src/weather.ts, with no database/table/records shape,
# and the data loader throws "missing required table property" if it sweeps it up.
dataLoader:
  files: 'data/{achievements,animals-1,animals-2,biomes,habitat-objects,recipes,resources,tools}.json'
