name: Android build & publish

# Builds the Capacitor Android app (the same solo/offline web bundle the desktop
# app ships) and, on an android-v* or plain v* tag, publishes the APK to the
# `android` channel of bai13y/wild-willows with butler.
#
# WHY CI AND NOT LOCALLY: the Android SDK, Gradle and Google's Maven repo are all
# large downloads that CI already has fast, cached access to — and this keeps the
# release artifact reproducible instead of "whatever was on Bailey's Mac".
#
# Tag scheme (mirrors desktop-build.yml / mas-release.yml):
#   android-v0.3.0 → Android ONLY (this workflow)
#   v0.3.0         → this workflow AND desktop-build.yml AND mas-release.yml
#   Actions tab → Run workflow → build artifacts only, no publish
#
# Required repo secrets for a SIGNED build (all four, or none):
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks  (base64 -i release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# With none set the job still runs and produces a DEBUG-SIGNED apk — useful for a
# smoke test, but do not put it on itch and it will not upload to Play.
#
# Required for publishing: BUTLER_API_KEY (already set for the desktop workflows).

on:
  push:
    tags: ['android-v*', 'v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to itch even on a manual run'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Capacitor's Gradle plugin needs a JDK; 21 is what AGP expects for API 36.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Belt and braces: if the Capacitor packages aren't in package.json yet
      # (i.e. `npm run android:init` hasn't been run and committed locally), pull
      # them in so the workflow is self-sufficient on a fresh branch. Once they
      # ARE committed, `npm ci` above has already installed them and this no-ops.
      - name: Ensure Capacitor is installed
        run: |
          set -euo pipefail
          if [ ! -d node_modules/@capacitor/cli ]; then
            echo "Capacitor not in the lockfile — installing latest."
            npm i -D @capacitor/core@latest @capacitor/cli@latest \
                     @capacitor/android@latest @capacitor/filesystem@latest
          else
            echo "Capacitor already installed from the lockfile."
          fi

      # build:server regenerates resources.js, which the SOLO backend bundles —
      # so this is not optional even though nothing here talks to Harper.
      - name: Build web bundle
        run: npm run build

      - name: Scaffold and patch the Android project
        run: |
          set -euo pipefail
          # android/ is gitignored and generated. `cap add` refuses to overwrite,
          # so only add when absent; `cap sync` then copies web/ + plugins in.
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/patch-android.mjs

      # versionName comes from the tag so the store listing matches the release;
      # versionCode must be a monotonically increasing integer, and the run number
      # is the cheapest thing that satisfies that forever. (Play rejects a reused
      # versionCode, so never hand-set this.)
      - name: Stamp version
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME:-manual}"
          VERSION="${REF#android-}"; VERSION="${VERSION#v}"
          case "$VERSION" in
            ''|manual|*[!0-9.]*) VERSION=$(node -p "require('./package.json').version") ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          grep -E 'versionName|versionCode' android/app/build.gradle

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — building DEBUG-SIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK (itch) and AAB (Play)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # APK for itch (direct sideload); AAB for Play. Same code, different wrapper.
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-android
          find android/app/build/outputs -name '*.apk' -o -name '*.aab' | while read -r f; do
            cp "$f" "dist-android/wild-willows-${VERSION}-$(basename "$f")"
          done
          ls -lh dist-android

      - uses: actions/upload-artifact@v4
        with:
          name: wild-willows-android
          if-no-files-found: error
          retention-days: 14
          path: dist-android/*

    outputs:
      signed: ${{ steps.keystore.outputs.signed }}

  publish:
    name: Publish APK to itch
    needs: build
    # Only publish a properly signed build — a debug-signed APK on a public itch
    # page is a support burden (it can't be upgraded to a Play install later).
    if: needs.build.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wild-willows-android
          path: artifacts

      - name: Install butler
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fL --connect-timeout 20 --retry 5 --retry-delay 5 --retry-all-errors \
                 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default; then
              break
            fi
            echo "butler download attempt $i failed; retrying in 10s…"
            sleep 10
            [ "$i" = 5 ] && { echo "Could not download butler after 5 attempts"; exit 1; }
          done
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          "$HOME/butler/butler" -V

      - name: Push APK to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          BUTLER="$HOME/butler/butler"
          GAME="bai13y/wild-willows"
          VERSION="${GITHUB_REF_NAME#android-}"; VERSION="${VERSION#v}"

          apk=$(ls artifacts/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$apk" ]; then
            echo "No APK found — nothing to publish."; exit 1
          fi
          echo "Pushing $apk -> $GAME:android (v$VERSION)"
          "$BUTLER" push "$apk" "$GAME:android" --userversion "$VERSION"
          "$BUTLER" status "$GAME"
