name: Desktop build & publish

# Builds the solo-only desktop app for Windows, macOS, and Linux on native
# runners. On a version-tag push it then publishes each build to itch.io with
# butler (channels windows / osx / linux of bai13y/wild-willows). A plain manual
# run just builds the artifacts and skips publishing.
#
# Triggers:
#   git tag v0.1.0 && git push origin v0.1.0   → build AND publish to itch
#   Actions tab → Run workflow                 → build artifacts only (no publish)
#
# Required repo secret for publishing:
#   BUTLER_API_KEY   from https://itch.io/user/settings/api-keys

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Don't let two runs on the same tag/ref pile up.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wild-willows-windows
          - os: macos-latest
            artifact: wild-willows-macos
          - os: ubuntu-latest
            artifact: wild-willows-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web client + server bundle
        run: npm run build

      # macOS: signed + notarized. Kept separate from the other OSes so CSC_LINK
      # is NEVER defined on a non-mac runner — Windows reads CSC_LINK as its own
      # signing cert (WIN_CSC_LINK) and fails on an empty value. The version is
      # taken from the tag (v0.1.1 → 0.1.1), so package.json is never bumped.
      - name: Package desktop app (macOS, signed)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then EXTRA="-c.extraMetadata.version=${GITHUB_REF_NAME#v}"; fi
          npx electron-builder --publish never $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows + Linux: unsigned (no signing env at all).
      - name: Package desktop app (Windows / Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then EXTRA="-c.extraMetadata.version=${GITHUB_REF_NAME#v}"; fi
          npx electron-builder --publish never $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers/archives
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage

  # Publish to itch.io with butler — only on a version-tag push.
  publish:
    name: Publish to itch.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install butler
        run: |
          set -euo pipefail
          # Retry on transient DNS/network errors (curl exit 6 = couldn't resolve host).
          for i in 1 2 3 4 5; do
            if curl -fL --connect-timeout 20 --retry 5 --retry-delay 5 --retry-all-errors \
                 -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default; then
              break
            fi
            echo "butler download attempt $i failed; retrying in 10s…"
            sleep 10
            [ "$i" = 5 ] && { echo "Could not download butler after 5 attempts"; exit 1; }
          done
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          "$HOME/butler/butler" -V

      - name: Push builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          BUTLER="$HOME/butler/butler"
          GAME="bai13y/wild-willows"
          VERSION="${GITHUB_REF_NAME#v}"   # tag v0.1.0 -> 0.1.0

          # Pick the best file per platform: portable zip for win/mac, AppImage for linux.
          win=$(ls artifacts/wild-willows-windows/*.zip 2>/dev/null | head -1 || true)
          [ -z "$win" ] && win=$(ls artifacts/wild-willows-windows/*.exe 2>/dev/null | head -1 || true)
          mac=$(ls artifacts/wild-willows-macos/*-mac.zip 2>/dev/null | head -1 || true)
          [ -z "$mac" ] && mac=$(ls artifacts/wild-willows-macos/*.dmg 2>/dev/null | head -1 || true)
          lin=$(ls artifacts/wild-willows-linux/*.AppImage 2>/dev/null | head -1 || true)

          push() { # $1=file  $2=channel
            if [ -n "$1" ]; then
              echo "Pushing $1 -> $GAME:$2 (v$VERSION)"
              "$BUTLER" push "$1" "$GAME:$2" --userversion "$VERSION"
            else
              echo "No file for channel $2 — skipping"
            fi
          }
          push "$win" windows
          push "$mac" osx
          push "$lin" linux

          "$BUTLER" status "$GAME"
