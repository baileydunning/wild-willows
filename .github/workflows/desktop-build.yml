name: Desktop build & publish

# Builds the solo-only desktop app for Windows, macOS, and Linux on native
# runners. On a version-tag push it then publishes each build to itch.io with
# butler (channels windows / osx / linux of bai13y/wild-willows). A plain manual
# run just builds the artifacts and skips publishing.
#
# Triggers:
#   git tag v0.1.0 && git push origin v0.1.0   → build AND publish to itch
#   Actions tab → Run workflow                 → build artifacts only (no publish)
#
# Required repo secret for publishing:
#   BUTLER_API_KEY   from https://itch.io/user/settings/api-keys

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Don't let two runs on the same tag/ref pile up.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: wild-willows-windows
          - os: macos-latest
            artifact: wild-willows-macos
          - os: ubuntu-latest
            artifact: wild-willows-linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web client + server bundle
        run: npm run build

      # macOS: signed + notarized. Kept separate from the other OSes so CSC_LINK
      # is NEVER defined on a non-mac runner — Windows reads CSC_LINK as its own
      # signing cert (WIN_CSC_LINK) and fails on an empty value. The version is
      # taken from the tag (v0.1.1 → 0.1.1), so package.json is never bumped.
      - name: Package desktop app (macOS, signed)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then EXTRA="-c.extraMetadata.version=${GITHUB_REF_NAME#v}"; fi
          npx electron-builder --publish never $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows + Linux: unsigned (no signing env at all).
      - name: Package desktop app (Windows / Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          EXTRA=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then EXTRA="-c.extraMetadata.version=${GITHUB_REF_NAME#v}"; fi
          npx electron-builder --publish never $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers/archives
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage

  # Publish to itch.io with butler — only on a version-tag push.
  publish:
    name: Publish to itch.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # tag v0.1.0 -> 0.1.0
      - name: Compute version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The maintained action installs butler and pushes in one step. It's run
      # once per channel, pointing at each platform's artifact directory.
      - name: Publish Windows build
        uses: yeslayla/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: windows
          ITCH_GAME: wild-willows
          ITCH_USER: bai13y
          PACKAGE: artifacts/wild-willows-windows
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Publish macOS build
        uses: yeslayla/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: osx
          ITCH_GAME: wild-willows
          ITCH_USER: bai13y
          PACKAGE: artifacts/wild-willows-macos
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Publish Linux build
        uses: yeslayla/butler-publish-itchio-action@v1.0.3
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: linux
          ITCH_GAME: wild-willows
          ITCH_USER: bai13y
          PACKAGE: artifacts/wild-willows-linux
          VERSION: ${{ steps.ver.outputs.version }}
