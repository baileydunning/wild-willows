name: Desktop build & publish

# Builds the solo-only desktop app for Windows, macOS, and Linux on native
# runners. On an itch-v* OR plain v* tag push it then publishes each build to
# itch.io with butler (channels windows / osx / linux of bai13y/wild-willows).
# A plain manual run just builds the artifacts and skips publishing.
#
# Tag scheme (mirrors mas-release.yml):
#   itch-v0.1.0  → itch.io ONLY  (this workflow)
#   mas-v0.1.0   → Mac App Store ONLY  (mas-release.yml)
#   v0.1.0       → BOTH  (this workflow AND mas-release.yml fire)
#
# Triggers:
#   git tag itch-v0.1.0 && git push origin itch-v0.1.0  → build AND publish to itch
#   git tag v0.1.0 && git push origin v0.1.0            → build AND publish to itch (+ mas fires too)
#   Actions tab → Run workflow                          → build artifacts only (no publish)
#
# The version is taken from the tag (itch-v0.1.0 → 0.1.0, v0.1.0 → 0.1.0), same
# as mas-release.yml, so package.json is never bumped.
#
# Required repo secret for publishing:
#   BUTLER_API_KEY   from https://itch.io/user/settings/api-keys

on:
  push:
    tags: ['itch-v*', 'v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Desktop OSes to build (comma-separated: windows,macos,linux)'
        type: string
        default: 'windows,macos,linux'
      version:
        description: 'Version to stamp (blank = package.json)'
        type: string
        default: ''
      publish:
        description: 'Publish to itch'
        type: boolean
        default: false
  # Called by itch-release.yml so the manual platform picker reuses this build
  # rather than keeping a second copy of it.
  workflow_call:
    inputs:
      platforms:
        type: string
        default: 'windows,macos,linux'
      version:
        type: string
        default: ''
      publish:
        type: boolean
        default: false

# Don't let two runs on the same tag/ref pile up. The event name is part of the
# group because a reusable workflow inherits the CALLER's github.ref — without it
# a manual release run on main could cancel an in-flight tag build.
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # A matrix cannot be filtered with a job-level `if` (the matrix context isn't
  # available there), so platform selection is resolved into the matrix itself.
  # On a tag push `inputs` is null and this falls through to all three OSes.
  plan:
    name: Resolve platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          SEL="${PLATFORMS:-windows,macos,linux}"
          echo "Requested: $SEL"
          include=""
          add() { include="${include:+$include,}$1"; }
          case ",$SEL," in *,windows,*) add '{"os":"windows-latest","artifact":"wild-willows-windows"}';; esac
          case ",$SEL," in *,macos,*)   add '{"os":"macos-latest","artifact":"wild-willows-macos"}';; esac
          case ",$SEL," in *,linux,*)   add '{"os":"ubuntu-latest","artifact":"wild-willows-linux"}';; esac
          if [ -z "$include" ]; then
            echo "::error::No valid desktop platform in '$SEL'. Expected some of: windows, macos, linux."
            exit 1
          fi
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Every matrix leg resolves the same version, so last-writer-wins is fine here.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web client + server bundle
        run: npm run build

      # One place that decides the version, so the two packaging steps below and
      # the publish job can't drift. Explicit input wins; otherwise a tag supplies
      # it; otherwise blank, which means "leave package.json's version alone".
      - name: Resolve release version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VER="${INPUT_VERSION:-}"
          if [ -z "$VER" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#itch-}"
          fi
          VER="${VER#v}"
          echo "Release version: ${VER:-<package.json>}"
          echo "RELEASE_VERSION=$VER" >> "$GITHUB_ENV"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # macOS: signed + notarized. Kept separate from the other OSes so CSC_LINK
      # is NEVER defined on a non-mac runner — Windows reads CSC_LINK as its own
      # signing cert (WIN_CSC_LINK) and fails on an empty value. The version is
      # taken from the tag (v0.1.1 → 0.1.1), so package.json is never bumped.
      - name: Package desktop app (macOS, signed)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${RELEASE_VERSION:-}" ]; then EXTRA="-c.extraMetadata.version=$RELEASE_VERSION"; fi
          npx electron-builder --publish never $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Windows + Linux: unsigned (no signing env at all).
      - name: Package desktop app (Windows / Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          EXTRA=""
          if [ -n "${RELEASE_VERSION:-}" ]; then EXTRA="-c.extraMetadata.version=$RELEASE_VERSION"; fi
          npx electron-builder --publish never $EXTRA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers/archives
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage

  # Publish to itch with butler — on an itch-v*/v* tag push, or when a manual run
  # explicitly asked for it. The tag half is scoped to `push` because a reusable
  # workflow inherits the caller's github.ref: without that scope, a manual
  # release started from a tag would publish even with the box unticked.
  publish:
    name: Publish to itch
    needs: build
    if: >-
      inputs.publish ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install butler
        run: |
          set -euo pipefail
          # NOTE: the old broth.itch.ovh host is deprecated and no longer resolves
          # (curl exit 6). The current automation endpoint is broth.itch.zone.
          for i in 1 2 3 4 5; do
            if curl -fL --connect-timeout 20 --retry 5 --retry-delay 5 --retry-all-errors \
                 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default; then
              break
            fi
            echo "butler download attempt $i failed; retrying in 10s…"
            sleep 10
            [ "$i" = 5 ] && { echo "Could not download butler after 5 attempts"; exit 1; }
          done
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          "$HOME/butler/butler" -V

      - name: Push builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          # The version the build job actually stamped into the binaries. On a
          # manual release the ref is a branch name, which is not a version.
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          BUTLER="$HOME/butler/butler"
          GAME="bai13y/wild-willows"
          if [ -z "${VERSION:-}" ]; then
            echo "::error::No version resolved — refusing to push an unversioned build to itch."
            exit 1
          fi

          # Pick the best file per platform: portable zip for win/mac, AppImage for linux.
          win=$(ls artifacts/wild-willows-windows/*.zip 2>/dev/null | head -1 || true)
          [ -z "$win" ] && win=$(ls artifacts/wild-willows-windows/*.exe 2>/dev/null | head -1 || true)
          mac=$(ls artifacts/wild-willows-macos/*-mac.zip 2>/dev/null | head -1 || true)
          [ -z "$mac" ] && mac=$(ls artifacts/wild-willows-macos/*.dmg 2>/dev/null | head -1 || true)
          lin=$(ls artifacts/wild-willows-linux/*.AppImage 2>/dev/null | head -1 || true)

          push() { # $1=file  $2=channel
            if [ -n "$1" ]; then
              echo "Pushing $1 -> $GAME:$2 (v$VERSION)"
              "$BUTLER" push "$1" "$GAME:$2" --userversion "$VERSION"
            else
              echo "No file for channel $2 — skipping"
            fi
          }
          push "$win" windows
          push "$mac" osx
          push "$lin" linux

          "$BUTLER" status "$GAME"
