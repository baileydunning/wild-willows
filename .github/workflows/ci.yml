name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0) Lint. Two layers, and they answer different questions:
  #      • oxlint   — semantics. Type-aware (via oxlint-tsgolint, the same
  #                   typescript-go engine as tsc 7). Warnings do NOT fail; the
  #                   rules set to `error` in .oxlintrc.json do. That file's header
  #                   explains why this is not ESLint.
  #      • prettier — formatting. Fails on anything unformatted.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (oxlint, type-aware)
        run: npm run lint:code
      - name: Verify formatting
        run: npm run format:check

  # 1) Typecheck + build the shippable artifacts (server bundle + web build).
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build server bundle + web client
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            web
            resources.js
          retention-days: 3

  # 2) Unit + integration tests (Vitest). Integration drives the real
  #    resources.js bundle against an in-memory Harper mock — no server needed.
  unit-integration:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build server bundle (resources.js) for the integration harness
        run: npm run build:server
      # --coverage is what enforces the floor in vitest.config.ts. Without it the
      # thresholds are never evaluated and the job passes on a suite that has
      # quietly stopped covering half the code.
      - name: Run Vitest (unit + integration) with the coverage floor
        run: npx vitest run --coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # 3) Solo E2E (Playwright) — offline solo mode against the static web build.
  e2e-solo:
    name: E2E (solo, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium + OS deps
        run: npx playwright install --with-deps chromium
      - name: Run solo E2E
        run: npx playwright test --project=solo
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-solo
          path: playwright-report
          retention-days: 7
