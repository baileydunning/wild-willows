# Wild Willows — Harper database schema
#
# Two kinds of tables:
#  • Definition/seed tables (below) have a FIXED set of typed columns. They're
#    seeded from data/*.json and never change shape, so the typed (structon)
#    encoding is safe and lets us keep helpful @indexed columns.
#  • Mutable game-state tables declare ONLY `id @primaryKey`. Every
#    other field is dynamic, so Harper stores the record as a flexible map rather
#    than the positional structon encoding. This is deliberate: adding/removing
#    fields on a positional-encoded table left old AND new rows undecodable
#    ("Error decoding record: Data read, but end of buffer not reached"). Dynamic
#    rows never hit that. All reads are bounded `starts_with` ranges over the
#    primary key (never indexed conditions) — see the KEY CONTRACT block below —
#    so dropping the column indexes costs nothing. Tables are not @export-ed — everything flows through the resources.
#
# ---------- definition / seed tables (fixed, typed) ----------

type Biome @table(database: "wildwillows") {
	id: ID @primaryKey
	name: String
	order: Int @indexed
	description: String
	restorationGoal: String
	explorable: Boolean
}

type Animal @table(database: "wildwillows") {
	id: ID @primaryKey
	name: String
	biome: String @indexed
	kind: String
	diet: String
	shelter: String
	fact: String
	rarity: String
	featured: Boolean
	preferredHabitat: String
}

type ResourceType @table(database: "wildwillows") {
	id: ID @primaryKey
	name: String
	tool: String
	color: String
}

type Recipe @table(database: "wildwillows") {
	id: ID @primaryKey
	name: String
	category: String @indexed
	unlockBiome: String
}

type HabitatObject @table(database: "wildwillows") {
	id: ID @primaryKey
	name: String
	placement: String
	healthValue: Int
	description: String
}

type ToolDef @table(database: "wildwillows") {
	id: ID @primaryKey
	name: String
}

type Achievement @table(database: "wildwillows") {
	id: ID @primaryKey
	name: String
	biome: String @indexed   # "meadow"… or "preserve" for cross-biome / getting-started
	category: String @indexed
	order: Int @indexed
	points: Int
	hidden: Boolean
	icon: String             # unique glyph key in icons.tsx
	flavor: String           # story line shown on unlock + in the panel
	hint: String             # shown while locked (omitted for hidden ones)
}

# ---------- mutable tables (dynamic — id only; all other fields are flexible) ----------
#
# KEY CONTRACT (KEY_REV 3 — enforced in resources.ts; read the block above
# `byPlayer` there before changing any id format).
#
# These tables have NO secondary indexes, and must not gain any. That is not an
# oversight and it is not a performance compromise — it is the only shape that
# works here:
#
#   • An index needs a DECLARED column. Declaring one on a dynamic table moves it
#     back to the positional structon encoding, which is what left old AND new
#     rows undecodable ("end of buffer not reached") the last time it was tried.
#   • Harper rejects a condition on an undeclared attribute outright, so a
#     `worldId` filter is not something the server can push down regardless.
#   • Secondary-index conditions here proved unreliable across Harper versions
#     and cold starts — returning zero rows for a perfectly good save, which the
#     game renders as an empty world.
#
# So scoping is done on the PRIMARY key instead. Every row of one world sorts
# into a contiguous run, and a per-world read is a bounded `starts_with` range
# over `primaryStore` — the same store, the same getRange call a full scan
# already makes, just with bounds. It cannot be colder or less ready than the
# unbounded scan it replaces, and its cost tracks the size of ONE world rather
# than the size of the whole database.
#
#   `${playerId}:…`  BiomeState · NodeState · TerrainTile · Discovery ·
#                     Placement · Chest · FeedEntry · PlayerAchievement
#
# A player id (`slugId(name)`, optionally `-${rand}`) and a world id
# (`w_${ts36}_${rand}`) can never contain `:`, so `${id}:` is an unambiguous
# prefix — no world's key run can start inside another's. Keep it that way: if an
# id scheme ever admits a colon, every per-world read silently starts returning
# another save's rows, and the explicit `worldId` filter in byWorld is the only
# thing standing between that and cross-save corruption.
#
# Rows written before KEY_REV 3 are re-keyed to `${worldId}:${oldId}` by
# migrateWorldKeys, once per world, from a write path (login / first heartbeat).
# Until a world is marked, reads merge a legacy full scan so nothing reads empty.
#
# Documented field shapes (stored dynamically, not declared):

# Player        : name, passcodeSalt, passcodeHash, appearance, createdAt, area, x, y,
#                 worldId (active world; solo === player id), inventory, craftedItems,
#                 craftedEver, tools, unlockedBiomes, visitedBiomes, tutorialStep, home, metrics
type Player @table(database: "wildwillows") { id: ID @primaryKey }

# PlayerAchievement : `${playerId}:${achievementId}` · playerId, achievementId, biome, earnedAt
type PlayerAchievement @table(database: "wildwillows") { id: ID @primaryKey }

# World-owned state (id is `${worldId}:...`; worldId/playerId stored on each row)
type BiomeState @table(database: "wildwillows") { id: ID @primaryKey }   # worldId, playerId, biomeId, health, balance, returnedCount, unlocked
type Chest @table(database: "wildwillows") { id: ID @primaryKey }        # worldId, playerId, area, x, y, size, capacity, contents
type Placement @table(database: "wildwillows") { id: ID @primaryKey }    # worldId, playerId, objectId, area, x, y, placedAt, plantedAt, color
type Discovery @table(database: "wildwillows") { id: ID @primaryKey }    # worldId, playerId, animalId, biomeId, comfort, timesObserved, firstObservedAt, whyReturned
type NodeState @table(database: "wildwillows") { id: ID @primaryKey }    # worldId, playerId, harvestedAt
type TerrainTile @table(database: "wildwillows") { id: ID @primaryKey }  # worldId, playerId, area, x, y, type, updatedAt
type FeedEntry @table(database: "wildwillows") { id: ID @primaryKey }    # worldId, playerId, at, icon, text
type Feedback @table(database: "wildwillows") { id: ID @primaryKey }     # message, replyTo, metrics, queuedAt, createdAt (player feedback via SubmitFeedback; read with admin-only ListFeedback)
# Uplinked solo metrics (`solo:${slotId}`), via SyncMetrics. Kept as a flat,
# ALL-SCALAR record so the structon encoding stays stable (see top-of-file note):
# the metrics view is stored as a JSON STRING in `snapshot`, never a nested map,
# and every other field is a declared scalar. name/os/platform/version/language
# are @indexed so they're searchable on Harper. NOTE: because this is a typed
# (positional) table, don't add/remove columns casually — recreate the table if
# the column set changes, or old rows become undecodable.
type SoloMetrics @table(database: "wildwillows") {
	id: ID @primaryKey
	clientId: String
	name: String @indexed        # save's display name
	platform: String @indexed    # desktop | web
	os: String @indexed          # mac | windows | linux | …
	version: String @indexed     # wild-willows release
	build: String                # build timestamp
	language: String @indexed    # interface language (e.g. en | es)
	snapshot: String             # JSON.stringify(metrics view) — scalar, not a map
	createdAt: Float
	updatedAt: Float
}

# App-open / acquisition funnel, keyed per install/device (`dev:${deviceId}`).
# The client pings on every app launch (phase "open") and once per character
# created (phase "created"), so /Metrics/ can report how many people opened the
# app, how many went on to create a character (vs bounced), and how many
# characters each person creates. Dynamic (id only) so the field set can evolve.
# Also carries the keyboard gate (phase "kb_gate"): a device with no keyboard
# never reaches a save slot, so this row is the only place it can be counted.
type AppOpen @table(database: "wildwillows") { id: ID @primaryKey } # deviceId, platform, os, version, language, firstOpenAt, lastOpenAt, opens, converted, firstConvertedAt, savesCreated, creationMs, keyboardGated, keyboardGatePassed, keyboardGatedAt, updatedAt

# One row per record that failed to decode (`${table}:${recordId}`) · table,
# recordId, kind, firstSeenAt, lastSeenAt, count. Written whenever salvage gives
# up, so unreadable saves show up on /dashboard instead of only in server logs —
# these were invisible unless someone happened to be tailing stderr. Aggregate
# counters and record ids only; no save contents. Dynamic (id only).
type SaveIncident @table(database: "wildwillows") { id: ID @primaryKey }
type Refusal @table(database: "wildwillows") { id: ID @primaryKey }
type ClientError @table(database: "wildwillows") { id: ID @primaryKey }

# Name slug -> the save ids using that name. A login has to reach a player's row
# BY ID, because salvageRecord only runs on a point read; a full scan can't do it
# (toArray drops rows it cannot decode, and a dropped row carries no id). Since
# ids stopped being the bare name slug, this is what still lets a corrupt save be
# found and healed. Dynamic (id only) so the field set can evolve.
type PlayerNameIndex @table(database: "wildwillows") { id: ID @primaryKey } # id = name slug · playerIds: string[]

# ---------- landing page: analytics (dynamic) ----------
# A MailingListSignup table sat here, holding one row per subscribed email. It
# was removed along with the signup form, JoinMailingList and the admin-only
# ListMailingList reader: the site no longer collects an email address by any
# route, so the landing page holds no personal data at all.
# LandingStat : ONE row per UTC day (`day:YYYY-MM-DD`) · day, visits, uniques,
#               clicks { target: n }, downloads { which: n }, updatedAt.
#               Aggregate counters only — the LandingStats rollup serves these
#               to the /dashboard landing section.
type LandingStat @table(database: "wildwillows") { id: ID @primaryKey }

# ---------- classroom pages: analytics (dynamic) ----------
# LessonStat : ONE row per UTC day (`day:YYYY-MM-DD`) · day, sessions,
#              counts { key: n }, updatedAt. Fed by POST /LessonEvent/ and read
#              by the LessonStats rollup for the /dashboard classroom section.
#
# SEPARATE from LandingStat on purpose. Landing's `visits` is one
# undifferentiated series shared by every page that reports one — which is why
# /teachers has to report itself as a click instead. Three more pages with real
# funnels would make that worse, and the classroom pages need per-chapter and
# per-error keys the landing schema has nowhere to put.
#
# AGGREGATE COUNTERS ONLY, and this is a promise made in PRIVACY.md and on the
# pages themselves: no identifiers, no free text, no timings, and nothing a
# student typed. The endpoint enforces it by allowlisting every key it will
# store — see LESSON_KEYS in server/resources.ts. Anything that cannot be
# counted does not belong in this table.
type LessonStat @table(database: "wildwillows") { id: ID @primaryKey }

