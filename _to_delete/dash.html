<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Deliberately neutral until signed in. Anyone who reaches this URL
		     without credentials should learn nothing from it — not what the page is
		     for, not what it reports, not that it reports anything. The real title
		     is set from script once a session is established. -->
		<title>Wild Willows</title>
		<meta name="description" content="Wild Willows." />
		<meta name="robots" content="noindex, nofollow" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
			media="print"
			onload="this.media='all'"
			fetchpriority="low"
		/>
		<noscript
			><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
		/></noscript>

		<style>
/* Wild Willows — the shared site stylesheet.
 *
 * EXTRACTED VERBATIM from public/landing.html's <style>: the design tokens,
 * buttons, chips, nav, wrap and section heads that every public page uses. The
 * landing page, /teachers, /age-rating and /support each carry their own copy of
 * exactly these bytes today, with a comment on each telling the next person to
 * re-copy by hand rather than tweak. This file is that block, so the classroom
 * pages can @include it instead of becoming a fifth copy.
 *
 * tests/unit/site-css.test.ts asserts this file is byte-identical to landing's
 * block — if the landing page's design changes, that test fails and tells you to
 * re-extract, rather than the classroom pages quietly drifting out of style.
 *
 * The four existing pages can migrate to this include whenever it is convenient;
 * the generated HTML is unchanged either way.
 */

:root{
  --paper:#f4eeda; --paper-deep:#ece4cb; --panel:#fdfaf1; --panel-edge:#e3d9bc;
  --ink:#3b4232; --ink-soft:#75765f; --ink-faint:#9d9c85;
  --green:#4a7c59; --green-deep:#39604a; --green-bright:#7cb564; --leaf:#d8eec2;
  --sprout:#eaf3dd; --gold:#c9913f; --clay:#b5707a; --sky-day:#a8c9b6;
  --night:#242b42; --night2:#3a3a58; --dusk:#8a5f63; --ember:#e8a25c;
  --toast:#33342b;
  --r:14px; --rlg:20px;
  --shadow:0 2px 3px rgba(52,58,40,.08), 0 10px 28px rgba(52,58,40,.13);
  --f:'Quicksand','Avenir Next','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--f);font-weight:500;color:var(--ink);background:var(--paper);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-weight:700;line-height:1.15;margin:0 0 .55rem;color:var(--green-deep);letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,3.4vw,2.1rem)}
h3{font-size:1.15rem}
p{margin:0 0 1rem}
a{color:var(--green-deep)}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.2rem}
svg{display:block}

/* ---------- chips & buttons, borrowed from the game UI ---------- */
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.82rem;font-weight:700;color:var(--green-deep);
  background:var(--sprout);border:1.5px solid #cfe0bd;border-radius:999px;padding:.18rem .7rem;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.warm{background:#f7ead2;border-color:#e6d2a8;color:#8a6a2a}
.toast{display:inline-block;background:var(--toast);color:#f0eeda;font-size:.85rem;font-weight:600;
  border-radius:10px;padding:.35rem .85rem;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:var(--f);font-weight:700;font-size:1rem;
  padding:.7rem 1.3rem;border-radius:13px;border:none;cursor:pointer;text-decoration:none;
  transition:transform .1s ease, filter .1s ease}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.06)}
.btn-go{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-deep), var(--shadow)}
.btn-go:active{box-shadow:0 1px 0 var(--green-deep)}
.btn-paper{background:var(--panel);color:var(--green-deep);box-shadow:0 3px 0 var(--panel-edge), var(--shadow)}
.btn-night{background:rgba(255,255,255,.13);color:#f2f0dd;border:1.5px solid rgba(255,255,255,.35);box-shadow:none}
.btn svg{width:16px;height:16px;flex:none}
.cta-row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:30;background:rgba(253,250,241,.92);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--panel-edge)}
.nav .wrap{display:flex;align-items:center;gap:1rem;height:58px}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.12rem;color:var(--green-deep);text-decoration:none}
.brand svg{width:27px;height:27px;flex:none}
.nav .links{margin-left:auto;display:flex;gap:1.1rem;align-items:center}
/* :not(.btn) matters. Without it this rule outranks .btn-go's own color:#fff
   (0,2,1 beats 0,1,0), so the nav's primary CTA rendered dark ink on the green
   pill instead of white — barely-legible, and on every page that copies this
   sheet. Nav buttons must keep whatever color their .btn-* class gives them. */
.nav .links a:not(.btn){color:var(--ink);font-weight:600;font-size:.93rem;text-decoration:none}
.nav .links a:not(.btn):hover{color:var(--green-deep)}
.nav .links .btn{font-size:.9rem;padding:.45rem .95rem}
/* The nav is a fixed-height flex row, so when its contents stop fitting they
   WRAP INSIDE each item ("Wild / Willows", "Get the / game") rather than
   growing the bar — it just looks broken. Two defenses:

   1. nowrap, so an item never splits across two lines whatever happens.
   2. the secondary links go at 940px, not 740px. Measured: the landing nav
      needs ~910px with every link shown, and every iPad in portrait is
      768–834px CSS px. 740px left all of them in the wrapping zone, which is
      what this band is really about — 940 also lines up with .access's
      breakpoint, so there is one fewer number in this sheet. Below it the nav
      is brand + primary CTA, and the links it drops are section anchors the
      page scrolls to anyway. */
.brand,.nav .links a{white-space:nowrap}
@media(max-width:1100px){.nav .wrap{gap:.8rem}.nav .links{gap:.85rem}}
@media(max-width:940px){.nav .links a.hide-sm{display:none}}

/* ---------- hero: the title screen's dusk ---------- */
/* NOTE: no overflow:hidden on .hero itself, because the screenshot window hangs below
   the hero's edge (negative margin) and must not be clipped. The oversized
   scene art is clipped by .hero-scene instead. */
.hero{position:relative;background:linear-gradient(180deg,#20263c 0%,var(--night) 22%,var(--night2) 48%,var(--dusk) 78%,#c98a62 100%);color:#f2f0dd}
.hero-scene{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hero-scene svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:1600px;max-width:none;height:auto}
.hero .wrap{position:relative;z-index:2;padding:4.4rem 1.2rem 0;text-align:center}
.wordmark{font-size:clamp(2.7rem,8vw,4.8rem);font-weight:700;color:#f7f4e4;letter-spacing:.01em;margin:0 0 .3rem;
  text-shadow:0 3px 0 rgba(24,28,46,.55)}
.hero p.lead{font-size:clamp(1.05rem,2.3vw,1.3rem);color:#e8e2cc;max-width:38rem;margin:.5rem auto 1.6rem;font-weight:500}
.hero .cta-row{justify-content:center}
.hero .platline{margin:1.1rem 0 0;color:#cabfae;font-size:.88rem;font-weight:600}
.hero .platline span{margin:0 .45rem}
.star{position:absolute;border-radius:50%;background:#fdf6d8;opacity:.8;animation:twinkle 3.4s ease-in-out infinite}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a3;box-shadow:0 0 9px 3px rgba(255,220,120,.5);animation:drift 9s ease-in-out infinite;opacity:0}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.95}}
@keyframes drift{0%{transform:translate(0,0);opacity:0}12%{opacity:.95}55%{transform:translate(26px,-34px);opacity:.55}88%{opacity:.9}100%{transform:translate(-14px,-58px);opacity:0}}
@media(prefers-reduced-motion:reduce){.star,.fly{animation:none;opacity:.55}}

/* game-window frame: every screenshot lives in one of the game's own panels */
.win{background:var(--panel);border:1.5px solid var(--panel-edge);border-radius:var(--rlg);box-shadow:var(--shadow);overflow:hidden}
.win .winbar{display:flex;align-items:center;gap:.6rem;padding:.55rem .95rem;border-bottom:1.5px solid var(--panel-edge);background:#faf6e8}
.win .winbar .wdot{width:10px;height:10px;border-radius:50%;background:var(--green-bright);flex:none}
.win .winbar b{font-size:.88rem;color:var(--ink);font-weight:700}
.win .winbar .chip{margin-left:auto;font-size:.7rem;padding:.08rem .55rem}
.win img{display:block;width:100%;height:auto}
.hero-shot{position:relative;z-index:3;display:block;max-width:900px;width:100%;height:auto;margin:2.6rem auto 0;
  border-radius:var(--rlg);box-shadow:0 18px 50px rgba(10,14,26,.45)}
.hero .wrap{padding-bottom:3.4rem}
@media(max-width:640px){.hero .wrap{padding-bottom:2.2rem}}

/* ---------- sections ---------- */
section{padding:3.4rem 0}
.head{max-width:46rem;margin:0 auto 2rem;text-align:center}
.head p{color:var(--ink-soft);font-size:1.04rem}


			/* The dashboard's palette, repointed at the SITE's tokens rather than its
			   own near-misses, so this page reads as part of Wild Willows instead of
			   as an admin tool someone bolted on. site-core.css is included above and
			   is byte-locked to the landing page (tests/unit/site-css.test.ts), so
			   these follow the site automatically rather than being a copy that
			   drifts.
			
			   The dashboard's own rules come AFTER the include and win every tie —
			   which matters for the five selectors both sheets define (.wrap, .brand,
			   body, html, section). The three this page wanted most — .btn, .chip and
			   .nav — the dashboard never defined at all, so they arrive for free and
			   the view tabs are real site chips.
			
			   THREE OF THE OLD VALUES FAILED AA on the site's creams, measured:
			     --muted  #6b7263 -> 4.29 on --paper, 3.92 on --paper-deep
			     --faint  #9aa189 -> 2.31 / 2.11
			     --accent #4a7c46 -> 4.24 / 3.88   (used as text, not just fills)
			   They carried every sub-label, hint and axis on the page. Repointing to
			   the site's inks fixes the contrast and the consistency in one move. */
			:root {
				--bg: var(--paper);
				--bg2: var(--paper-deep);
				--card: var(--panel);
				--ink: #3b4232;
				--muted: #61624b; /* 4.92 worst surface */
				--faint: #66674f; /* 4.57 worst surface */
				/* Fills keep the site green; TEXT uses --accent-dark, which clears AA. */
				--accent: #4a7c59;
				--accent-dark: #39604a; /* 5.61 worst surface */
				--accent-soft: #eaf3dd;
				/* ---- the four series colors ----
				   MEASURED, not chosen. The previous set (#4a7c59 #7fb069 #6ea8c8
				   #d77b8f) failed three of the five computable checks against this
				   page's cream surface (#fdfaf1):

				     chroma floor        #4a7c59 C=0.077, #6ea8c8 C=0.077 — under
				                         0.10, which is the point where a hue stops
				                         reading as a color and starts reading gray
				     normal-vision floor #6ea8c8 vs #7fb069  ΔE 14.3 — under 15, so
				                         full-color readers could not reliably tell
				                         the sage and the sky apart
				     contrast vs surface 2.42 / 2.48 / 2.83 — three of four under 3:1

				   These four pass all five, in this slot order:
				     lightness band ok · chroma ok · adjacent-pair ΔE 15.4 under
				     deuteranopia · 18.1 normal vision · all >= 3:1 on cream.

				   ASSIGN BY ENTITY, IN THIS ORDER, NEVER BY RANK — a filter that
				   drops a series must not repaint the ones that survive.

				   The order is validated on ADJACENT pairs, which is the right check
				   for bars, funnels and donuts where the sequence is ours to choose.
				   s1 and s4 (green and rose) are only ΔE 5.3 apart under deuteranopia,
				   so they must never be the only thing telling two marks apart: every
				   legend on this page carries a text label beside its swatch and every
				   bar row carries its name and number, which is what makes that legal.
				   Putting them adjacent in a new chart is not. */
				--s1: #1f7a3f;
				--s2: #2166ad;
				--s3: #c47a1a;
				--s4: #b0446a;
				/* Lighter steps of the same four hues, for the left end of a bar
				   gradient. Same hue angle, +0.17 OKLCH lightness, chroma at 0.8 —
				   a step of the same ramp rather than a different color. */
				--s1-lift: #69ab79;
				--s2-lift: #669ad6;
				--s3-lift: #f2b474;
				--s4-lift: #de829e;
				/* Slot 3 as TEXT, or as a chip behind white text. The mark color
				   (#c47a1a) is 3.27 on cream and carries white at 3.42 — fine for a
				   fill, short of AA for anything with letters in it. Same hue, two
				   steps darker: 4.96 on cream, 5.18 under white. Same split as
				   --accent / --accent-dark, for the same reason. */
				--s3-ink: #9c5f0e;
				/* Kept as aliases so the existing .fill.gold / .fill.sky / .fill.rose
				   class names and their call sites keep working. New charts should
				   name the slot (--s2) rather than the hue (--sky): the slot is the
				   contract, the hue is an implementation detail that has now changed
				   once and may change again. */
				--gold: var(--s3);
				--sky: var(--s2);
				--rose: var(--s4);
				--rule: #e3d9bc;
				--shadow: 0 1px 2px rgba(47, 58, 39, 0.06), 0 6px 20px rgba(47, 58, 39, 0.07);
				--radius: 14px; /* --r */
			}
			* {
				box-sizing: border-box;
			}
			html {
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				background:
					radial-gradient(1200px 480px at 80% -10%, #fbf7ea 0%, transparent 60%),
					linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
				background-attachment: fixed;
				color: var(--ink);
				/* Quicksand, like every other page. Loaded the same non-blocking way. */
				font: 15px/1.55 var(--f);
				font-weight: 500;
				min-height: 100vh;
			}
			.wrap {
				max-width: 1180px;
				margin: 0 auto;
				padding: clamp(1rem, 3vw, 2.5rem) clamp(0.9rem, 3vw, 2rem) 5rem;
			}

			/* ---- signed out ----
			   A sign-in screen should give nothing away. Before this, the page
			   announced itself as "Wild Willows Metrics" above the form, with a nav,
			   a version filter and a Problems toggle — so anyone who found the URL
			   learned that it exists, what it reports and roughly how it is
			   organized, without a password.
			   Signed out, the page is a wordmark-free form on a cream background and
			   nothing else. The title is neutral in the markup too; the real one is
			   set from script once there is a session. */
			body.signed-out .nav,
			body.signed-out header.top,
			body.signed-out .views,
			body.signed-out .meta,
			body.signed-out footer {
				display: none;
			}
			body.signed-out .wrap {
				padding-top: clamp(4rem, 18vh, 10rem);
			}

			/* ---- view tabs ----
			   Filtering, not re-rendering: every section is built once and the ones
			   that do not match are hidden, so switching is instant and nothing is
			   refetched. The chips are the site's own (.chip / .chip.on from
			   site-core.css), so this control looks like the ones on /learn. */
			.views {
				display: flex;
				gap: 0.35rem;
				flex-wrap: wrap;
				align-self: center;
			}
			.views .chip {
				font-family: var(--f);
				font-size: 0.85rem;
				padding: 0.3rem 0.9rem;
				cursor: pointer;
			}
			body[data-view='game'] section[data-view]:not([data-view='game']),
			body[data-view='website'] section[data-view]:not([data-view='website']),
			body[data-view='harper'] section[data-view]:not([data-view='harper']),
			body[data-view='problems'] section[data-view]:not([data-view='problems']) {
				display: none;
			}
			/* A view whose sections all failed to load should say so rather than
			   showing an empty page that looks broken. */
			.viewempty {
				margin: 2rem 0;
				padding: 2rem;
				text-align: center;
				color: var(--muted);
				background: var(--card);
				border: 1.5px solid var(--rule);
				border-radius: var(--radius);
			}

			/* The site nav, which this page did not have. Full-bleed like the rest of
			   the dashboard rather than site-core's centered 1080px wrap. */
			.nav .wrap {
				max-width: 1180px;
				padding: 0 clamp(0.9rem, 3vw, 2rem);
			}

			/* ---- header ---- */
			header.top {
				display: flex;
				flex-wrap: wrap;
				align-items: flex-end;
				gap: 1rem 1.4rem;
				margin-bottom: 1.6rem;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 0.8rem;
			}
			.brand .leaf {
				width: 46px;
				height: 46px;
				flex: none;
				border-radius: 14px;
				background: linear-gradient(140deg, var(--accent) 0%, var(--accent-dark) 100%);
				display: grid;
				place-items: center;
				box-shadow: var(--shadow);
			}
			.brand h1 {
				font-size: clamp(1.35rem, 3.5vw, 1.9rem);
				margin: 0;
				letter-spacing: -0.02em;
			}
			.meta {
				margin-left: auto;
				text-align: right;
				color: var(--muted);
				font-size: 0.82rem;
			}
			button.refresh {
				margin-top: 0.4rem;
				font: inherit;
				font-size: 0.82rem;
				cursor: pointer;
				border: 1px solid var(--rule);
				background: var(--card);
				color: var(--accent-dark);
				padding: 0.35rem 0.8rem;
				border-radius: 999px;
				box-shadow: var(--shadow);
				transition: transform 0.1s;
			}
			/* The `hidden` attribute is only a UA style rule, so any element this page
			   gives an explicit `display` to ignores it — which left the filter
			   dropdowns sitting above the sign-in form, styled as if they worked.
			   State this once, loudly, rather than tracking down each offender. */
			[hidden] {
				display: none !important;
			}
			/* Sign-in screen. Small, centered, and the only thing on the page — there is
			   nothing else to look at until it is answered. */
			.loginwrap {
				display: flex;
				justify-content: center;
				padding: 3rem 1rem;
			}
			.card.login {
				width: 100%;
				max-width: 380px;
				display: flex;
				flex-direction: column;
				gap: 0.7rem;
			}
			.card.login h2 {
				margin: 0;
				font-size: 1.15rem;
			}
			.card.login label {
				display: flex;
				flex-direction: column;
				gap: 0.25rem;
				font-size: 0.8rem;
				color: var(--muted);
			}
			.card.login input {
				font: inherit;
				font-size: 0.92rem;
				color: var(--ink);
				border: 1px solid var(--rule);
				border-radius: 10px;
				background: #fff;
				padding: 0.45rem 0.6rem;
			}
			.card.login input:focus {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.card.login button {
				margin-top: 0.3rem;
				align-self: flex-start;
			}
			.loginerr {
				margin: 0;
				font-size: 0.82rem;
				color: #a33f52;
				background: #fbeaee;
				border: 1px solid #f0cdd5;
				border-radius: 10px;
				padding: 0.45rem 0.6rem;
			}
			#whoami {
				font-size: 0.78rem;
				color: var(--muted);
			}
			#whoami .wrole {
				background: var(--accent-soft);
				color: var(--accent-dark);
				border-radius: 999px;
				padding: 0.05rem 0.45rem;
				font-size: 0.7rem;
				font-weight: 700;
			}
			button.linkish {
				font: inherit;
				font-size: 0.78rem;
				background: none;
				border: 0;
				padding: 0;
				color: var(--accent-dark);
				text-decoration: underline;
				cursor: pointer;
			}
			/* The Problems toggle. Neutral until something is actually wrong, then it
			   goes amber — so the button's color carries the state without needing to
			   be read. */
			button.refresh.probs.on {
				background: var(--accent-soft);
				color: var(--accent-dark);
				border-color: var(--accent);
			}
			button.refresh.probs .pbadge {
				display: inline-block;
				margin-left: 0.35rem;
				padding: 0 0.4rem;
				border-radius: 999px;
				background: #f6e8c9;
				color: #a9781c;
				font-weight: 700;
				font-size: 0.74rem;
				font-variant-numeric: tabular-nums;
			}
			button.refresh.probs.bad {
				border-color: #e2c481;
			}
			.vfilter {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
				margin-top: 0.5rem;
				font-size: 0.78rem;
				color: var(--muted);
			}
			.vfilter select {
				font: inherit;
				font-size: 0.8rem;
				cursor: pointer;
				color: var(--accent-dark);
				border: 1px solid var(--rule);
				background: var(--card);
				border-radius: 999px;
				padding: 0.3rem 0.7rem;
				box-shadow: var(--shadow);
			}
			.vfilter.is-off {
				opacity: 0.4;
			} /* range selector is moot while "All versions" is picked */
			.vfilter.is-off select {
				cursor: not-allowed;
			}
			.filter-note {
				display: inline-block;
				margin-left: 0.5rem;
				font-size: 0.74rem;
				font-weight: 700;
				color: var(--accent-dark);
				background: var(--accent-soft);
				border-radius: 999px;
				padding: 0.1rem 0.55rem;
			}
			button.refresh:hover {
				transform: translateY(-1px);
			}
			button.refresh:active {
				transform: translateY(0);
			}

			/* ---- section ---- */
			section {
				margin: 2.2rem 0 0;
			}
			.sec-head {
				display: flex;
				align-items: baseline;
				gap: 0.6rem;
				margin: 0 0.2rem 0.85rem;
			}
			.sec-head h2 {
				font-size: 1.04rem;
				margin: 0;
				letter-spacing: -0.01em;
			}
			.sec-head .sub {
				color: var(--faint);
				font-size: 0.82rem;
			}

			/* ---- kpi cards ---- */
			.grid {
				display: grid;
				gap: 0.8rem;
			}
			.kpis {
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
			}
			/* The Overview row is a fixed set of six. auto-fit would drop the last one
			   to a line of its own at common laptop widths, so pin the count once
			   there is room for it; below that it falls back to the rule above.
			   minmax(0, 1fr) rather than 1fr so a long number can't widen its track. */
			@media (min-width: 900px) {
				.kpis-6 {
					grid-template-columns: repeat(6, minmax(0, 1fr));
				}
			}
			.card {
				background: var(--card);
				border: 1px solid var(--rule);
				border-radius: var(--radius);
				padding: 1rem 1.1rem;
				box-shadow: var(--shadow);
			}
			.kpi .v {
				font-size: clamp(1.5rem, 4.5vw, 2rem);
				font-weight: 700;
				letter-spacing: -0.02em;
				line-height: 1.05;
			}
			/* A value shown because it is what the server said, not because this page
			   understood it — visibly quieter than a number it can vouch for. */
			.kpi .muted {
				color: var(--faint);
			}
			.kpi .k {
				color: var(--muted);
				font-size: 0.8rem;
				margin-top: 0.25rem;
			}
			.kpi .hint {
				color: var(--faint);
				font-size: 0.72rem;
				margin-top: 0.35rem;
			}
			.kpi .v small {
				font-size: 0.55em;
				font-weight: 600;
				color: var(--faint);
				margin-left: 0.15em;
			}
			.accent {
				color: var(--accent-dark);
			}

			.two {
				grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
			}
			.three {
				grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
			}

			/* Title on the left, caveat on the right. A float dropped the caveat onto
			   its own line at narrow widths and left it hanging over the content
			   below it; as a flex row it wraps under the title, aligned with it. */
			.card h3 {
				margin: 0 0 0.9rem;
				font-size: 0.96rem;
				display: flex;
				flex-wrap: wrap;
				align-items: baseline;
				justify-content: space-between;
				gap: 0.15rem 0.8rem;
			}
			.card h3 .tag {
				font-size: 0.74rem;
				font-weight: 600;
				color: var(--faint);
			}

			/* ---- horizontal bar rows ---- */
			.bars {
				display: flex;
				flex-direction: column;
				gap: 0.55rem;
			}
			.bar {
				display: grid;
				grid-template-columns: minmax(64px, 34%) 1fr auto;
				align-items: center;
				gap: 0.6rem;
			}
			.bar .lab {
				color: var(--muted);
				font-size: 0.82rem;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			/* Was text-transform: capitalize, which uppercases EVERY word and had
			   been quietly rendering the itch.io label as "Itch.Io" — invisible on
			   the other labels only because they were already title case. The label
			   maps carry the intended casing; this just lifts the first letter of a
			   raw key that has no map entry. */
			.bar .lab::first-letter {
				text-transform: uppercase;
			}
			.bar .track {
				display: block;
				background: var(--accent-soft);
				border-radius: 999px;
				height: 12px;
				overflow: hidden;
			}
			/* display:block — these are <span>s, and inline elements silently ignore width/height */
			.bar .fill {
				display: block;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(90deg, var(--s1-lift) 0%, var(--s1) 100%);
				min-width: 3px;
				transition: width 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
			}
			.bar .num {
				font-size: 0.8rem;
				color: var(--ink);
				font-variant-numeric: tabular-nums;
				min-width: 2.4ch;
				text-align: right;
			}
			.fill.sky {
				background: linear-gradient(90deg, var(--s2-lift), var(--s2));
			}
			.fill.gold {
				background: linear-gradient(90deg, var(--s3-lift), var(--s3));
			}
			.fill.rose {
				background: linear-gradient(90deg, var(--s4-lift), var(--s4));
			}

			/* ---- funnel ----
			 * The numbers used to sit inside the bar, on top of the fill. Where the
			 * fill reached them they were dark green on dark green — a 100% step read
			 * as a blank bar — and where it did not they were dark on pale, so the
			 * same label changed legibility with its own value. They now live in a
			 * fixed column beside the bar, on the card, where the contrast is the same
			 * for every row. Only the step name rides the fill, in white, which is
			 * safe because the fill always starts at the left edge under it. */
			.funnel {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}
			.step {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				align-items: center;
				gap: 0.5rem 0.8rem;
			}
			.step .strack {
				position: relative;
				background: var(--accent-soft);
				border-radius: 12px;
				overflow: hidden;
				padding: 0.6rem 0.85rem;
				min-width: 0;
			}
			.step .sfill {
				background: linear-gradient(90deg, var(--accent), var(--accent-dark));
				position: absolute;
				top: 0;
				bottom: 0;
				left: 0;
				width: 0;
				border-radius: 12px;
				transition: width 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
			}
			.step .sname {
				position: relative;
				display: block;
				font-weight: 600;
				font-size: 0.86rem;
				color: #fff;
				text-shadow: 0 1px 2px rgba(28, 44, 24, 0.35);
				overflow-wrap: anywhere;
			}
			/* A step at or near zero has no fill under its name, so white on pale
			   green would vanish. Set by funnel() from the value, not guessed here. */
			.step.empty .sname {
				color: var(--muted);
				text-shadow: none;
			}
			.step .sval {
				font-variant-numeric: tabular-nums;
				font-size: 0.84rem;
				display: flex;
				gap: 0.5rem;
				align-items: baseline;
				justify-content: flex-end;
				white-space: nowrap;
			}
			.step .spct {
				color: var(--accent-dark);
				font-weight: 700;
			}
			.step .drop {
				color: var(--rose);
				font-size: 0.72rem;
			}

			/* ---- donut / distribution ---- */
			.legend {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem 0.9rem;
				margin-top: 0.8rem;
			}
			.legend .li {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				font-size: 0.8rem;
				color: var(--muted);
			}
			.legend .sw {
				width: 11px;
				height: 11px;
				border-radius: 3px;
				flex: none;
			}
			.donutwrap {
				display: flex;
				align-items: center;
				gap: 1rem;
				flex-wrap: wrap;
			}
			.donutwrap svg {
				flex: none;
			}

			/* ---- characters ---- */
			.charwrap {
			}
			.chargrid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
				gap: 0.7rem;
			}
			.charcard {
				background: linear-gradient(180deg, #fffdf7, #f6f3e8);
				border: 1px solid var(--rule);
				border-radius: 16px;
				padding: 0.7rem 0.5rem 0.6rem;
				text-align: center;
				box-shadow: var(--shadow);
				transition: transform 0.12s ease;
			}
			.charcard:hover {
				transform: translateY(-3px);
			}
			.charcard svg {
				width: 100%;
				height: auto;
				max-width: 92px;
			}
			.charcard .cmeta {
				margin-top: 0.3rem;
				font-size: 0.72rem;
				color: var(--muted);
				line-height: 1.35;
			}
			.charcard .cmeta b {
				color: var(--accent-dark);
				font-weight: 700;
			}
			.charcard .badge {
				display: inline-block;
				margin-top: 0.25rem;
				font-size: 0.66rem;
				color: var(--s3-ink);
				font-weight: 700;
				letter-spacing: 0.02em;
			}

			/* ---- player highlights ---- */
			.hlgrid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
				gap: 0.8rem;
			}
			.hlcard {
				display: flex;
				gap: 0.75rem;
				align-items: center;
				background: linear-gradient(180deg, #fffdf7, #f6f3e8);
				border: 1px solid var(--rule);
				border-radius: 16px;
				padding: 0.75rem 0.85rem;
				box-shadow: var(--shadow);
				transition: transform 0.12s ease;
			}
			.hlcard:hover {
				transform: translateY(-3px);
			}
			.hlav {
				flex: none;
				width: 66px;
			}
			.hlav svg {
				width: 100%;
				height: auto;
			}
			.hlbody {
				flex: 1;
				min-width: 0;
			}
			.hlname {
				display: flex;
				align-items: center;
				gap: 0.45rem;
				font-weight: 700;
				color: var(--ink);
				font-size: 0.96rem;
				margin-bottom: 0.35rem;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.hltop {
				display: flex;
				align-items: center;
				gap: 0.4rem;
				flex-wrap: wrap;
				margin-bottom: 0.5rem;
			}
			.hltag {
				font-size: 0.66rem;
				font-weight: 700;
				letter-spacing: 0.02em;
				color: var(--accent-dark);
				background: var(--accent-soft);
				border-radius: 999px;
				padding: 0.12rem 0.55rem;
			}
			/* Demo → full carry-over. Gold rather than the usual green: this is the
			   milestone worth spotting from across the page, not another stat. */
			.hltag.hlconv {
				color: #7a5410;
				background: linear-gradient(180deg, #f7e6bd, #f0d79b);
				border: 1px solid #e2c481;
				cursor: help;
			}
			.hledi {
				font-size: 0.6rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				border-radius: 999px;
				padding: 0.1rem 0.45rem;
			}
			/* Demo is a FILLED sage chip, full a tinted one. They used to differ by hue
			   (gold-on-cream vs green-on-green); now that the demo series is sage
			   everywhere else — donut, legend, vs-table bars — the chips have to agree
			   with it, so the two are told apart by fill weight rather than color. */
			.hledi.demo {
				color: #ffffff;
				background: var(--s3-ink);
			}
			.hledi.full {
				color: var(--accent-dark);
				background: var(--accent-soft);
			}
			/* A save the report treats as an open window rather than play. */
			.hlidle {
				font-size: 0.6rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.04em;
				border-radius: 999px;
				padding: 0.1rem 0.45rem;
				color: #8a6a1f;
				background: #f3ead2;
				cursor: help;
			}
			.hlstats {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.5rem 0.35rem;
			}
			.hlstat {
				display: flex;
				flex-direction: column;
			}
			.hlstat b {
				font-size: 0.96rem;
				color: var(--ink);
				font-variant-numeric: tabular-nums;
				line-height: 1.1;
			}
			.hlstat span {
				font-size: 0.64rem;
				color: var(--faint);
			}
			/* Starter-chain progress, under the stats grid.
			 *
			 * A bar rather than a seventh stat: the grid is a deliberate 3 × 2 and the
			 * interesting thing about "6 of 10" is how far along the line it sits, not
			 * the digit. Full width so the fill is comparable card to card. */
			.hlchain {
				display: flex;
				align-items: center;
				gap: 0.45rem;
				margin-top: 0.6rem;
			}
			.hlchain .lab {
				font-size: 0.64rem;
				color: var(--faint);
				white-space: nowrap;
			}
			.hlchain .track {
				flex: 1;
				min-width: 0;
				height: 5px;
				border-radius: 999px;
				background: var(--bg2);
				overflow: hidden;
			}
			.hlchain .fill {
				display: block;
				height: 100%;
				border-radius: 999px;
				background: linear-gradient(90deg, var(--s1-lift) 0%, var(--s1) 100%);
			}
			.hlchain .num {
				font-size: 0.64rem;
				font-weight: 700;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
				white-space: nowrap;
			}
			/* Finished the chain: the number goes the accent color so a completed
			   board reads at a glance without the bar having to be measured. */
			.hlchain.done .num {
				color: var(--accent-dark);
			}
			/* A pre-chain save. Its step is inferred, not observed, so the bar is
			   drawn hollow rather than claiming a full ten out of ten. */
			.hlchain.legacy .fill {
				background: repeating-linear-gradient(
					135deg,
					var(--accent-soft) 0 5px,
					transparent 5px 10px
				);
			}
			.hlcard {
				cursor: pointer;
			}
			.hlcard:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			/* Caretakers seen in the last 5 minutes — the same window as the "Active now" KPI. */
			.hlcard.active-now {
				border-color: var(--accent);
				box-shadow:
					0 0 0 1px var(--accent),
					var(--shadow);
			}
			.hltag.hllive {
				color: #fff;
				background: var(--accent);
			}
			/* Shown only while the wall is sorted by recency — see the card render. */
			.hltag.hlsince {
				color: var(--muted);
				background: var(--card);
				border: 1px solid var(--rule);
				cursor: help;
			}
			/* The sort control sits inside the highlights card, above the grid. */
			.hlpick {
				margin-bottom: 0.9rem;
			}
			/* The pager sits below the grid, in the same pill idiom as the sort. */
			.hlpager {
				margin-top: 1rem;
				justify-content: center;
			}
			.hlpager .dbtn[disabled] {
				opacity: 0.4;
				cursor: default;
			}
			.hlgap {
				color: var(--faint);
				padding: 0 0.1rem;
				user-select: none;
			}
			.hlpicklabel {
				font-weight: 700;
				color: var(--muted);
				margin-right: 0.15rem;
			}

			/* ---- "playing right now" list, inside the shared modal ---- */
			.acchips {
				display: flex;
				flex-wrap: wrap;
				gap: 0.4rem;
				margin: 0 0 0.9rem;
			}
			.acchip {
				background: var(--card);
				border-radius: 999px;
				padding: 0.2rem 0.65rem;
				font-size: 0.82rem;
				font-weight: 700;
				color: var(--muted);
				box-shadow: var(--shadow);
			}
			.acrow {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				background: var(--card);
				border-radius: 14px;
				padding: 0.6rem 0.8rem;
				margin-bottom: 0.5rem;
				cursor: pointer;
				box-shadow: var(--shadow);
			}
			.acrow:hover,
			.acrow:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.acav svg {
				width: 40px;
				height: 40px;
				display: block;
			}
			.acbody {
				min-width: 0;
			}
			.acname {
				font-weight: 800;
			}
			.actags {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.3rem;
				margin: 0.15rem 0;
			}
			/* The channel is the reason this list exists, so it reads first and loudest
			   — everything beside it is a plain gray chip. */
			.acchan {
				background: var(--accent);
				color: #fff;
				border-radius: 999px;
				padding: 0.1rem 0.55rem;
				font-size: 0.75rem;
				font-weight: 800;
			}
			.actag {
				background: var(--bg);
				border-radius: 999px;
				padding: 0.1rem 0.55rem;
				font-size: 0.75rem;
				font-weight: 700;
				color: var(--muted);
			}
			.acmeta {
				font-size: 0.82rem;
				color: var(--muted);
			}
			/* A KPI tile that opens something. Same card, but it says so. */
			.kpi-click {
				cursor: pointer;
			}
			.kpi-click:hover,
			.kpi-click:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}

			/* ---- player modal ---- */
			.modal-overlay {
				position: fixed;
				inset: 0;
				background: rgba(30, 38, 24, 0.55);
				display: flex;
				align-items: flex-start;
				justify-content: center;
				padding: 4vh 1rem;
				z-index: 100;
				overflow-y: auto;
			}
			.modal {
				background: var(--bg);
				border-radius: 20px;
				max-width: 880px;
				width: 100%;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
				padding: 1.4rem 1.4rem 1.8rem;
				position: relative;
			}
			.modal-close {
				position: absolute;
				top: 0.9rem;
				right: 1rem;
				border: none;
				background: var(--card);
				border-radius: 999px;
				width: 34px;
				height: 34px;
				font-size: 1.2rem;
				line-height: 1;
				cursor: pointer;
				color: var(--muted);
				box-shadow: var(--shadow);
			}
			.modal-close:hover {
				color: var(--ink);
			}
			/* Super-user-only remove control at the foot of the player modal. Same
			   red pair as button.delbtn so there is one "destructive" color on the
			   page, but boxed and labeled rather than a bare × — this one has no
			   undo, and it should not look like the counter deletes that do. */
			.dangerzone {
				display: flex;
				gap: 1rem;
				align-items: center;
				justify-content: space-between;
				margin-top: 1rem;
				padding: 0.9rem 1rem;
				border: 1px solid #f0cdd5;
				border-radius: 12px;
				background: #fdf6f7;
			}
			.dangerzone b {
				font-size: 0.95rem;
			}
			.dangerzone p {
				margin: 0.25rem 0 0;
				max-width: 52ch;
				font-size: 0.84rem;
				line-height: 1.5;
				color: var(--muted);
			}
			button.dangerbtn {
				font: inherit;
				font-size: 0.88rem;
				cursor: pointer;
				white-space: nowrap;
				border: 1px solid #e0a9b6;
				background: #fff;
				color: #a33f52;
				border-radius: 9px;
				padding: 0.45rem 0.8rem;
				transition:
					color 0.12s,
					background 0.12s,
					border-color 0.12s;
			}
			button.dangerbtn:hover:not(:disabled),
			button.dangerbtn[data-armed='1'] {
				background: #a33f52;
				border-color: #a33f52;
				color: #fff;
			}
			button.dangerbtn:disabled {
				opacity: 0.6;
				cursor: default;
			}
			.modal-head {
				display: flex;
				gap: 1rem;
				align-items: center;
				margin-bottom: 1.1rem;
				padding-right: 2.4rem;
			}
			.modal-head .mav {
				flex: none;
				width: 84px;
			}
			.modal-head .mav svg {
				width: 100%;
				height: auto;
			}
			.modal-head h2 {
				margin: 0 0 0.3rem;
				font-size: 1.3rem;
			}
			.modal-head .msub {
				color: var(--muted);
				font-size: 0.82rem;
				display: flex;
				gap: 0.5rem 0.7rem;
				flex-wrap: wrap;
				align-items: center;
			}
			.checklist {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
				gap: 0.45rem 0.8rem;
			}
			.checkitem {
				display: flex;
				align-items: center;
				gap: 0.45rem;
				font-size: 0.84rem;
				color: var(--muted);
			}
			.checkitem .ck {
				width: 18px;
				height: 18px;
				border-radius: 50%;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				font-size: 0.72rem;
				font-weight: 700;
				flex: none;
			}
			.checkitem .ck.on {
				background: var(--accent-soft);
				color: var(--accent-dark);
			}
			.checkitem .ck.off {
				background: #f0e4e4;
				color: #b06a6a;
			}
			.reclist {

			.tbl {

				font-size: 0.78em;
				margin-left: 1px;

			 * and wraps instead of shoving the numbers off the edge. */

			}

			/* A card you can fold away. Used for raw reference data that is worth

			details.card > summary {

			/* Row-level delete. Quiet until you are near it — a red × on every row of

			.clocknote {

			.dscroll {

				height: 150px;

			.dcol .dn {

				white-space: nowrap;

			/* A floor on the column width, not an equal share of whatever is left:
			   90 days across a phone is 3px a bar, which is a texture rather than a

			.dcol {
				flex: 1 0 var(--dcolw, 6px);
				min-width: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-end;
				height: 100%;
				gap: 0.3rem;

			.dcol.nolab .dl,

			}
			/* A date is wider than its column and overhangs both sides. In the middle

			.dcol:first-child .dl {
				align-self: flex-start;

				align-self: flex-end;
			}
			.dhint {

			.dcol .dbar.zero {

				font-size: 0.78rem;

				border: 1px solid var(--rule);
				background: var(--card);

				padding: 0.2rem 0.7rem;
				border-radius: 999px;

			button.dbtn.on {
				background: var(--accent-soft);
				color: var(--accent-dark);
				border-color: var(--accent);

			/* The all-time figure kept beside a windowed count, so a filtered number

			.alltime {
				color: var(--faint);
				font-size: 0.72rem;
				font-variant-numeric: tabular-nums;

				font-size: 0.76rem;

			/* ---- phones ----
			 * Everything below is a width problem, not a phone problem: a section
			 * heading beside its subtitle, a bar label beside its bar, a five-column
			 * table. Each one is given back its own line rather than squeezed. */
			@media (max-width: 640px) {
				/* A heading and its subtitle side by side leaves each about half a
				   phone, so both wrap and interleave. Stack them. */
				.sec-head {
					flex-direction: column;
					align-items: flex-start;
					gap: 0.1rem;
				}
				.sec-head .sub {
					line-height: 1.35;
				}
				/* Same story one level down, inside a card. */
				.card h3 {
					gap: 0.1rem;
				}
				.card h3 .tag {
					flex: 1 0 100%;
				}
				/* Wider bars, and labels that wrap instead of becoming "Under …". */
				.bar {
					grid-template-columns: minmax(0, 42%) 1fr auto;
					gap: 0.5rem;
				}
				.bar .lab {
					white-space: normal;
					overflow: visible;
					line-height: 1.25;

				.chargrid {

				/* The step name and its numbers each get a full line. */
				.step {
					grid-template-columns: minmax(0, 1fr);
				}
				.step .sval {
					justify-content: flex-start;
					padding-left: 0.1rem;
				}
				/* Five columns on a phone: shrink the type and let long ids break
				   rather than shove the numbers off the right edge. */
				.tbl {
					font-size: 0.8rem;
				}
				.tbl th {
					font-size: 0.64rem;
					letter-spacing: 0.02em;
				}
				.tbl th.num,
				.tbl td.num {
					padding-left: 0.5rem;
				}
				.tbl td:first-child {
					overflow-wrap: anywhere;
				}
				/* A vertical rule between the presets and the date inputs only reads as
				   a divider while they share a line. Wrapped, it is a stray tick. */
				.dpick .dsep {
					display: none;
				}
				.dpick {
					gap: 0.35rem 0.4rem;
				}
				.dcolwrap {
					padding-left: 1.7rem;
				}
				/* A wider floor on a phone: 90 days across 300px is a 3px bar, which is
				   a texture, not a chart. Past this the strip scrolls instead. */
				.dcols {
					--dcolw: 8px;
				}
			}
			/* Zero-height, full-width flex item: forces the two action buttons onto a

			.metabreak {

					flex: 1 0 100%;
				}

				.meta button.refresh {
					margin-top: 0;
				}
			}

			'use strict';

			/* ------------------------------------------------------------------ *
			 * Color helpers — ported 1:1 from src/color.ts so avatars match the

			 * ------------------------------------------------------------------ */
			function hexToHsl(hex) {
				let c = String(hex || '#000000').replace('#', '');
				if (c.length === 3)

			/* ------------------------------------------------------------------ *
			 * Render building blocks

			/* `click` turns a tile into a button that opens a modal — used by "Active
			 * now", where the number is only half the answer and the other half (who,
			 * and where did they come from) is one click away. Tiles without it are
			 * plain text and stay unfocusable, so nothing looks pressable that isn't. */
			function kpi(v, k, hint, click) {
				const attrs = click
					? ` kpi-click" role="button" tabindex="0" data-kpi="${click}" title="Click for details`
					: '"';
				return `<div class="card kpi${attrs}"><div class="v">${v}</div><div class="k">${k}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
			}
			function barRows(entries, opts) {
				opts = opts || {};
				const cls = opts.cls || '';
				const rows = entries.filter((e) => e).map((e) => [e[0], n(e[1])]);
				if (!rows.length) return `<div class="emptynote">No data yet.</div>`;
				const max = opts.max || Math.max(...rows.map((r) => r[1]), 1);
				return `<div class="bars">${rows
					.map(
						([lab, val]) =>
							`<div class="bar"><span class="lab" title="${esc(lab)}">${esc(opts.labelMap ? opts.labelMap[lab] || lab : lab)}</span>` +
							`<span class="track"><span class="fill ${cls}" style="width:${Math.max(2, (val / max) * 100)}%"></span></span>` +
							`<span class="num">${opts.fmtNum ? opts.fmtNum(val) : fmt(val)}</span></div>`,
					)
					.join('')}</div>`;
			}
			function objToEntries(obj) {
				return Object.entries(obj || {}).sort((a, b) => n(b[1]) - n(a[1]));
			}

			function donut(segments, size) {
				size = size || 128;
				const total = segments.reduce((a, s) => a + n(s.value), 0) || 1;
				const r = size / 2 - 10,
					cx = size / 2,
					cy = size / 2,
					C = 2 * Math.PI * r;
				let off = 0;
				const rings = segments
					.map((s) => {
						const frac = n(s.value) / total;
						const dash = `${frac * C} ${C - frac * C}`;
						const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${-off * C}" transform="rotate(-90 ${cx} ${cy})"/>`;
						off += frac;
						return el;
					})
					.join('');
				const svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}<text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="20" font-weight="700" fill="#2f3a27">${fmt(total)}</text><text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="10" fill="#9aa189">total</text></svg>`;
				const legend = `<div class="legend">${segments.map((s) => `<span class="li"><span class="sw" style="background:${s.color}"></span>${esc(s.label)} · <b>${fmt(s.value)}</b></span>`).join('')}</div>`;
				return `<div class="donutwrap">${svg}<div>${legend}</div></div>`;
			}

			function funnel(steps) {
				const top = n(steps[0] && steps[0].value) || 1;
				return `<div class="funnel">${steps
					.map((st, i) => {
						const w = Math.max(3, (n(st.value) / top) * 100);
						const drop = i > 0 && steps[i - 1].value ? Math.round((1 - n(st.value) / n(steps[i - 1].value)) * 100) : 0;
						// Under ~18% the fill no longer reaches the end of the step name, so
						// the name goes back to dark-on-pale rather than white on nothing.
						const bare = (n(st.value) / top) * 100 < 18;
						return (
							`<div class="step${bare ? ' empty' : ''}">` +
							`<div class="strack"><span class="sfill" style="width:${w}%"></span>` +
							`<span class="sname">${esc(st.label)}</span></div>` +
							`<span class="sval"><span class="spct">${pct((st.value / top) * 100)}</span><span>${fmt(st.value)}</span>` +
							`${i > 0 && drop > 0 ? `<span class="drop">−${drop}%</span>` : ''}</span></div>`
						);
					})
					.join('')}</div>`;
			}

			function histCols(obj, opts) {
				opts = opts || {};
				const entries = opts.order
					? opts.order.filter((k) => k in (obj || {})).map((k) => [k, obj[k]])
					: Object.entries(obj || {});
				if (!entries.length) return `<div class="emptynote">No data yet.</div>`;
				const max = Math.max(...entries.map((e) => n(e[1])), 1);
				return `<div class="cols">${entries
					.map(([k, v]) => {
						const h = Math.max(3, (n(v) / max) * 82);
						return `<div class="col"><span class="cn">${fmt(v)}</span><span class="cbar" style="height:${h}px"></span><span class="cl">${esc(opts.labelMap ? opts.labelMap[k] || k : k)}</span></div>`;
					})
					.join('')}</div>`;
			}

			const r1 = (x) => Math.round(n(x) * 10) / 10;
			/* Per-edition rollup computed from the players array. A player is "demo" only
			 * when explicitly stamped edition:"demo"; everything else is the full game. */
			function editionStats(arr) {
				const c = arr.length;
				const sum = (f) => arr.reduce((a, p) => a + n(f(p)), 0);
				const rate = (k) => (c ? Math.round((arr.filter((p) => p.activation && p.activation[k]).length / c) * 100) : 0);
				const playSec = sum((p) => p.playSeconds);
				const returning = arr.filter((p) => n(p.sessions) > 1).length;
				return {
					count: c,
					playHours: r1(playSec / 3600),
					avgMin: c ? Math.round(playSec / 60 / c) : 0,
					avgSessions: c ? r1(sum((p) => p.sessions) / c) : 0,
					totalActions: sum((p) => p.totalActions),
					avgActions: c ? Math.round(sum((p) => p.totalActions) / c) : 0,
					avgAch: c ? r1(sum((p) => p.achievements && p.achievements.earned) / c) : 0,
					avgHealth: c ? Math.round(sum((p) => p.biomeSummary && p.biomeSummary.avgHealth) / c) : 0,
					avgBiomes: c ? r1(sum((p) => p.unlockedBiomes) / c) : 0,
					collected: rate('collected'),
					crafted: rate('crafted'),
					placed: rate('placed'),
					attractedAnimal: rate('attractedAnimal'),
					unlockedSecondBiome: rate('unlockedSecondBiome'),
					returningPct: c ? Math.round((returning / c) * 100) : 0,
				};
			}
			function vsTable(rows, demo, full) {

				const body = rows
					.map((row) => {
						const dv = demo[row.key],
							fv = full[row.key];
						const suf = row.suf || '';
						const share = n(dv) + n(fv) > 0 ? (n(dv) / (n(dv) + n(fv))) * 100 : 50;
						return (
							`<div class="vsrow"><span class="vlab">${row.label}</span>` +
							`<span class="vnums"><span class="vd">${fmt(dv)}${suf}</span><span class="vf">${fmt(fv)}${suf}</span></span>` +
							`<span class="vbar"><i style="width:${share}%"></i></span></div>`
						);
					})
					.join('');
				return `${legend}<div class="vs">${body}</div>`;
			}

			/* Every section declares which VIEW it belongs to, and the tab bar shows one
			   view at a time.
			
			   This page had grown to eighteen sections covering four unrelated
			   questions — how the game is doing, how the website is doing, whether
			   Harper is healthy, and what is currently broken — stacked in one column.
			   Answering any one of them meant scrolling past the other three, and the
			   two that matter when something is on fire (Problems, Harper) sat at the
			   bottom.
			
			   Filtering rather than re-rendering: every section is built once and CSS
			   hides the ones that do not match, so switching views is instant and no
			   data is refetched. */
			/* Which view is showing. Remembered, because whoever opens this page at
			   3am to find out why it is on fire wants Problems, and should not have to
			   choose it every time. */
			const VIEW_KEY = 'wwDashboardView';
			const VIEWS = ['game', 'website', 'harper', 'problems'];

			function applyView(view) {
				if (VIEWS.indexOf(view) === -1) view = 'game';
				document.body.setAttribute('data-view', view);
				document.querySelectorAll('[data-view-tab]').forEach((b) => {
					const on = b.getAttribute('data-view-tab') === view;
					b.classList.toggle('on', on);
					b.setAttribute('aria-selected', on ? 'true' : 'false');
				});
				try {
					localStorage.setItem(VIEW_KEY, view);
				} catch (e) {
					/* private window — the choice just does not persist */
				}
				noteEmptyView(view);
			}

			/* An empty view is ambiguous: it looks the same whether there is nothing
			   to report or the feed behind it failed to load. */
			function noteEmptyView(view) {
				const host = document.getElementById('root');
				if (!host) return;
				const old = host.querySelector('.viewempty');
				if (old) old.remove();
				if (!host.querySelector('section[data-view="' + view + '"]')) {
					const LABEL = {
						game: 'No gameplay metrics yet.',
						website: 'No website or classroom numbers yet — /LandingStats/ and /LessonStats/ may not be deployed on this instance.',
						harper: 'No Harper telemetry — /ServerHealth/ could not be read.',
						problems: 'Nothing is going wrong. Refusals, crashes and save failures all report here.',
					};
					const p = document.createElement('div');
					p.className = 'viewempty';
					p.textContent = LABEL[view] || 'Nothing to show.';
					host.appendChild(p);
				}

			document.addEventListener('click', (e) => {
				const tab = e.target.closest && e.target.closest('[data-view-tab]');
				if (tab) applyView(tab.getAttribute('data-view-tab'));

			function sec(title, sub, body, view) {

			/** objToEntries, minus the tally counters above. */

			/* Compact duration: minutes under an hour, else "Xh Ym". */

			/* How long a session actually lasts.

			 * hundreds. Shown as a share of the sessions it covers, not of all of them,
			 * or the percentages would be quietly wrong. */
			const SESSION_BUCKET_ORDER = ['<2m', '2-10m', '10-30m', '30m+'];
			const SESSION_BUCKET_LABELS = {

			};
			function sessionShapeHTML(s) {
				const sl = s.sessionLengths || (s.sessionLengthDistribution ? { buckets: s.sessionLengthDistribution } : null);
				if (!sl) return '';
				const buckets = sl.buckets || {};
				const covered = sl.sessionsCovered != null ? sl.sessionsCovered : Object.values(buckets).reduce((a, v) => a + n(v), 0);
				if (!covered) return '';
				const entries = SESSION_BUCKET_ORDER.filter((k) => buckets[k] != null).map((k) => [k, n(buckets[k])]);
				const total = n(sl.totalSessions);
				/* Measured against what CAN be measured, not against every session.
				 * A session is bucketed only when the next one starts, so each save's
				 * current session is permanently unbucketed — dividing by totalSessions
				 * reported 4% and read like a broken counter, when it was really saying
				 * "most people have played once so far". */
				const measurable = sl.sessionsMeasurable != null ? n(sl.sessionsMeasurable) : total;
				const inProgress = n(sl.sessionsInProgress);
				const tag = measurable
					? `${fmt(covered)} of ${fmt(measurable)} finished sessions (${pct(sl.coveragePct)})`
					: `${fmt(covered)} sessions measured`;
				return `<div style="margin-top:.8rem">${cardTitled(
					'How long a session lasts',
					tag,
					barRows(entries, { labelMap: SESSION_BUCKET_LABELS, cls: 'sky' }) +
						(inProgress
							? `<p class="emptynote">A session is measured only once the next one begins, so every caretaker's most recent session is still open — ` +
								`<b>${fmt(inProgress)}</b> of the ${fmt(total)} total are in progress and can't be bucketed yet. ` +
								`Older builds that never recorded lengths are missing too. The shares above are of the ${fmt(covered)} finished sessions on record.</p>`
							: ''),
				)}</div>`;
			}

			/* New caretakers per day.
			 *
			 * The range control here scopes THIS CHART ONLY, and the subtitle says so.
			 * It deliberately does not filter the rest of the page: almost every number
			 * above is a lifetime total carried on a save (play time, actions, biome
			 * health), not something attributable to a day, so a picker that appeared to
			 * scope the whole report would be answering a question the data can't. */
			const DAY_RANGE = { preset: '30', from: '', to: '' };
			/* The same control, over the landing page's own day rows. Its own state
			 * object rather than a shared one: the two charts answer different
			 * questions (saves created vs site visits) and are read at different
			 * zooms, so moving one has no business moving the other. */
			const LANDING_DAY_RANGE = { preset: '30', from: '', to: '' };

			/** Window a sorted `[{day: 'YYYY-MM-DD', …}]` list down to a range. */
			function sliceDays(days, range) {
				days = days || [];
				if (!days.length) return [];
				if (range.preset === 'custom') {
					const from = range.from || days[0].day;
					const to = range.to || days[days.length - 1].day;
					return days.filter((d) => d.day >= from && d.day <= to);
				}
				if (range.preset === 'all') return days;
				return days.slice(-Number(range.preset));
			}

			function visibleDays(daily) {
				return sliceDays((daily && daily.days) || [], DAY_RANGE);
			}
			function visibleLandingDays() {
				return sliceDays((LANDING && LANDING.days) || [], LANDING_DAY_RANGE);
			}

			/* A dense day-by-day bar chart. Its own renderer rather than histCols,
			 * which puts a number and a label under every column — fine for four
			 * tutorial steps, unreadable at ninety days. Here the count lives in the
			 * tooltip and the axis is labeled at intervals. */
			function dayCols(days, key) {
				if (!days.length) return `<div class="emptynote">No days in this range.</div>`;
				const max = Math.max(...days.map((d) => n(d[key])), 1);
				/* Every column ships its count and its date; which of them survive is
				 * decided by fitDayCharts() from the width the columns actually got.
				 * Deriving that from the day count alone was wrong at every width but
				 * the one it was tuned on — on a phone it produced a gray smear.
				 * Zeros stay blank: the flat tick already says nothing happened, and a
				 * row of 0s over empty days is noise competing with the real numbers. */
				const fmtDay = (iso) => {
					const [y, m, dd] = iso.split('-');
					return `${MONTHS[Number(m) - 1]} ${Number(dd)}`;
				};
				const bars = days
					.map((d) => {
						const v = n(d[key]);
						const h = v ? Math.max(2, (v / max) * 96) : 0;
						return (
							`<div class="dcol" title="${esc(fmtDay(d.day))} · ${fmt(v)}">` +
							`<span class="dn">${v ? fmt(v) : ''}</span>` +
							`<span class="dbar${v ? '' : ' zero'}" style="height:${h}px"></span>` +
							`<span class="dl">${esc(fmtDay(d.day))}</span></div>`
						);
					})
					.join('');
				return (
					`<div class="dcolwrap"><div class="dmax">${fmt(max)}</div>` +
					`<div class="dscroll"><div class="dcols">${bars}</div></div>` +
					`<p class="dhint">Scroll sideways for the rest of the range.</p></div>`
				);
			}

			/* Fit every day chart to the width it was actually given.
			 *
			 * Column width is not knowable when the markup is built — it depends on the
			 * card, the viewport, and whether the strip ended up scrolling — so labels
			 * and counts are dropped here, after layout, and again on resize. A date
			 * needs roughly 34px to sit under its bar without touching its neighbor;
			 * a two-digit count needs about 17px. Labels are spaced backwards from the
			 * last column so the most recent day is always the one that keeps its date. */
			function fitDayCharts() {
				for (const strip of document.querySelectorAll('.dcols')) {
					const cols = strip.children;
					if (!cols.length) continue;
					const w = cols[0].getBoundingClientRect().width;
					if (!w) continue; // not laid out yet (hidden tab, mid-render)
					const step = Math.max(1, Math.ceil(34 / w));
					const anchor = (cols.length - 1) % step;
					// Room for the widest count in THIS chart, not for a hypothetical
					// four-digit one: a column of single digits fits where "1,204" cannot.
					let widest = 0;
					for (const c of cols) widest = Math.max(widest, (c.firstElementChild.textContent || '').length);
					const showCounts = widest > 0 && w >= 6.5 * widest + 5;
					for (let i = 0; i < cols.length; i++) {
						cols[i].classList.toggle('nolab', i % step !== anchor);
						cols[i].classList.toggle('nonum', !showCounts);
					}
					// Measure the span of the columns themselves. scrollWidth is inflated
					// by the dates, which overhang the strip at both ends by design, and
					// would report a chart that fits exactly as scrollable.
					const box = strip.parentElement;
					const span = cols[cols.length - 1].getBoundingClientRect().right - cols[0].getBoundingClientRect().left;
					if (box) box.classList.toggle('canscroll', span - box.clientWidth > 2);
				}
			}
			addEventListener('resize', fitDayCharts);

			const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
			const DAY_PRESETS = [
				{ key: '7', label: '7d' },
				{ key: '30', label: '30d' },
				{ key: '90', label: '90d' },
				{ key: 'all', label: 'All' },
			];

			/* The preset pills + From/To pair, shared by every per-day chart.
			 *
			 * `scope` names the range object the click and change handlers should
			 * mutate, so two of these can sit on the same page without one moving the
			 * other. The date inputs show the window that is ACTUALLY on screen,
			 * whichever way it was chosen — they used to fall back to the whole
			 * dataset's first and last day whenever a preset was active, so clicking
			 * "7d" drew seven columns above two dates three months apart, and on a
			 * fresh instance (no firstDay/lastDay) they showed nothing at all. Reading
			 * the bounds off the rendered days means the pickers and the chart cannot
			 * disagree, and picking a preset then nudging one date starts from where
			 * you were rather than from the beginning of time. */
			function dayRangePicker(scope, range, shown, limits, label) {
				limits = limits || {};
				const firstShown = (shown[0] && shown[0].day) || limits.first || '';
				const lastShown = (shown[shown.length - 1] && shown[shown.length - 1].day) || limits.last || '';
				const bounds = `min="${esc(limits.first || firstShown)}" max="${esc(limits.last || lastShown)}"`;
				return (
					`<div class="dpick" role="group" aria-label="${esc(label || 'Date range')}">` +
					DAY_PRESETS.map(
						(p) =>
							`<button type="button" class="dbtn${range.preset === p.key ? ' on' : ''}" data-range="${p.key}" data-range-scope="${scope}" aria-pressed="${range.preset === p.key ? 'true' : 'false'}">${p.label}</button>`,
					).join('') +
					`<span class="dsep"></span>` +
					`<label>From <input type="date" class="dinput" data-range-from data-range-scope="${scope}" value="${esc(firstShown)}" ${bounds}></label>` +
					`<label>To <input type="date" class="dinput" data-range-to data-range-scope="${scope}" value="${esc(lastShown)}" ${bounds}></label>` +
					`</div>`
				);
			}

			function dailyHTML(s) {
				const daily = s.daily;
				if (!daily || !daily.days || !daily.days.length) return '';
				const shown = visibleDays(daily);
				const totalNew = shown.reduce((a, d) => a + n(d.created), 0);
				const busiest = shown.slice().sort((a, b) => n(b.created) - n(a.created))[0];
				/* The pickers' min/max come from the payload's own firstDay/lastDay when
				 * it has them — those can reach further back than the rows it shipped. */
				const picker = dayRangePicker(
					'daily',
					DAY_RANGE,
					shown,
					{ first: daily.firstDay, last: daily.lastDay },
					'Date range for new caretakers per day',
				);
				const sub = shown.length
					? `${fmt(totalNew)} new in ${fmt(shown.length)} ${shown.length === 1 ? 'day' : 'days'}` +
						(busiest && busiest.created ? ` · busiest ${esc(busiest.day)} with ${fmt(busiest.created)}` : '')
					: 'no days in this range';
				// Saves created only. The payload also carries a per-day `lastSeen`, but
				// it is the day each save was LAST active — not daily actives — and a
				// second chart of it next to this one invited exactly the misreading it
				// was captioned to prevent. Left in the API for anything that wants it.
				return sec(
					'New caretakers per day',
					'this chart only — the rest of the page is all-time',
					picker + cardTitled('Saves created', sub, dayCols(shown, 'created')),
				);
			}

			/* What the play-time numbers are NOT counting, and why.
			 *
			 * Two separate caveats ride on every duration on this page: windows left
			 * open (excluded by default), and the fact that rev 1 clients counted
			 * untouched windows as play while rev 2 does not. Both were reported in the
			 * payload and shown nowhere, which is the worst of both — the numbers were
			 * already qualified, the reader just couldn't see it. */
			function clockNoteHTML(s) {
				const a = s.anomalies;
				if (!a) return '';
				const clock = a.clock || {};
				const revs = Object.entries(clock.byRev || {}).filter((e) => n(e[1]) > 0);
				const mixed = revs.length > 1;
				if (!a.idlePlayers && !mixed) return '';
				const bits = [];
				if (a.idlePlayers) {
					bits.push(
						`<div class="clocknote"><b>${fmt(a.idlePlayers)} ${a.idlePlayers === 1 ? 'save' : 'saves'} left a window open</b> — ` +
							`${fmt(a.idleHours)} hours and ${fmt(a.idleActions)} actions of it. ` +
							(a.excluded
								? `Excluded from ${esc(a.affects)}; they still count everywhere else.`
								: `<em>Currently included.</em> Switch “Idle windows” to Exclude to drop them from ${esc(a.affects)}.`) +
							`<span class="cnrule">${esc(a.rule)}</span></div>`,
					);
				}
				if (mixed) {
					bits.push(
						`<div class="clocknote"><b>Two play-time definitions in one total.</b> ${esc(clock.note || '')} — ` +
							revs.map(([k, v]) => `${fmt(v)} on ${esc(k)}`).join(', ') +
							`. Read any trend that crosses the change as two series, not one.` +
							(clock.idleGateMinutes ? `<span class="cnrule">rev 2 stops the clock after ${n(clock.idleGateMinutes)} min untouched</span>` : '') +
							`</div>`,
					);
				}
				return `<div style="margin-top:.8rem">${cardTitled('About these durations', 'what the clock does and does not count', bits.join(''))}</div>`;
			}

			/* ------------------------------------------------------------------ *
			 * Player highlights — sort order
			 * ------------------------------------------------------------------ *
			 * Every field below is already on the rows in hand, so changing the
			 * order redraws from the payload with no refetch — the same contract as
			 * the per-day chart's presets.
			 *
			 * `val` returns the number to rank DESCENDING by, which is why recency
			 * is negated: the smallest gap since last played is the highest rank. */
			const HL_SORTS = [
				{ key: 'playtime', label: 'Playtime', val: (p) => n(p.playSeconds) },
				{
					key: 'animals',
					label: 'Animals returned',
					val: (p) => n(p.biomeSummary && p.biomeSummary.totalAnimalsReturned),
				},
				{ key: 'recent', label: 'Recently played', val: (p) => -hlSinceMinutes(p) },
				{ key: 'actions', label: 'Actions', val: (p) => n(p.totalActions) },
				{
					key: 'achievements',
					label: 'Achievements',
					val: (p) => n(p.achievements && p.achievements.earned),
				},
				{
					key: 'restored',
					label: 'Biomes restored',
					val: (p) => n(p.biomeSummary && p.biomeSummary.biomesFullyRestored),
				},
				{ key: 'menus', label: 'Time in menus', val: (p) => hlMenuSeconds(p) },
			];
			const HL_SORT = { key: 'playtime' };

			/* The wall is paged rather than printed whole.
			 *
			 * Every qualifying caretaker used to be drawn at once. That is fine at
			 * thirty and a scroll bar with no bottom at three thousand — each card
			 * carries an inline avatar SVG, so the cost of the section grew with the
			 * player base and landed entirely on the browser. Forty is the page size:
			 * a round number that fills a few rows at every column count the grid
			 * uses (2, 3 and 4 across), so no page ends in a lonely single card.
			 *
			 * `page` is clamped at render rather than trusted, because everything
			 * upstream of it can change the number of pages without touching it —
			 * refreshing, switching edition, moving the version filter. */
			const HL_PAGE_SIZE = 40;
			const HL_PAGE = { index: 0 };

			/* Seconds this caretaker has spent in menus.
			 *
			 * menuTotalSeconds is what the server sends, but a row written before
			 * menu dwell shipped carries neither it nor the per-menu map, so fall
			 * back to summing the map and then to 0. Zero here means "never
			 * measured" as often as it means "never opened a menu" — which is what
			 * menuMeasured is for, and why the card prints nothing at all rather
			 * than a confident 0% when the flag is false. */
			function hlMenuSeconds(p) {
				if (!p) return 0;
				if (p.menuTotalSeconds != null) return n(p.menuTotalSeconds);
				return Object.values(p.menuSeconds || {}).reduce((a, v) => a + n(v), 0);
			}

			/* Minutes since a caretaker was last active.
			 *
			 * minutesSinceActive is what the rest of the page reads, but it is absent
			 * on rows written before it shipped, so fall back to hoursSinceActive and
			 * then to lastSeenAt. A row carrying none of the three ranks LAST rather
			 * than first — an unknown gap is not a recent one. */
			function hlSinceMinutes(p) {
				if (!p) return Infinity;
				if (p.minutesSinceActive != null) return n(p.minutesSinceActive);
				if (p.hoursSinceActive != null) return n(p.hoursSinceActive) * 60;
				const t = p.lastSeenAt ? new Date(p.lastSeenAt).getTime() : NaN;
				return isFinite(t) ? Math.max(0, (Date.now() - t) / 60000) : Infinity;
			}

			/* Compact "time since" for the highlight cards: minutes, then hours, then
			 * days. Deliberately coarse — nobody reads this one to the minute. */
			function fmtSince(mins) {
				if (!isFinite(mins)) return '—';
				if (mins < 1) return 'now';
				if (mins < 60) return Math.round(mins) + 'm';
				const h = Math.round(mins / 60);
				if (h < 48) return h + 'h';
				return Math.round(h / 24) + 'd';
			}

			/* ------------------------------------------------------------------ *
			 * Per-player modal — a full picture of one caretaker's playthrough
			 * ------------------------------------------------------------------ */
			let PLAYERS_BY_ID = {};
			let modalEl = null;
			let LANDING = null; // latest GET /LandingStats/ payload (null until loaded / if unavailable)
			let CLASSROOM = null; // latest GET /LessonStats/ payload (same contract)
			let SAVEHEALTH = null; // latest GET /SaveHealth/ payload — records that would not decode
			let GAMEPLAYHEALTH = null; // latest GET /GameplayHealth/ payload — refusals + interface crashes
			let SERVERHEALTH = null; // latest GET /ServerHealth/ payload — Harper's own telemetry
			/* How far back the server view looks, in minutes.
			 *
			 * One hour, fixed. Not 15: Harper emits the gauges (database size,
			 * storage volume, thread utilization) sparsely, and a short window lands
			 * BETWEEN samples and reports them as absent — which is how this panel
			 * first shipped showing em-dashes on a healthy server. Not adjustable in
			 * the UI either: a 24h window makes ServerHealth read to its 4,000-row
			 * cap and it became the slowest endpoint on the instance. The endpoint
			 * still honors ?minutes= for anyone reading it directly. */
			const SERVER_WINDOW = 60;

			/** How this caretaker has their settings — every option in Settings →
			 *  Accessibility, plus audio. Sourced from the `prefs` block each solo
			 *  session uplinks (snapshotPrefs in src/solo/metricsUplink.ts); these live
			 *  in localStorage, so a save that has not reported since the block was
			 *  added simply has no `prefs` and the card is skipped rather than drawn
			 *  full of made-up defaults.
			 *
			 *  Booleans render as the same on/off checklist the Milestones card uses,
			 *  so "off" reads as a deliberate state rather than missing data — the
			 *  point of a per-player view is being able to confirm an option is OFF,
			 *  not just spot the ones that are on. `interactHint` is inverted here
			 *  because it ships ON: what is worth seeing is that this player turned it
			 *  off. Everything with more than two values (colorblind mode, text size,
			 *  font, theme) gets a labeled row instead, using the same label maps as
			 *  the site-wide rollup. */
			function prefsCardHTML(p) {
				const pr = p.prefs;
				if (!pr || typeof pr !== 'object') return '';
				const toggles = [
					['Reduce motion', !!pr.reduceMotion],
					['High contrast', !!pr.highContrast],
					['Simpler wording', !!pr.simpleText],
					['Interact hint off', pr.interactHint === false],
				];
				const a11yOn = toggles.some(([, on]) => on) || (pr.colorblindMode && pr.colorblindMode !== 'off');
				const checks = `<div class="checklist">${toggles
					.map(
						([l, on]) =>
							`<span class="checkitem"><span class="ck ${on ? 'on' : 'off'}">${on ? '✓' : '·'}</span>${l}</span>`,
					)
					.join('')}</div>`;

				const lookup = (map, v) => (v == null || v === '' ? '—' : map[v] || esc(String(v)));
				// The theme is two facts, not one: 'system' is a choice that only tells
				// you what they are looking at once it is resolved, so show the resolved
				// value beside it — but only when it adds something.
				const themeText =
					pr.theme === 'system' && pr.themeResolved
						? `${THEME_LABELS.system} → ${lookup(THEME_LABELS, pr.themeResolved)}`
						: lookup(THEME_LABELS, pr.theme);
				const rows = [
					['Colorblind aid', lookup(CB_LABELS, pr.colorblindMode)],
					['Text size', lookup(TS_LABELS, pr.textScale)],
					['Font', lookup(FONT_LABELS, pr.fontChoice)],
					['Appearance', themeText],
				];

				// Audio is a pair of independent switches plus a level each. A level is
				// only meaningful while its switch is on, so a muted channel reads
				// "Off" outright instead of "Off · 60%", which invites the wrong reading.
				const vol = (v) => (v == null ? '' : ` · ${Math.round(n(v) * 100)}%`);
				const chan = (on, v) => (on === false ? 'Off' : `On${vol(v)}`);
				rows.push(['Music', chan(pr.musicEnabled, pr.musicVolume)]);
				rows.push(['Sound effects', chan(pr.sfxEnabled, pr.sfxVolume)]);

				const list = `<div class="reclist" style="margin-top:.8rem">${rows
					.map(([l, v]) => `<div class="recrow"><b>${l}</b><span>${v}</span></div>`)
					.join('')}</div>`;
				return cardTitled(
					'Settings & accessibility',
					a11yOn ? 'using accessibility options' : 'all accessibility options off',
					checks + list,
				);
			}

			/** Build the modal body for one player: header, headline stats, progress,
			 *  milestones, a full action breakdown, time-by-area, and recent achievements. */
			function playerModalHTML(p) {
				const bs = p.biomeSummary || {},
					ach = p.achievements || {},
					act = p.activation || {},
					counts = p.counts || {};
				const edi = p.edition === 'demo' ? 'demo' : 'full';
				const areaMin =
					p.areaMinutes && Object.keys(p.areaMinutes).length
						? p.areaMinutes
						: Object.fromEntries(Object.entries(p.areaSeconds || {}).map(([k, v]) => [k, Math.round(n(v) / 60)]));
				const joined = p.daysSinceJoined != null ? `joined ${p.daysSinceJoined}d ago` : '';
				const last = p.hoursSinceActive != null ? `last seen ${p.hoursSinceActive}h ago` : '';
				const tut = n(p.tutorialStep) >= 99 ? 'Done' : `Step ${n(p.tutorialStep)}`;

				const kpis = `<div class="grid kpis">${[
					kpi(fmtDur(p.playSeconds), 'Played', `${fmt(n(p.playMinutes))}m total`),
					kpi(fmt(n(p.sessions)), n(p.sessions) === 1 ? 'Session' : 'Sessions', `${n(p.avgSessionMinutes)}m avg`),
					kpi(fmt(n(p.totalActions)), 'Actions', `${n(p.actionsPerMinute)}/min`),
					kpi(`${n(ach.earned)}<small>/${n(ach.total)}</small>`, 'Achievements', `${fmt(n(ach.points))} pts`),
				].join('')}</div>`;

				const progress = cardTitled(
					'Progress',
					null,
					`<div class="grid kpis">${[
						kpi(fmt(n(p.unlockedBiomes || bs.biomesUnlocked)), 'Biomes unlocked'),
						kpi(fmt(n(bs.biomesFullyRestored)), 'Biomes restored'),
						kpi(`${n(bs.avgHealth)}<small>%</small>`, 'Avg biome health'),
						kpi(fmt(n(bs.totalAnimalsReturned)), 'Animals returned'),
					].join('')}</div>`,
				);

				const cdid = (k) => n(counts[k]) > 0;
				const flags = [
					['Collected a resource', act.collected || cdid('resourcesCollected')],
					['Terraformed the land', act.terraformed || cdid('terraformActions')],
					['Planted something', act.planted || cdid('plantsPlanted')],
					['Crafted an item', act.crafted || cdid('itemsCrafted')],
					['Placed an object', act.placed || cdid('objectsPlaced')],
					['Attracted an animal', act.attractedAnimal || n(bs.totalAnimalsReturned) > 0],
					['Upgraded a tool', act.upgradedTool || cdid('toolsUpgraded')],
					['Built a home', act.builtHome || cdid('homesBuilt')],
					['Upgraded a home', act.upgradedHome || cdid('homeUpgrades')],
					['Unlocked 2nd biome', act.unlockedSecondBiome || n(p.unlockedBiomes || bs.biomesUnlocked) >= 2],
				];
				// Demo players get one more: did they reach the end of the demo? The demo
				// stops itself after DEMO_FOREST_MINUTES spent standing in the forest
				// (src/demo.ts), so forest dwell time IS the finish line — several saves
				// sit at exactly 600s because that is where the thank-you popup froze
				// them. Read from the player's own row, which means a finished demo whose
				// save was wiped on dismiss reads as unfinished here; the device-scoped
				// `demoCompletion` block in the summary is the one that survives that.
				const DEMO_FOREST_SECONDS = 10 * 60;
				if (edi === 'demo') {
					flags.push(['Finished the demo', n((p.areaSeconds || {}).forest) >= DEMO_FOREST_SECONDS]);
				}
				const checklist = cardTitled(
					'Milestones',
					null,
					`<div class="checklist">${flags
						.map(
							([l, on]) =>
								`<span class="checkitem"><span class="ck ${on ? 'on' : 'off'}">${on ? '✓' : '·'}</span>${l}</span>`,
						)
						.join('')}</div>`,
				);

				// Summed over the rows that are actually drawn, so the header count and
				// the bars under it cannot disagree — the gathered:* tallies are
				// excluded from both (see HIDDEN_COUNTER_PREFIXES).
				const actionRows = actionEntries(counts);
				const totalActs = actionRows.reduce((a, e) => a + n(e[1]), 0);
				const actionsCard = cardTitled(
					'Everything they did',
					`${fmt(totalActs)} actions`,
					barRows(actionRows, { labelMap: ACTION_LABELS }),
				);
				const areaCard = Object.keys(areaMin).length
					? cardTitled(
							'Time by area',
							null,
							barRows(objToEntries(areaMin), { cls: 'sky', fmtNum: (v) => `${fmt(v)}m` }),
						)
					: '';
				// Menu time overlaps area time, so this reads as a share of play
				// rather than as the remainder of the card above.
				const menuMin =
					p.menuMinutes && Object.keys(p.menuMinutes).length
						? p.menuMinutes
						: Object.fromEntries(Object.entries(p.menuSeconds || {}).map(([k, v]) => [k, Math.round(n(v) / 60)]));
				const menuCard = Object.keys(menuMin).length
					? cardTitled(
							'Time in menus',
							p.menuShareOfPlay != null ? `${p.menuShareOfPlay}% of play time` : null,
							barRows(objToEntries(menuMin), { cls: 'gold', fmtNum: (v) => `${fmt(v)}m` }),
						)
					: '';

				const recent = (ach.recent || []).slice(0, 8);
				const recCard = recent.length
					? cardTitled(
							'Recent achievements',
							`${n(ach.earned)} earned`,
							`<div class="reclist">${recent
								.map(
									(r) =>
										`<div class="recrow"><b>${esc(r.name || r.id || '')}</b><span>${r.earnedAt ? new Date(r.earnedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''}</span></div>`,
								)
								.join('')}</div>`,
						)
					: '';

				const onboard = cardTitled(
					'Onboarding',
					null,
					`<div class="grid kpis">${[
						kpi(p.creationSeconds != null ? `${n(p.creationSeconds)}<small>s</small>` : '—', 'Creation time'),
						kpi(
							p.timeToFirstActionSeconds != null ? `${n(p.timeToFirstActionSeconds)}<small>s</small>` : '—',
							'Time to 1st action',
						),
						kpi(tut, 'Tutorial'),
					].join('')}</div>`,
				);

				const prefsCard = prefsCardHTML(p);

				const meta = esc(
					[p.platform, p.os, p.version, LANG_LABELS[p.language] || p.language].filter(Boolean).join(' · '),
				);
				const when = [joined, last].filter(Boolean).join(' · ');
				/* Carried over from the demo. Spelled out here rather than left as a
				 * chip: the modal is where you go to find out what actually happened,
				 * and "1h 46m in the demo, then bought it" is the story. */
				const mc = p.conversion || {};
				const mconv = p.convertedFromDemo
					? `<span class="hltag hlconv" title="${mc.exact ? 'Stamped when the save was exported' : 'Inferred from this save’s demo row — it predates the export stamp'}">demo → full${
							mc.demoPlaySeconds ? ` · ${fmtDur(mc.demoPlaySeconds)} in the demo` : ''
