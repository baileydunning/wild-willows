				 * and brought their meadow across. They used to sit apart — the screen
				 * buried inside Demo completion, the carry-over in a card of its own —
				 * which put a store-click rate and the purchases it produced on opposite
				 * sides of the grid, where nobody could read one against the other.
				 *
				 * "Finished the demo" measures the demo. The carry-over measures whether
				 * the demo SELLS the game, which is a stronger statement than either an
				 * install or a completion — hence its own headline row rather than a
				 * footnote to a completion funnel.
				 *
				 * Gated per BLOCK, not per card. The screen's numbers need only that
				 * somebody finished the demo; hanging them off a completed purchase would
				 * hide the funnel exactly when it matters most — before the first sale,
				 * when the open question is whether the screen converts at all. */
				const cvs = s.conversions || {};
				/* Off the SAME denominator as "Finished the demo" in Demo completion:
				 * everyone who reaches the hard stop sees this screen, so it has no
				 * "shown" of its own to report. It and the "are you done playing?" prompt
				 * were a single funnel until this screen got a buy link at all, which is
				 * exactly why the prompt's number used to look healthy: it was carrying
				 * every store click in the demo by itself. */
				const endScreenBlock = n(dc.reachedGoal)
					? `<div class="grid three">${[
							kpi(fmt(de.shown != null ? de.shown : dc.reachedGoal), 'Reached it', 'everyone who finished'),
							kpi(
								`<span class="accent">${pct(de.exportPct)}</span>`,
								'Saved their meadow',
								`${fmt(de.exported)} exported from the popup`,
							),
							kpi(pct(de.storePct), 'Went to a store', `${fmt(de.storeClicked)} clicked through`),
						].join('')}</div>` +
						`<p class="emptynote">The buy links were added to this screen after launch — it had none at all before that. ` +
						`A flat zero from builds that predate them is a measurement gap, not a finding.</p>`
					: '';
				const carriedBlock = cvs.demoToFull
					? `<div class="grid three">${[
							kpi(
								`<span class="accent">${fmt(cvs.demoToFull)}</span>`,
								cvs.demoToFull === 1 ? 'Caretaker' : 'Caretakers',
								cvs.inferred
									? `${fmt(cvs.inferred)} matched to their demo save${cvs.stamped ? `, ${fmt(cvs.stamped)} stamped at export` : ''}`
									: 'stamped when the save was exported',
							),
							kpi(pct(cvs.ratePct), 'Of demo saves', `${fmt(cvs.demoSavesSeen)} demo saves reported in`),
							kpi(
								`${fmt(cvs.avgDemoMinutesBeforeBuying)}<small>m</small>`,
								'Demo play first',
								'average, before carrying over',
							),
						].join('')}</div>`
					: '';
				const convCard =
					endScreenBlock || carriedBlock
						? cardTitled(
								'The end of the demo',
								'the hard stop, and who came across',
								(endScreenBlock ? `<h4 class="sub-h">End-of-demo screen</h4>${endScreenBlock}` : '') +
									(carriedBlock
										? // No top margin when this is the only block in the card, so a
											// lone carry-over row doesn't float below its own heading.
											`<h4 class="sub-h"${endScreenBlock ? ' style="margin-top:1rem"' : ''}>Carried over from the demo</h4>` +
											carriedBlock
										: ''),
							)
						: '';
				// Every activation signal we have. "Created" is the entry point (always first
				// and largest); the rest are sorted by count so the funnel always reads
				// top-down. They're independent booleans, not strict prerequisites, so sorting
				// by count — not by an assumed sequence — is the honest way to show them.
				const funRest = [
					{ label: 'Collected a resource', value: fun.collected },
					{ label: 'Terraformed the land', value: fun.terraformed },
					{ label: 'Planted something', value: fun.planted },
					{ label: 'Crafted an item', value: fun.crafted },
					{ label: 'Placed an object', value: fun.placed },
					{ label: 'Attracted an animal', value: fun.attractedAnimal },
					{ label: 'Upgraded a tool', value: fun.upgradedTool },
					{ label: 'Built a home', value: fun.builtHome },
					{ label: 'Upgraded a home', value: fun.upgradedHome },
					{ label: 'Unlocked 2nd biome', value: fun.unlockedSecondBiome },
				]
					.filter((st) => st.value != null)
					.sort((a, b) => n(b.value) - n(a.value));
				const funSteps = funnel([{ label: 'Created character', value: fun.created }, ...funRest]);

				/* ---- The starter chain, and what it hands over to ----
				 * The ten opening goals, one per row, in the order players meet them.
				 * Unlike the activation funnel above this one IS strictly ordered — a
				 * player cannot reach step 6 without claiming 5 — so the drop-off between
				 * rows is real and says exactly which goal is losing people.
				 *
				 * The tiles underneath are the point of the whole feature. Finishing ten
				 * goals is not success; picking the board up afterwards is. If "Wrote
				 * their own" stays low while "Finished" climbs, the chain is teaching
				 * people to wait for instructions rather than to set their own. */
				const sch = s.starterChain || {};
				const starterCard = n(sch.saves)
					? cardTitled(
							'Starter goals',
							`${fmt(sch.saves)} saves on the chain` +
								(n(sch.legacySaves) ? ` · ${fmt(sch.legacySaves)} pre-chain saves skipped` : ''),
							funnel(
								(sch.steps || []).map((st) => ({
									label: STARTER_LABELS[st.id] || st.id,
									value: st.reached,
								})),
							) +
								`<div class="grid three" style="margin-top:1rem">${[
									kpi(
										`<span class="accent">${pct(sch.completedPct)}</span>`,
										'Finished all ten',
										`${fmt(sch.completed)} of ${fmt(sch.saves)} saves`,
									),
									kpi(
										`<span class="accent">${pct(sch.authoredAfterFinishingPct)}</span>`,
										'Wrote their own',
										`${fmt(sch.authoredAfterFinishing)} of those who finished`,
									),
									kpi(r1(sch.avgGoalsAuthored), 'Goals authored', 'average per save, ever'),
								].join('')}</div>`,
						)
					: '';

				out.push(
					sec(
						'Funnels',
						'from install to a thriving meadow',
						`<div class="grid two">${acqCards}${cardTitled('Activation funnel', 'all caretakers', funSteps)}</div>` +
							(demoCard && convCard
								? `<div class="grid two" style="margin-top:.8rem">${demoCard}${convCard}</div>`
								: demoCard
									? `<div style="margin-top:.8rem">${demoCard}</div>`
									: convCard
										? `<div style="margin-top:.8rem">${convCard}</div>`
										: '') +
							(starterCard ? `<div style="margin-top:.8rem">${starterCard}</div>` : ''),
					),
				);

				/* ---- Progression ---- */
				const tut = P.tutorialStepHistogram || {};
				const tutDone = n(tut['99']);
				const tutTotal = Object.values(tut).reduce((a, v) => a + n(v), 0) || 1;
				out.push(
					sec(
						'Progression',
						'restoring the biomes',
						`<div class="grid two">` +
							cardTitled(
								'Restoration',
								null,
								`<div class="grid three">${[
									kpi(`${fmt(P.avgBiomeHealth)}<small>%</small>`, 'Avg biome health'),
									kpi(fmt(P.biomesFullyRestored), 'Biomes fully restored'),
									kpi(n(P.avgUnlockedBiomes), 'Avg biomes unlocked'),
								].join(
									'',
								/* "Most loved" used to sit here as a full-width bar. It was a bar
								   chart of one category drawn at 100% — the bar carried no
								   information, and "most loved" was really "most dwelt in", which
								   the Time by area panel below answers properly and with the
								   minutes behind it. */
								)}</div>`,
							) +
							cardTitled(
								'Tutorial completion',
								`${pct((tutDone / tutTotal) * 100)} finished`,
								histCols(tut, {
									labelMap: { 0: 'Step 0', 99: 'Done' },
								}) +
									`<div class="hint" style="color:var(--faint);font-size:.76rem;margin-top:.5rem">Step 99 = tutorial complete. Early drop-off shows where new caretakers pause.</div>`,
							) +
							`</div>`,
					),
				);

				/* ---- Time by area ---- */
				const ad = s.areaDwell || {};
				const byAreaMin =
					ad.byAreaMinutes && Object.keys(ad.byAreaMinutes).length
						? ad.byAreaMinutes
						: Object.fromEntries(Object.entries(ad.byAreaSeconds || {}).map(([k, v]) => [k, Math.round(n(v) / 60)]));
				if (Object.keys(byAreaMin).length) {
					const totalMin =
						ad.totalSeconds != null
							? Math.round(n(ad.totalSeconds) / 60)
							: Object.values(byAreaMin).reduce((a, v) => a + n(v), 0);
					out.push(
						sec(
							'Time by area',
							'where caretakers spend their minutes',
							cardTitled(
								'Minutes per area',
								`${fmt(totalMin)}m total · most time in ${esc(ad.mostTimeArea || objToEntries(byAreaMin)[0][0])}`,
								barRows(objToEntries(byAreaMin), { cls: 'sky', fmtNum: (v) => `${fmt(v)}m` }),
							),
						),
					);
				}

				/* ---- Time in menus ---- */
				// Menu time OVERLAPS area time (a player reading the journal in the
				// forest is in both), so this is a share of play time, not the
				// remainder of the panel above it. Only saves that have reported it
				// count toward the share — old rows would otherwise drag it to zero.
				const md = s.menuDwell || {};
				const byMenuMin =
					md.byMenuMinutes && Object.keys(md.byMenuMinutes).length
						? md.byMenuMinutes
						: Object.fromEntries(Object.entries(md.byMenuSeconds || {}).map(([k, v]) => [k, Math.round(n(v) / 60)]));
				if (Object.keys(byMenuMin).length) {
					const menuTotalMin =
						md.totalMinutes != null
							? n(md.totalMinutes)
							: Object.values(byMenuMin).reduce((a, v) => a + n(v), 0);
					const share = md.shareOfPlayPct != null ? `${md.shareOfPlayPct}% of play time` : 'share not yet measurable';
					const spo = md.secondsPerOpen || {};
					const opens = md.byMenuOpens || {};
					out.push(
						sec(
							'Time in menus',
							'which menus caretakers live in, and which they only glance at',
							cardTitled(
								'Minutes per menu',
								`${fmt(menuTotalMin)}m total · ${esc(share)} · most time in ${esc(md.mostUsedMenu || objToEntries(byMenuMin)[0][0])}`,
								barRows(objToEntries(byMenuMin), { cls: 'sky', fmtNum: (v) => `${fmt(v)}m` }),
							) +
								cardTitled(
									'Opens per menu',
									`${fmt(md.totalOpens)} opens across ${fmt(md.measuredSaves)} saves reporting menu time`,
									barRows(objToEntries(opens), { cls: 'gold', fmtNum: (v) => fmt(v) }) +
										`<div class="hint" style="color:var(--faint);font-size:.76rem;margin-top:.5rem">Seconds per open: ` +
										esc(
											objToEntries(spo)
												.filter(([, v]) => v != null)
												.slice(0, 6)
												.map(([k, v]) => `${k} ${v}s`)
												.join(' · ') || '—',
										) +
										`. A menu with many opens and few seconds each is being checked, not read.</div>`,
								),
						),
					);
				}

				/* ---- Platforms / OS / versions ---- */
				const plat = s.platforms || {},
					oss = s.operatingSystems || {},
					vers = s.versions || {},
					langs = s.languages || {};
				const platSeg = [
					{ label: 'Desktop', value: plat.desktop, color: '#4a7c46' },
					{ label: 'Web', value: plat.web, color: 'var(--s2)' },
				].filter((x) => x.value);
				out.push(
					sec(
						'Platforms & builds',
						'where the game is being played',
						`<div class="grid two">` +
							cardTitled('Platform', null, donut(platSeg)) +
							cardTitled(
								'Operating system',
								null,
								barRows(objToEntries(oss), { labelMap: OS_LABELS, cls: 'sky' }),
							) +
							cardTitled('Language', null, barRows(objToEntries(langs), { labelMap: LANG_LABELS, cls: 'rose' })) +
							`</div><div class="card" style="margin-top:.8rem"><h3>Game version</h3>` +
							barRows(objToEntries(vers), { cls: 'gold' }) +
							`</div>`,
					),
				);

				/* ---- Action totals ---- */
				const acts = s.actionTotals || {};
				out.push(
					sec(
						'What caretakers do',
						'every tracked action, all-time',
						card(barRows(actionEntries(acts).slice(0, 17), { labelMap: ACTION_LABELS })),
					),
				);

				/* ---- Onboarding timing ---- */
				const cr = s.creation || {},
					ttfa = s.timeToFirstAction || {};
				out.push(
					sec(
						'Onboarding',
						'first impressions',
						`<div class="grid kpis">${[
							kpi(
								`${n(cr.avgCreationSeconds)}<small>s</small>`,
								'Avg creation time',
								`${fmt(cr.savesWithTiming)} timed`,
							),
							kpi(`${n(cr.medianCreationSeconds)}<small>s</small>`, 'Median creation time'),
							/* The MEDIAN, not the mean. A save created and then left open
							 * overnight before anyone touched it contributes a five-figure
							 * number, and a handful of those had this tile reading 4924s —
							 * 82 minutes — while real first actions land around 6-20s. The
							 * mean is still in the payload as ttfa.avgSeconds; it just has
							 * no business being the headline. */
							kpi(
								`${n(ttfa.medianSeconds != null ? ttfa.medianSeconds : ttfa.avgSeconds)}<small>s</small>`,
								'Time to first action',
								ttfa.medianSeconds != null
									? `median of ${fmt(ttfa.playersMeasured)}` +
										(ttfa.outliersExcluded
											? ` · mean ${n(ttfa.avgSeconds)}s incl. ${fmt(ttfa.outliersExcluded)} walked away`
											: '')
									: `${fmt(ttfa.playersMeasured)} measured`,
							),
							kpi(
								`${n(acq.avgCharactersPerPerson)}`,
								'Characters per person',
								`${fmt(acq.totalCharactersCreated)} created total`,
							),
						].join('')}</div>`,
					),
				);

				/* ---- Settings & accessibility ---- */
				const set = s.settings || {};
				if (set.savesReporting) {
					const au = set.audio || {},
						a11y = set.accessibility || {};
					const cbLabels = CB_LABELS,
						tsLabels = TS_LABELS,
						themeLabels = THEME_LABELS,
						fontLabels = FONT_LABELS;
					out.push(
						sec(
							'Settings & accessibility',
							`what ${fmt(set.savesReporting)} caretakers have turned on`,
							`<div class="grid two">` +
								cardTitled(
									'Audio',
									'since the sound update',
									`<div class="grid three">${[
										kpi(
											`<span class="accent">${pct(au.musicOffPct)}</span>`,
											'Music off',
											`${fmt(au.musicOff)} caretakers`,
										),
										kpi(pct(au.sfxOffPct), 'SFX off', `${fmt(au.sfxOff)} caretakers`),
										kpi(fmt(au.fullyMuted), 'Fully muted'),
									].join('')}</div>`,
								) +
								cardTitled(
									'Accessibility options',
									'how many have each on',
									`<div class="grid three">${[
										kpi(
											`<span class="accent">${fmt(a11y.anyEnabled)}</span>`,
											'Using any option',
											`of ${fmt(set.savesReporting)} caretakers`,
										),
										kpi(fmt(a11y.reduceMotion), 'Reduce motion'),
										kpi(fmt(a11y.highContrast), 'High contrast'),
										kpi(fmt(a11y.colorblindOn), 'Colorblind aid'),
										kpi(fmt(a11y.simpleText), 'Simpler wording'),
										kpi(fmt(a11y.interactHintOff), 'Interact hint off', 'on by default'),
									].join(
										'',
									)}</div><div style="margin-top:1rem">${barRows(objToEntries(a11y.textScales || {}), { labelMap: tsLabels, cls: 'sky' })}</div>`,
								) +
								`</div>` +
								(a11y.themes
									? `<div class="card" style="margin-top:.8rem"><h3>Appearance<span class="tag">light, dark or following the device</span></h3>${barRows(
											objToEntries(a11y.themes),
											{ labelMap: themeLabels, cls: 'gold' },
										)}${
											a11y.themesResolved
												? `<div style="margin-top:1rem"><h3 style="margin:0 0 .4rem">On screen<span class="tag">what "Match system" actually resolved to</span></h3>${barRows(
														objToEntries(a11y.themesResolved),
														{ labelMap: themeLabels, cls: 'sky' },
													)}</div>`
												: ''
										}</div>`
									: '') +
								(a11y.fonts
									? `<div class="card" style="margin-top:.8rem"><h3>Font<span class="tag">which typeface caretakers pick</span></h3>${barRows(objToEntries(a11y.fonts), { labelMap: fontLabels, cls: 'sky' })}</div>`
									: '') +
								(a11y.colorblindOn
									? `<div class="card" style="margin-top:.8rem"><h3>Colorblind modes<span class="tag">among users of the aid</span></h3>${barRows(
											objToEntries(a11y.colorblindModes || {}).filter(([k]) => k !== 'off'),
											{ labelMap: cbLabels, cls: 'gold' },
										)}</div>`
									: ''),
						),
					);
				}

				/* ---- Achievements ---- */
				const ach = s.achievements || {};
				const byCat = ach.byCategory || {};
				const catLabels = {
					'getting-started': 'Getting started',
					biome: 'Biome',
					preserve: 'Preserve',
					mastery: 'Mastery',
				};
				out.push(
					sec(
						'Achievements',
						'milestones earned across the meadow',
						`<div class="grid two">` +
							cardTitled(
								'Totals',
								null,
								`<div class="grid three">${[
									kpi(fmt(ach.totalEarned), 'Earned', `of ${fmt(ach.totalDefined)} defined`),
									kpi(n(ach.avgPerPlayer), 'Avg per caretaker'),
									kpi(`${fmt(ach.avgPoints)}<small>pts</small>`, 'Avg points'),
								].join(
									'',
								)}</div><div style="margin-top:1rem">${barRows(objToEntries(byCat), { labelMap: catLabels, cls: 'gold' })}</div>`,
							) +
							cardTitled(
								'Completion spread',
								'% of achievements earned',
								histCols(ach.completionHistogram, {
									order: ['0', '1-10', '11-20', '21-30', '31-40', '41-50'],
									labelMap: {
										0: '0%',
										'1-10': '1–10',
										'11-20': '11–20',
										'21-30': '21–30',
										'31-40': '31–40',
										'41-50': '41–50',
									},
								}) +
									`<div class="hint" style="color:var(--faint);font-size:.76rem;margin-top:.5rem">Most caretakers are early on; a few have restored nearly everything.</div>`,
							) +
							`</div>`,
					),
				);

				/* ---- Most-earned achievements ---- */
				const rec = s.achievements && s.achievements.recentDistribution;
				if (rec && Object.keys(rec).length) {
					out.push(
						sec(
							'Popular achievements',
							'most frequently earned',
							card(barRows(objToEntries(rec).slice(0, 12), { cls: '' })),
						),
					);
				}

				/* Save health and "What is going wrong" are NOT pushed into `out`.
				 * Problems is a mode, not a section: when it is on the page shows those
				 * two and nothing else (see the assembly at the end of render). */

				/* ---- Player highlights ---- */
				if (charSection) out.push(charSection);

				/* ---- Problems mode ----
				 * When it is on, the page IS the failure panels — everything above is
				 * built but not shown. Two views of one dataset rather than a long page
				 * with a tail: you are either reading how the game is going or chasing
				 * something that broke, and the numbers are a distraction from the second.
				 *
				 * Everything above is still computed rather than skipped. It costs
				 * nothing measurable (the data is already in the browser) and it keeps
				 * one code path, so the two views can never disagree about the same
				 * filters. PLAYERS_BY_ID stays populated too, so a modal opened before
				 * switching still resolves. */
				if (MODE === 'server') {
					document.getElementById('root').innerHTML =
						serverHealthHTML() ||
						`<section><div class="sec-head"><h2>Server health</h2><span class="sub">no telemetry available</span></div>` +
							card(
								`<p class="emptynote"><code>/ServerHealth/</code> did not answer. On an instance that predates it, that is expected; ` +
									`otherwise it is itself worth chasing, because an unreachable health endpoint and a healthy server look the same from here.</p>`,
							) +
							`</section>`;
					fitDayCharts();
					return;
				}

				if (MODE === 'problems') {
					const panels = [healthSection, saveSection].filter(Boolean);
					document.getElementById('root').innerHTML = panels.length
						? panels.join('')
						: `<section><div class="sec-head"><h2>Nothing to report</h2><span class="sub">no problem data available</span></div>` +
							card(
								`<p class="emptynote">Neither <code>/GameplayHealth/</code> nor <code>/SaveHealth/</code> answered, so there is nothing to show here — ` +
									`which is not the same as nothing being wrong. An instance that predates those endpoints looks exactly like a healthy one from this page.</p>`,
							) +
							`</section>`;
					fitDayCharts();
					return;
				}

				document.getElementById('root').innerHTML = out.join('');

				/* The tabs are hidden until there is something to switch between —
				 * a switcher above a sign-in form is furniture. */
				const tabs = document.getElementById('view-tabs');
				if (tabs) tabs.hidden = false;
				let saved = 'game';
				try {
					saved = localStorage.getItem(VIEW_KEY) || 'game';
				} catch (e) {
					/* private window — start on Game */
				}
				applyView(saved);

				// Charts can only be fitted once they are in the document and measurable.
				fitDayCharts();
			}

			/* ------------------------------------------------------------------ *
			 * Fetch + wire-up
			 * ------------------------------------------------------------------ */
			// Active dashboard filters (all server-side, applied to the whole report).
			// `idle` defaults to 'exclude': an abandoned window is not play, so the numbers
			// on this page should not count it unless you deliberately ask them to.
			const FILTERS = { version: 'all', edition: 'all', platform: 'all', versionMode: 'exact', idle: 'exclude' };

			/** Gray out the "Range" selector unless a specific version is chosen. */
			function syncVersionMode() {
				const wrap = document.getElementById('version-mode-wrap');
				const sel = document.getElementById('version-mode');
				if (!wrap || !sel) return;
				const off = FILTERS.version === 'all';
				wrap.classList.toggle('is-off', off);
				sel.disabled = off;
				sel.value = FILTERS.versionMode;
			}
			const FILTER_CFG = [
				{ key: 'version', el: 'version-filter', list: 'availableVersions', allLabel: 'All versions', cap: (v) => v },
				{
					key: 'edition',
					el: 'edition-filter',
					list: 'availableEditions',
					allLabel: 'All editions',
					cap: (v) => v.charAt(0).toUpperCase() + v.slice(1),
				},
				{
					key: 'platform',
					el: 'platform-filter',
					list: 'availablePlatforms',
					allLabel: 'All platforms',
					cap: (v) => v.charAt(0).toUpperCase() + v.slice(1),
				},
			];

			/** Fill each filter dropdown from the response, preserving the active choices. */
			function populateFilterOptions(filters) {
				if (!filters) return;
				for (const cfg of FILTER_CFG) {
					const sel = document.getElementById(cfg.el);
					const opts = filters[cfg.list];
					if (!sel || !Array.isArray(opts)) continue;
					sel.innerHTML =
						`<option value="all">${cfg.allLabel}</option>` +
						opts.map((v) => `<option value="${esc(v)}">${esc(cfg.cap(String(v)))}</option>`).join('');
					sel.value = FILTERS[cfg.key] === 'all' || opts.includes(FILTERS[cfg.key]) ? FILTERS[cfg.key] : 'all';
					FILTERS[cfg.key] = sel.value;
				}
				// Restore the version range mode from the server echo, then sync the control.
				FILTERS.versionMode = filters.versionMode === 'min' ? 'min' : 'exact';
				syncVersionMode();
			}

			/* ------------------------------------------------------------------ *
			 * Credentials
			 *
			 * The page is public; every endpoint it reads is not. So this holds the
			 * username and password you sign in with and attaches them as HTTP basic
			 * auth to each request — which is what the browser's own password prompt
			 * would have done, done by hand so the page does not depend on Harper
			 * sending WWW-Authenticate.
			 *
			 * sessionStorage, not localStorage: it survives a refresh (you are not
			 * retyping a password every time you hit Refresh mid-investigation) and
			 * dies with the tab, so a shared or forgotten machine does not keep it.
			 *
			 * Sign in with a read-only Harper role, never the super-user account. A
			 * password held in a browser tab should be one that can read these numbers
			 * and do nothing else.
			 * ------------------------------------------------------------------ */
			const AUTH_KEY = 'ww-dashboard-auth';
			let AUTH = null; // { header, username, role, superUser }

			/* btoa() only accepts Latin-1 and throws on anything else, which would turn
			 * a perfectly good password containing a non-ASCII character into an
			 * unexplained crash at sign-in. Encode as UTF-8 bytes first, per RFC 7617. */
			function basicHeader(username, password) {
				const bytes = new TextEncoder().encode(`${username}:${password}`);
				let bin = '';
				for (const b of bytes) bin += String.fromCharCode(b);
				return 'Basic ' + btoa(bin);
			}

			function loadAuth() {
				try {
					const raw = JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null');
					if (raw && typeof raw.header === 'string') AUTH = raw;
				} catch {
					/* unreadable — treat as signed out */
				}
			}
			function saveAuth(auth) {
				AUTH = auth;
				try {
					sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth));
				} catch {
					/* storage unavailable — stays in memory for this page view */
				}
			}
			function signOut() {
				AUTH = null;
				try {
					sessionStorage.removeItem(AUTH_KEY);
				} catch {
					/* nothing to clear */
				}
				showLogin();
			}
			window.__signOut = signOut;

			/* Request options for every fetch on this page. A function, not a constant,
			 * because the credentials arrive after the script does. */
			function req() {
				return {
					headers: AUTH
						? { accept: 'application/json', authorization: AUTH.header }
						: { accept: 'application/json' },
					credentials: 'same-origin',
				};
			}

			/* The roll-up used to arrive as ONE response: aggregates with a record for
			 * every player stapled to the end. At 310 saves that was ~1 MB, 98.6% of it
			 * the player array, and there was no way to ask for the 6 KB of aggregates
			 * on their own. It is two endpoints now — /MetricsSummary/ for the numbers,
			 * /MetricsPlayers/ for the rows, paginated.
			 *
			 * This page still wants every row (the caretaker wall, the demo/full splits
			 * and the per-player modal are all computed client-side over the full set),
			 * so it pages through and reassembles the exact `{...summary, players:[…]}`
			 * shape render() has always been handed. Nothing downstream of here changed,
			 * and every save already in the database renders exactly as it did before. */
			const PLAYER_PAGE = 500;
			const PLAYER_CAP = 20000; // a stop, not a policy — see the warning below

			async function fetchAllPlayers(qs) {
				const out = [];
				let cursor = '';
				let total = null;
				for (;;) {
					const url = `../MetricsPlayers/?${qs}&limit=${PLAYER_PAGE}` + (cursor ? `&cursor=${encodeURIComponent(cursor)}` : '');
					const res = await fetch(url, req());
					if (!res.ok) throw new Error(`MetricsPlayers returned ${res.status}`);
					const page = await res.json();
					total = page.total;
					out.push(...(page.players || []));
					if (!page.nextCursor || !(page.players || []).length || out.length >= PLAYER_CAP) break;
					cursor = page.nextCursor;
				}
				/* If the cap ever bites, say so on the page. A silently truncated list
				 * would quietly understate every client-side total on this dashboard. */
				return { players: out, total, truncated: total != null && out.length < total };
			}

			/* ------------------------------------------------------------------ *
			 * Sign in
			 * ------------------------------------------------------------------ */
			/** Reveal or conceal everything that is not the sign-in form. */
			function setSignedOut(out) {
				document.body.classList.toggle('signed-out', !!out);
				/* The title is part of the disclosure: "Metrics Dashboard" in a tab
				 * or a browser-history entry says as much as the page would. */
				document.title = out ? 'Wild Willows' : 'Wild Willows — Metrics Dashboard';
			}

			function showLogin(message) {
				setSignedOut(true);
				const gen = document.getElementById('generated');
				if (gen) gen.textContent = '';
				document.querySelectorAll('header .vfilter').forEach((el) => (el.hidden = true));
				['refresh', 'problems'].forEach((id) => {
					const el = document.getElementById(id);
					if (el) el.hidden = true;
				});
				syncWhoami();
				document.getElementById('root').innerHTML =
					`<section class="loginwrap"><form class="card login" id="login-form">` +
					`<h2>Sign in</h2>` +
					`<label>Username<input type="text" id="login-user" autocomplete="username" required autofocus></label>` +
					`<label>Password<input type="password" id="login-pass" autocomplete="current-password" required></label>` +
					(message ? `<p class="loginerr" role="alert">${esc(message)}</p>` : '') +
					`<button type="submit" class="refresh" id="login-go">Sign in</button>` +
					`</form></section>`;
				document.getElementById('login-form').addEventListener('submit', async (e) => {
					e.preventDefault();
					const btn = document.getElementById('login-go');
					const username = document.getElementById('login-user').value.trim();
					const password = document.getElementById('login-pass').value;
					if (!username || !password) return;
					btn.disabled = true;
					btn.textContent = 'Checking…';
					const header = basicHeader(username, password);
					try {
						// Checked against /DashboardAuth/, which reads nothing. Testing a
						// password by rolling up every save would be an odd way to spend a
						// database scan.
						const res = await fetch('../DashboardAuth/', {
							headers: { accept: 'application/json', authorization: header },
							credentials: 'same-origin',
						});
						if (res.status === 401 || res.status === 403) {
							// 401 and 403 are different failures and it is worth saying which:
							// one means the password is wrong, the other means the account is
							// real but not permitted — only one of those is worth retyping.
							return showLogin(
								res.status === 403
									? 'That account signed in but is not allowed to read the dashboard. It needs the metrics_reader role, or super-user.'
									: 'Wrong username or password.',
							);
						}
						if (!res.ok) return showLogin(`The server answered ${res.status}. Try again in a moment.`);
						const who = await res.json();
						/* superUser decides whether the modal offers the remove control.
						 * A session restored from sessionStorage that predates this field
						 * is simply missing it, which hides the button until the next
						 * sign-in — the right way round for a destructive action, and the
						 * server refuses it regardless of what the page chose to draw. */
						saveAuth({
							header,
							username: who.username || username,
							role: who.role || null,
							superUser: !!who.superUser,
						});
						document.querySelectorAll('header .vfilter').forEach((el) => (el.hidden = false));
						const rf = document.getElementById('refresh');
						if (rf) rf.hidden = false;
						syncWhoami();
						load();
					} catch (err) {
						showLogin(`Could not reach the server — ${String((err && err.message) || err)}`);
					} finally {
						btn.disabled = false;
						btn.textContent = 'Sign in';
					}
				});
			}

			/* Harper's own telemetry, rendered in Problems mode.
			 *
			 * Everything else on that page is the GAME going wrong. This is the SERVER
			 * going wrong, which produces no gameplay events at all — a saturated
			 * thread or a replication stall looks like silence from every other panel. */
			/* Who the traffic actually was. A load-balancer probe every couple of
			 * seconds outnumbers real players on a small game, and until it is named
			 * it silently pads every request total on this page. */
			function trafficHTML(ht) {
				const rq = ht && ht.requests;
				if (!rq || (!rq.app && !rq.infrastructure)) return '';
				const total = n(rq.gameplay != null ? rq.gameplay : rq.app) + n(rq.infrastructure);
				const rows = [
					['Gameplay', n(rq.gameplay != null ? rq.gameplay : rq.app)],
					['This dashboard', n(rq.dashboard)],
					['Health probes', n(rq.probes)],
					['Console & admin', n(rq.operations)],
				].filter((r) => r[1] > 0);
				const list = (xs) => (xs || []).map((p) => `<code>${esc(p)}</code>`).join(' ');
				return (
					`<div class="card" style="margin-top:.8rem"><h3>Who called<span class="tag">requests in this window</span></h3>` +
					barRows(rows, { cls: 'sky' }) +
					(n(rq.infrastructure)
						? `<p class="emptynote">${pct(total ? (n(rq.infrastructure) / total) * 100 : 0)} of requests are not players — the platform ` +
							`health-checking your nodes (${list(rq.probePaths)}) and Harper's console (${list(rq.operationPaths)}). ` +
							`That is why the 5xx rate is taken over gameplay only.</p>`
						: '') +
					(rq.reconcilesWithResponses === false
						? `<p class="emptynote">These request records and the response counters <b>disagree</b> by more than 5%, so the 5xx rate above ` +
							`is left over all traffic rather than being adjusted by a number that does not add up.</p>`
						: '') +
					`</div>`
				);
			}

			/* Everything Harper reported, with no opinion about it. The gauges above
			 * are a reading of seven or eight of these; this is all of them, so a
			 * metric this dashboard has never heard of is still something you can
			 * look at rather than a name in a footnote. */
			function allMetricsHTML(h) {
				const all = h.allMetrics || [];
				if (!all.length) return '';
				const num = (v) => (v == null ? '—' : fmt(v));
				const rows = all
					.map(
						(m) =>
							`<tr><td><code>${esc(m.metric)}</code>${m.read ? '' : ' <span class="alltime">not charted</span>'}</td>` +
							`<td class="num">${fmt(m.samples)}</td>` +
							`<td class="num">${num(m.latest)}</td>` +
							`<td class="num">${num(m.mean)}</td>` +
							`<td class="num">${num(m.min)}</td>` +
							`<td class="num">${num(m.max)}</td>` +
							`<td class="num">${m.paths ? fmt(m.paths) : '—'}</td></tr>`,
					)
					.join('');
				/* Collapsed by default. This is the raw telemetry, and it is genuinely
				 * useful when a gauge above looks wrong — but twenty-one rows of
				 * rocksdb counters as the last thing on the page buried the four
				 * numbers the page exists to show. Open it when you want it. */
				return (
					`<details class="card" style="margin-top:.8rem"><summary><b>Everything Harper reported</b> <span class="tag">${fmt(all.length)} metrics · raw</span></summary>` +
					`<table class="tbl"><thead><tr><th>Metric</th><th class="num">Samples</th><th class="num">Latest</th>` +
					`<th class="num">Mean</th><th class="num">Min</th><th class="num">Max</th><th class="num">Routes</th></tr></thead>` +
					`<tbody>${rows}</tbody></table>` +
					`<p class="emptynote">Counters (bytes, responses) read as <b>Mean</b> per sample; gauges (sizes, utilization) as <b>Latest</b>. ` +
					`<b>Routes</b> is how many distinct paths a metric was broken down by — 0 means instance-wide. ` +
					`To see a metric's records verbatim, including the unit: <code>/ServerHealth/?raw=&lt;metric&gt;</code>.</p></details>`
				);
			}

			function serverHealthHTML() {
				const h = SERVERHEALTH;
				if (!h) return '';
				if (!h.readable) {
					// Say WHICH failure it is. "Can't read the telemetry" and "the server
					// is fine" must never render the same.
					return sec(
						'Server health',
						'telemetry unavailable',
						card(
							`<p class="emptynote">Could not read <code>system.hdb_analytics</code>: <b>${esc(h.readError || 'unknown')}</b>.</p>` +
								// The successful read that "proved" this works was taken while the
								// account was temporarily super-user, so it proved nothing about the
								// read-only role. Say what is actually known.
								`<p class="emptynote">The read HAS worked from this component as a super-user. Whether a plain <code>metrics_reader</code> ` +
								`can do the same is still unestablished — Harper's super-user role carries explicit read permission on the system tables and a ` +
								`read-only role may not. If this panel fills in as super-user and not otherwise, that is the answer.</p>`,
						),
										'harper',
					);
				}
				const t = h.threads || {},
					st = h.storage || {},
					ht = h.http || {},
					rep = h.replication || {};
				/* Scale the unit to the number. A 4MB database rendered as "0.00GB",
				   which is indistinguishable from having read nothing at all. */
				const gb = (b) => {
					if (b == null) return '—';
					const v = n(b);
					if (v >= 1e9) return `${(v / 1e9).toFixed(2)}<small>GB</small>`;
					if (v >= 1e6) return `${(v / 1e6).toFixed(1)}<small>MB</small>`;
					if (v >= 1e3) return `${(v / 1e3).toFixed(1)}<small>KB</small>`;
					return `${fmt(v)}<small>B</small>`;
				};
				const round1v = (x) => Math.round(n(x) * 10) / 10;
				const gt = ht.gameplayTiming;
				// Color only past the point where it is worth looking at. Under a
				// second a slow call is a curiosity; past that a player feels it.
				const slowTone = (ms) => (n(ms) >= 1000 ? '<span class="accent">' : '<span>');
				// Not rounded to a whole percent: 4MB in a 286GB volume is 0.0014%, and
				// Math.round makes that a flat 0 — which reads as "no data", not "tiny".
				const quota = st.volumeBytes && st.databaseBytes ? (st.databaseBytes / st.volumeBytes) * 100 : null;
				const endpointTable = (list, title, tag, note) => {
					if (!list || !list.length) return '';
					const rows = list
						.map(
							(r) =>
								`<tr><td><code>${esc(r.path)}</code></td><td>${esc(r.method || '—')}</td>` +
								`<td class="num">${fmt(r.worstMs)}<small>ms</small></td>` +
								`<td class="num">${r.typicalMs == null ? '—' : fmt(r.typicalMs) + '<small>ms</small>'}</td>` +
								`<td class="num">${fmt(r.calls)}</td></tr>`,
						)
						.join('');
					return (
						`<div class="card" style="margin-top:.8rem"><h3>${esc(title)}<span class="tag">${esc(tag)}</span></h3>` +
						`<table class="tbl"><thead><tr><th>Path</th><th>Method</th><th class="num">Worst</th>` +
						`<th class="num">Typical</th><th class="num">Calls</th></tr></thead><tbody>${rows}</tbody></table>` +
						(note ? `<p class="emptynote">${note}</p>` : '') +
						`</div>`
					);
				};
				const statusRows = objToEntries(ht.byStatus).slice(0, 8);
				return sec(
					'Server health',
					`Harper's own telemetry · last ${fmt(h.windowMinutes)} min · ${fmt(h.samples)} samples`,
					`<div class="grid kpis">${[
						/* The capacity ceiling: a small number of threads serves this whole
						 * app, so sustained utilization runs out before anything else. */
						kpi(t.cpuPct == null ? '—' : pct(t.cpuPct), 'CPU'),
						kpi(t.memoryPct == null ? '—' : pct(t.memoryPct), 'Memory'),
						kpi(
							gb(st.databaseBytes),
							'Database size',
							// Summed across databases, and it says so — otherwise a total
							// that is bigger than any single figure in the table below
							// looks like a mistake.
							(st.databaseParts > 1 ? `${fmt(st.databaseParts)} databases · ` : '') +
								(quota == null ? '' : `${ratePct(quota)} of the volume`),
						),
						/* How long gameplay takes, next to how often it fails. A perfect
						 * error rate on a server that answers every call in two seconds is
						 * a game nobody plays, so the timing sits beside the 5xx rate
						 * rather than being buried in the table below it. */
						...(gt
							? [
									kpi(
										gt.typicalMs == null ? '—' : `${fmt(gt.typicalMs)}<small>ms</small>`,
										'Gameplay response',
										`typical across ${fmt(gt.calls)} request${gt.calls === 1 ? '' : 's'}`,
									),
									kpi(
										gt.worstMs == null ? '—' : `${slowTone(gt.worstMs)}${fmt(gt.worstMs)}<small>ms</small></span>`,
										'Slowest gameplay call',
										// A worst-case with no name attached is not something you
										// can go and fix.
										gt.worstPath ? `<code>${esc(gt.worstPath)}</code>${gt.worstMethod ? ' ' + esc(gt.worstMethod) : ''}` : 'no path recorded',
									),
								]
							: []),
						kpi(
							ht.serverErrors ? `<span class="accent">${ratePct(ht.errorRatePct)}</span>` : pct(0),
							'5xx rate',
							// Never just "of N responses". Which N it is over is the whole
							// difference between a rate about players and a rate diluted by
							// a load balancer polling every couple of seconds.
							ht.errorRateBasis === 'app'
								? `${fmt(ht.serverErrors)} of ${fmt(ht.errorRateOf)} gameplay requests`
								: `${fmt(ht.serverErrors)} of ${fmt(ht.responses)} responses — <b>all traffic</b>`,
						),
						kpi(
							rep.latencyMs == null ? '—' : `${fmt(rep.latencyMs)}<small>ms</small>`,
							'Replication lag',
							rep.samples ? `${fmt(rep.samples)} samples between nodes` : 'no samples in this window',
						),
					].join('')}</div>` +
						// Gameplay first: this is what players actually wait for. The
						// dashboard's own endpoints follow, because a slow metrics query is
						// a different problem from a slow Collect and reading them in one
						// list makes the game look worse than it is.
						endpointTable(ht.slowest, 'Gameplay endpoints', 'what players wait for · worst first',
							'Grouped by path across the window. <b>Worst</b> is the slowest p95 seen, not a window percentile — that cannot be recovered from per-period summaries. <b>Typical</b> is weighted by call volume.') +
						endpointTable(ht.slowestDashboard, 'Dashboard endpoints', 'what this page costs · worst first',
							'This page reading itself. Not player traffic, and excluded from the 5xx rate above.') +
						(statusRows.length
							? `<div class="card" style="margin-top:.8rem"><h3>Responses<span class="tag">by status</span></h3>${barRows(statusRows, { cls: 'sky' })}</div>`
							: '') +
						(h.cappedAtMaxRows
							? `<p class="emptynote"><b>This window is partial.</b> The read stopped at its row cap, so everything above is computed from the ` +
								`first ${fmt(h.samples)} records in the range rather than all of them — pick a shorter window for a complete picture.</p>`
							: '') +
						trafficHTML(ht) +
						allMetricsHTML(h),
					'harper',
				);
			}

			/** Who is signed in, with a way out. */
			function syncWhoami() {
				const el = document.getElementById('whoami');
				if (!el) return;
				el.hidden = !AUTH;
				if (AUTH)
					el.innerHTML =
						`${esc(AUTH.username)}${AUTH.role ? ` <span class="wrole">${esc(AUTH.role)}</span>` : ''} · ` +
						`<button type="button" class="linkish" id="signout">Sign out</button>`;
			}

			async function load() {
				// The page is public and the data is not, so every path in starts here.
				if (!AUTH) return showLogin();
				setSignedOut(false);
				const root = document.getElementById('root');
				const gen = document.getElementById('generated');
				root.innerHTML = `<div class="skeleton">Gathering the meadow’s numbers…</div>`;
				try {
					// Exclude dev/test saves so they don't skew the numbers (matches the
					// server's ?exclude filter). Optional version/edition/platform each scope
					// the whole report server-side. The SAME query string goes to both
					// endpoints, so the aggregates and the rows always describe one population.
					let qs = 'exclude=bailey_test';
					for (const cfg of FILTER_CFG) {
						if (FILTERS[cfg.key] && FILTERS[cfg.key] !== 'all')
							qs += `&${cfg.key}=` + encodeURIComponent(FILTERS[cfg.key]);
					}
					// A specific version can be widened to "this version & newer" (min mode);
					// otherwise the report isolates the single selected version.
					if (FILTERS.version !== 'all' && FILTERS.versionMode === 'min') qs += '&versionMode=min';
					// Windows left open are classified server-side and dropped from every
					// aggregate when hidden, so the totals and the per-player list agree.
					if (FILTERS.idle === 'exclude') qs += '&idle=exclude';
					// Landing-page stats load in parallel, best-effort: a missing/failed
					// /LandingStats/ just hides that section instead of breaking the page.
					const landingReq = fetch('../LandingStats/', req())
						.then((r) => (r.ok ? r.json() : null))
						.catch(() => null);
					// The classroom kit's counters. Same best-effort contract: an instance
					// that predates /LessonStats/ hides the section rather than breaking
					// the page.
					const classroomReq = fetch('../LessonStats/', req())
						.then((r) => (r.ok ? r.json() : null))
						.catch(() => null);
					// Same best-effort contract: a missing /SaveHealth/ hides the panel rather
					// than breaking the page.
					const saveReq = fetch('../SaveHealth/', req())
						.then((r) => (r.ok ? r.json() : null))
						.catch(() => null);
					// Refusals + interface crashes. Same contract again: an instance that
					// predates the endpoint hides the panel rather than breaking the page.
					// The Problems range is applied SERVER-side, over the per-day buckets —
					// the browser can't do it, because a row's all-time count carries no
					// dates to filter on.
					const healthReq = fetch(`../GameplayHealth/${problemsQuery()}`, req())
						.then((r) => (r.ok ? r.json() : null))
						.catch(() => null);
					// Harper's own telemetry, read in-process from system.hdb_analytics.
					// Same best-effort contract: a failure hides the panel, it never
					// breaks the page.
					const serverReq = fetch(`../ServerHealth/?minutes=${SERVER_WINDOW}`, req())
						.then((r) => (r.ok ? r.json() : null))
						.catch(() => null);
					// Aggregates first — they render the whole page except the caretaker
					// wall, so they are the ones worth having in flight on their own.
					const sumRes = await fetch(`../MetricsSummary/?${qs}`, req());
					if (!sumRes.ok) throw new Error(`MetricsSummary returned ${sumRes.status}`);
					const head = await sumRes.json();
					const rows = await fetchAllPlayers(qs);
					// Rebuild the shape render() has always received.
					const data = { ...head, players: rows.players };
					LANDING = await landingReq;
					CLASSROOM = await classroomReq;
					SAVEHEALTH = await saveReq;
					GAMEPLAYHEALTH = await healthReq;
					SERVERHEALTH = await serverReq;
					populateFilterOptions(data.filters);
					render(data);
					// After render: the badge reads the two health payloads, which only
					// just resolved above.
					syncProblemsButton();
					if (rows.truncated) {
						const warn = document.createElement('div');
						warn.className = 'err';
						warn.innerHTML = `<b>Showing ${fmt(rows.players.length)} of ${fmt(rows.total)} caretakers.</b> Per-player totals below are computed from the ones loaded.`;
						root.prepend(warn);
					}
					if (data.generatedAt) {
						const d = new Date(data.generatedAt);
						gen.textContent = `Updated ${d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`;
					}
				} catch (err) {
					// A 401/403 mid-session means the credentials stopped working — the
					// password changed, the role was revoked, the account was disabled.
					// Drop them and ask again rather than leaving a dead session showing
					// an error it cannot recover from.
					if (/returned 40[13]/.test(String(err && err.message))) {
						AUTH = null;
						try {
							sessionStorage.removeItem(AUTH_KEY);
						} catch {
							/* nothing to clear */
						}
						return showLogin('Your sign-in is no longer valid. Please sign in again.');
					}
					root.innerHTML =
						`<div class="err"><b>Couldn’t load metrics.</b><br>${esc(err.message || err)}<br>` +
						`<span style="font-size:.8rem;opacity:.8">The dashboard reads from <code>/MetricsSummary/</code> and <code>/MetricsPlayers/</code> on this host.</span></div>`;
					gen.textContent = '';
				}
			}

			document.getElementById('refresh').addEventListener('click', load);

			// The three views. Clicking the view you are already in returns you to the
			// dashboard, so every button is its own way out.
			function wireMode(id, mode) {
				const el = document.getElementById(id);
				if (!el) return;
				el.addEventListener('click', () => {
					setMode(MODE === mode ? 'dashboard' : mode);
					rerender();
					syncProblemsButton();
					// Each switch replaces the whole page, so start it at the top rather
					// than dropping you mid-way down a document you have not seen.
					window.scrollTo({ top: 0, behavior: 'smooth' });
				});
			}
			wireMode('problems', 'problems');
			wireMode('serverbtn', 'server');
			wireMode('backbtn', 'dashboard');

			/* Drop a deleted record from the cached payload, both from the visible
			 * `top` list and from the totals it contributed to — otherwise the badge
			 * keeps counting a crash that no longer exists. */
			function forgetProblem(kind, id) {
				const h = GAMEPLAYHEALTH;
				if (!h) return;
				const bucket = kind === 'refusal' ? h.refusals : h.clientErrors;
				if (!bucket || !Array.isArray(bucket.top)) return;
				const hit = bucket.top.find((r) => r.id === id);
				if (!hit) return;
				bucket.top = bucket.top.filter((r) => r.id !== id);
				bucket.total = Math.max(0, n(bucket.total) - n(hit.count));
				bucket.distinct = Math.max(0, n(bucket.distinct) - 1);
				if (bucket.windowTotal != null && hit.windowCount != null)
					bucket.windowTotal = Math.max(0, n(bucket.windowTotal) - n(hit.windowCount));
			}
			for (const cfg of FILTER_CFG) {
				const sel = document.getElementById(cfg.el);
				if (sel)
					sel.addEventListener('change', (e) => {
						FILTERS[cfg.key] = e.target.value;
						if (cfg.key === 'version') syncVersionMode(); // enable/disable the range control
						load();
					});
			}
			const idleSel = document.getElementById('idle-filter');
			if (idleSel) {
				idleSel.value = FILTERS.idle;
				idleSel.addEventListener('change', (e) => {
					FILTERS.idle = e.target.value === 'include' ? 'include' : 'exclude';
					load();
				});
			}
			const versionModeSel = document.getElementById('version-mode');
			if (versionModeSel)
				versionModeSel.addEventListener('change', (e) => {
					FILTERS.versionMode = e.target.value === 'min' ? 'min' : 'exact';
					if (FILTERS.version !== 'all') load(); // moot while "All versions" is selected
				});

			// Open a player's breakdown modal when their highlight card is clicked or
			// activated by keyboard. Delegated on #root, which persists across re-renders.
			const rootEl = document.getElementById('root');

			/* Delete a telemetry record.
			 *
			 * Optimistic on the row, honest on failure: the button disables and the
			 * row fades immediately so a click never feels ignored, but the row is
			 * only REMOVED once the server confirms, and a failure puts it back with
			 * the reason attached rather than leaving a gap that looks like success.
			 * No confirm dialog — these are regenerable counters, and the type of
			 * record that is expensive to lose (a player's save) is not reachable
			 * from this endpoint at all. */
			rootEl.addEventListener('click', async (e) => {
				const btn = e.target.closest && e.target.closest('.delbtn[data-del-id]');
				if (!btn || btn.disabled) return;
				const kind = btn.getAttribute('data-del-kind');
				const id = btn.getAttribute('data-del-id');
				const row = btn.closest('tr');
				btn.disabled = true;
				if (row) row.style.opacity = '0.45';
				try {
					const res = await fetch('../ClearProblem/', {
						...req(),
						method: 'POST',
						headers: { ...(req().headers || {}), 'content-type': 'application/json' },
						body: JSON.stringify({ kind, ids: [id] }),
					});
					const out = res.ok ? await res.json().catch(() => null) : null;
					if (!res.ok || !out || out.ok === false) {
						const why =
							(out && (out.error || (out.failed && out.failed[0] && out.failed[0].error))) ||
							`server returned ${res.status}`;
						throw new Error(why);
					}
					// Gone from the database, so drop it from the payload too — a
					// rerender from the cached data would otherwise bring it back and
					// read as the delete having silently failed.
					forgetProblem(kind, id);
					if (row) row.remove();
					syncProblemsButton();
				} catch (err) {
					btn.disabled = false;
					if (row) {
						row.style.opacity = '';
						row.title = `Could not delete: ${err.message || err}`;
					}
					btn.textContent = '!';
					setTimeout(() => {
						btn.textContent = '×';
					}, 2500);
				}
			});

			/* Which range object a picker drives. Keyed by the `data-range-scope`
			 * dayRangePicker() stamps on every control it builds, so a second chart is
			 * a new entry here and nothing else. An unrecognized scope is ignored
			 * rather than defaulting to the first one — silently moving the wrong
			 * chart is worse than doing nothing. */
			const DAY_RANGE_SCOPES = { daily: DAY_RANGE, landing: LANDING_DAY_RANGE };
			const rangeFor = (el) => DAY_RANGE_SCOPES[el && el.getAttribute('data-range-scope')] || null;

			// Date-range presets for the per-day charts. Redraws from the payload
			// already in hand — no refetch.
			rootEl.addEventListener('click', (e) => {
				const btn = e.target.closest && e.target.closest('.dbtn[data-range]');
				const range = rangeFor(btn);
				if (!range) return;
				range.preset = btn.getAttribute('data-range');
				range.from = '';
				range.to = '';
				rerender();
			});
			// The Problems range. Unlike the chart's picker this one REFETCHES, because
			// the windowing happens server-side over the per-day buckets.
			rootEl.addEventListener('click', (e) => {
				const btn = e.target.closest && e.target.closest('.dbtn[data-prange]');
				if (!btn) return;
				PROBLEM_RANGE.preset = btn.getAttribute('data-prange');
				PROBLEM_RANGE.from = '';
				PROBLEM_RANGE.to = '';
				load();
			});
			rootEl.addEventListener('change', (e) => {
				const el = e.target;
				if (!el || !el.hasAttribute) return;
				if (!el.hasAttribute('data-prange-from') && !el.hasAttribute('data-prange-to')) return;
				PROBLEM_RANGE.preset = 'custom';
				if (el.hasAttribute('data-prange-from')) PROBLEM_RANGE.from = el.value;
				if (el.hasAttribute('data-prange-to')) PROBLEM_RANGE.to = el.value;
				if (PROBLEM_RANGE.from && PROBLEM_RANGE.to && PROBLEM_RANGE.from > PROBLEM_RANGE.to) {
					const t = PROBLEM_RANGE.from;
					PROBLEM_RANGE.from = PROBLEM_RANGE.to;
					PROBLEM_RANGE.to = t;
				}
				load();
			});
			// Typing a date switches that control to a custom range. Handled on
			// 'change' so a half-typed year doesn't blank the chart mid-keystroke.
			// Scoped on data-range-scope, so the Problems picker's inputs — same
			// .dinput class, different state object — no longer fall through here.
			rootEl.addEventListener('change', (e) => {
				const el = e.target;
				if (!el || !el.hasAttribute) return;
				if (!el.hasAttribute('data-range-from') && !el.hasAttribute('data-range-to')) return;
				const scope = el.getAttribute('data-range-scope');
				const range = rangeFor(el);
				if (!range) return;
				const daily = (LAST_DATA && LAST_DATA.summary && LAST_DATA.summary.daily) || {};
				if (range.preset !== 'custom') {
					// Seed the other end from what is on screen, so changing one date
					// doesn't silently widen the range back to everything.
					const shown = scope === 'landing' ? visibleLandingDays() : visibleDays(daily);
					const fallbackFirst = scope === 'landing' ? '' : daily.firstDay || '';
					const fallbackLast = scope === 'landing' ? '' : daily.lastDay || '';
					range.from = shown.length ? shown[0].day : fallbackFirst;
					range.to = shown.length ? shown[shown.length - 1].day : fallbackLast;
					range.preset = 'custom';
				}
				if (el.hasAttribute('data-range-from')) range.from = el.value;
				if (el.hasAttribute('data-range-to')) range.to = el.value;
				// An inverted range is a slip, not an instruction — swap rather than
				// showing an empty chart.
				if (range.from && range.to && range.from > range.to) {
					const t = range.from;
					range.from = range.to;
					range.to = t;
				}
				rerender();
			});

			// Player highlights sort. Reorders the rows already in hand — no refetch,
			// and no change to which caretakers are shown. Back to page one: page 4 of
			// a freshly re-ranked list is an arbitrary place to be standing.
			rootEl.addEventListener('click', (e) => {
				const btn = e.target.closest && e.target.closest('.dbtn[data-hlsort]');
				if (!btn) return;
				const key = btn.getAttribute('data-hlsort');
				if (!HL_SORTS.some((o) => o.key === key) || HL_SORT.key === key) return;
				HL_SORT.key = key;
				HL_PAGE.index = 0;
				rerender();
			});

			/* Player highlights pager. Redraws from the rows in hand, then scrolls the
			 * section header back into view — without that, clicking "Next" at the
			 * bottom of a forty-card grid leaves you at the bottom of the NEXT forty
			 * with no sign anything happened.
			 *
			 * The section is looked up AFTER the rerender, not before: rerender()
			 * replaces #root's markup wholesale, so the element the click came from is
			 * detached by the time there is anything to scroll to. */
			rootEl.addEventListener('click', (e) => {
				const btn = e.target.closest && e.target.closest('.dbtn[data-hlpage]');
				if (!btn || btn.disabled) return;
				const next = Number(btn.getAttribute('data-hlpage'));
				if (!isFinite(next) || next < 0 || next === HL_PAGE.index) return;
				HL_PAGE.index = next;
				rerender();
				const grid = document.querySelector('.hlgrid');
				const section = grid && grid.closest('section');
				if (section) section.scrollIntoView({ block: 'start', behavior: 'smooth' });
			});

			rootEl.addEventListener('click', (e) => {
				const card = e.target.closest && e.target.closest('.hlcard[data-pid]');
				if (card) return openPlayerModal(card.getAttribute('data-pid'));
				const tile = e.target.closest && e.target.closest('.kpi-click[data-kpi="active-now"]');
				if (tile) openActiveNowModal();
			});
			rootEl.addEventListener('keydown', (e) => {
				if (e.key !== 'Enter' && e.key !== ' ') return;
				const card = e.target.closest && e.target.closest('.hlcard[data-pid]');
				if (card) {
					e.preventDefault();
					return openPlayerModal(card.getAttribute('data-pid'));
				}
				const tile = e.target.closest && e.target.closest('.kpi-click[data-kpi="active-now"]');
				if (tile) {
					e.preventDefault();
					openActiveNowModal();
				}
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') return closePlayerModal();
				if (e.key !== 'Enter' && e.key !== ' ') return;
				const row = e.target.closest && e.target.closest('.acrow[data-pid]');
				if (row) {
					e.preventDefault();
					openPlayerModal(row.getAttribute('data-pid'));
				}
			});

			// Sign out from the header. Delegated, because syncWhoami() rebuilds the
			// button whenever the signed-in identity changes.
			document.querySelector('header').addEventListener('click', (e) => {
				if (e.target && e.target.id === 'signout') signOut();
			});

			// expose for offline/unit rendering (jsdom smoke test)
			window.__renderDashboard = render;
			window.__openPlayerModal = openPlayerModal;
			window.__openActiveNowModal = openActiveNowModal;
			// Pick up an existing session before deciding what to show — a refresh
			// mid-investigation should land back on the numbers, not on a login form.
			/* Start concealed. loadAuth() may restore a session a moment later, but
			 * until it does the page must not show what it is — a flash of the real
			 * header is the same disclosure, just briefer. */
			document.body.classList.add('signed-out');
			loadAuth();
			syncWhoami();
			if (!window.__NO_AUTOLOAD) load();
		</script>
	</body>
</html>
