						}${mc.at ? ` · ${mc.exact ? '' : '~'}${new Date(mc.at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : ''}</span>`
					: '';
				return (
					`<button class="modal-close" data-close aria-label="Close">×</button>` +
					`<div class="modal-head"><div class="mav">${avatarSVG(p.appearance)}</div><div><h2>${esc(p.name || 'Unnamed')}</h2>` +
					`<div class="msub"><span class="hledi ${edi}">${edi}</span>${mconv}${p.idle ? `<span class="hlidle" title="Over ${n(p.playMinutes)} minutes at ${n(p.actionsPerMinute)} actions/min — counted as a window left open, not play">idle window</span>` : ''}${meta ? `<span>${meta}</span>` : ''}${when ? `<span>${when}</span>` : ''}</div></div></div>` +
					kpis +
					`<div class="grid two" style="margin-top:.8rem">${progress}${checklist}</div>` +
					`<div style="margin-top:.8rem">${actionsCard}</div>` +
					// Where the time went, side by side: the world on the left, the
					// menus on the right. They overlap rather than partition, which is
					// why the menu card names its own share of play time.
					(areaCard || menuCard
						? `<div class="grid two" style="margin-top:.8rem">${areaCard}${menuCard}</div>`
						: '') +
					(recCard ? `<div style="margin-top:.8rem">${recCard}</div>` : '') +
					(prefsCard
						? `<div class="grid two" style="margin-top:.8rem">${onboard}${prefsCard}</div>`
						: `<div style="margin-top:.8rem">${onboard}</div>`) +
					dangerZoneHTML(p)
				);
			}

			/** The remove control at the foot of the modal — super-users only.
			 *
			 * Hiding it from metrics_reader is cosmetic; /DeleteSoloMetrics/ refuses
			 * that role outright. This is the half of the gate you can see.
			 *
			 * The copy spells out all three things an operator would otherwise have to
			 * find out by doing it: the page's numbers move, the player's save is not
			 * touched, and a save still in use will uplink itself back. */
			function dangerZoneHTML(p) {
				if (!AUTH || !AUTH.superUser) return '';
				return (
					`<div class="dangerzone">` +
					`<div><b>Remove this caretaker</b>` +
					`<p>Deletes their row from <code>solo_metrics</code>, and every number on this page recomputes without them. ` +
					`Their save is not touched — it lives on their own device. ` +
					`If that save is still being played, its next sync uplinks a new row and they reappear without their history.</p></div>` +
					`<button class="dangerbtn" data-del-player="${esc(p.playerId)}">Remove</button>` +
					`</div>`
				);
			}

			/** Open the modal for a player id (looked up from the last render). */
			/** The one overlay both modals live in — built on first use, reused after. */
			function showModal(html) {
				if (!modalEl) {
					modalEl = document.createElement('div');
					modalEl.className = 'modal-overlay';
					modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true"></div>`;
					document.body.appendChild(modalEl);
					modalEl.addEventListener('click', (e) => {
						if (e.target === modalEl || (e.target.closest && e.target.closest('[data-close]'))) closePlayerModal();
					});
					modalEl.addEventListener('click', onRemoveCaretaker);
					// A row in the who's-playing list opens that caretaker's full breakdown,
					// in the same overlay — the list is a way in, not a dead end.
					modalEl.addEventListener('click', (e) => {
						const row = e.target.closest && e.target.closest('.acrow[data-pid]');
						if (row) openPlayerModal(row.getAttribute('data-pid'));
					});
				}
				modalEl.querySelector('.modal').innerHTML = html;
				modalEl.querySelector('.modal').scrollTop = 0;
				modalEl.style.display = 'flex';
				document.body.classList.add('modal-open');
			}

			function openPlayerModal(pid) {
				const p = PLAYERS_BY_ID[pid];
				if (!p) return;
				showModal(playerModalHTML(p));
			}

			/** Everyone playing right now, and where they came from.
			 *
			 * The KPI answers "how many"; this answers the two questions that always
			 * follow — WHO, and through which door. Channel is the point: three people
			 * on itch and three on wildwillows.app are the same number and completely
			 * different news. Same 5-minute window as the KPI and the wall's live
			 * badge, read from the same rows, so the three can never disagree. */
			function activeNowModalHTML() {
				const players = (LAST_DATA && LAST_DATA.players) || [];
				const live = players
					.filter((p) => p.minutesSinceActive != null && n(p.minutesSinceActive) <= 5)
					.sort((a, b) => n(a.minutesSinceActive) - n(b.minutesSinceActive));

				const since = (m) => (n(m) < 1 ? 'just now' : `${Math.round(n(m))} min ago`);
				const rows = live
					.map((p) => {
						const chan = CHANNEL_LABELS[p.channel || 'unknown'] || p.channel || 'Unknown';
						const edi = p.edition === 'demo' ? 'demo' : 'full';
						const plat = p.platform === 'desktop' ? 'Desktop app' : 'Browser';
						const area = p.currentArea || '';
						const where = area ? AREA_LABELS[area] || (area.startsWith('tent-') ? 'a trail tent' : area) : null;
						const bits = [
							`<span class="acchan">${esc(chan)}</span>`,
							`<span class="hledi ${edi}">${edi}</span>`,
							`<span class="actag">${esc(plat)}</span>`,
							p.os ? `<span class="actag">${esc(OS_LABELS[p.os] || p.os)}</span>` : '',
							p.version ? `<span class="actag">v${esc(p.version)}</span>` : '',
						]
							.filter(Boolean)
							.join('');
						const stats = [
							where ? `in ${esc(where)}` : '',
							`${fmtDur(p.playSeconds)} played`,
							`${fmt(p.sessions)} ${n(p.sessions) === 1 ? 'session' : 'sessions'}`,
							since(p.minutesSinceActive),
						]
							.filter(Boolean)
							.join(' · ');
						return (
							`<div class="acrow" data-pid="${esc(p.playerId || '')}" role="button" tabindex="0" title="Click for the full breakdown">` +
							`<div class="acav">${avatarSVG(p.appearance)}</div>` +
							`<div class="acbody"><div class="acname">${esc(p.name || 'Unnamed')}</div>` +
							`<div class="actags">${bits}</div>` +
							`<div class="acmeta">${esc(stats)}</div></div></div>`
						);
					})
					.join('');

				// Where they came from, as a tally — the shape of who is on right now,
				// which is the thing worth glancing at before reading any single row.
				const tally = {};
				for (const p of live) {
					const k = p.channel || 'unknown';
					tally[k] = (tally[k] || 0) + 1;
				}
				const chips = Object.entries(tally)
					.sort((a, b) => b[1] - a[1])
					.map(([k, v]) => `<span class="acchip">${esc(CHANNEL_LABELS[k] || k)} · ${fmt(v)}</span>`)
					.join('');

				return (
					`<button class="modal-close" data-close aria-label="Close">×</button>` +
					`<div class="modal-head"><div><h2>Playing right now</h2>` +
					`<div class="msub">${fmt(live.length)} ${live.length === 1 ? 'caretaker' : 'caretakers'} seen in the last 5 minutes</div></div></div>` +
					(chips ? `<div class="acchips">${chips}</div>` : '') +
					(rows || `<div class="emptynote">Nobody is playing at this exact moment.</div>`)
				);
			}

			function openActiveNowModal() {
				showModal(activeNowModalHTML());
			}
			function closePlayerModal() {
				if (modalEl) modalEl.style.display = 'none';
				document.body.classList.remove('modal-open');
			}

			/* Remove a caretaker's telemetry row.
			 *
			 * TWO CLICKS, unlike the problem-row deletes. Those have no confirm on
			 * purpose — they clear regenerable counters, and the comment there is
			 * explicit that "the type of record that is expensive to lose (a player's
			 * save) is not reachable from this endpoint at all". This one IS expensive
			 * to lose: it is the only copy of that caretaker's history and there is no
			 * undo. So the second click has to be a decision, and the button disarms
			 * itself after a few seconds rather than staying hot for a stray click.
			 *
			 * Not a confirm() — a native modal on top of this one steals focus from a
			 * dialog that is already modal, and the wording matters more than a browser
			 * will let us phrase it. */
			async function onRemoveCaretaker(e) {
				const btn = e.target.closest && e.target.closest('.dangerbtn[data-del-player]');
				if (!btn || btn.disabled) return;
				const id = btn.getAttribute('data-del-player');

				if (btn.getAttribute('data-armed') !== '1') {
					btn.setAttribute('data-armed', '1');
					btn.textContent = 'Really remove? There is no undo';
					clearTimeout(btn.__armTimer);
					btn.__armTimer = setTimeout(() => {
						btn.removeAttribute('data-armed');
						btn.textContent = 'Remove';
					}, 5000);
					return;
				}

				clearTimeout(btn.__armTimer);
				btn.disabled = true;
				btn.textContent = 'Removing…';
				try {
					const res = await fetch('../DeleteSoloMetrics/', {
						...req(),
						method: 'POST',
						headers: { ...(req().headers || {}), 'content-type': 'application/json' },
						body: JSON.stringify({ ids: [id] }),
					});
					const out = res.ok ? await res.json().catch(() => null) : null;
					if (!res.ok || !out || out.ok === false) {
						/* 403 here means the account reads the dashboard but is not a
						 * super-user — worth saying, because the button being visible at
						 * all in that case would be a bug and the message is how you'd
						 * notice. */
						const why =
							(out && (out.error || (out.failed && out.failed[0] && out.failed[0].error))) ||
							(res.status === 403
								? 'this account can read the dashboard but not remove records'
								: `server returned ${res.status}`);
						throw new Error(why);
					}
					/* out.deleted === 0 with the id in out.missing means it was already
					 * gone — someone else's tab, or a double submit. That is the outcome
					 * asked for, so it is not an error; fall through and refresh. */
					delete PLAYERS_BY_ID[id];
					closePlayerModal();
					/* Refetch rather than patch the payload in place. forgetProblem() can
					 * subtract a counter locally because it feeds one panel; a caretaker
					 * feeds the head count, the conversion funnel, every average and every
					 * distribution on this page. Redoing that arithmetic in the browser is
					 * drift waiting to happen, and the server already invalidated its
					 * roll-up cache, so one reload is both cheaper and truthful. */
					load();
				} catch (err) {
					btn.disabled = false;
					btn.removeAttribute('data-armed');
					btn.textContent = `Could not remove — ${err.message || err}`;
					setTimeout(() => {
						btn.textContent = 'Remove';
					}, 4500);
				}
			}

			/* ------------------------------------------------------------------ *
			 * Main render
			 * ------------------------------------------------------------------ */
			/* The Problems range.
			 *
			 * Unlike the per-day chart's picker, this one goes to the SERVER, because
			 * the filtering it does is impossible in the browser: a refusal row is a
			 * running total with a single lastSeenAt, so "412 refusals" carries no
			 * dates to slice. Only the server's per-day buckets can answer it, and
			 * those only exist from the day they shipped — which is why every count
			 * comes back in two forms and the panel shows both. */
			const PROBLEM_RANGE = { preset: 'all', from: '', to: '' };
			const PROBLEM_PRESETS = [
				{ key: '1', label: '24h' },
				{ key: '7', label: '7d' },
				{ key: '30', label: '30d' },
				{ key: 'all', label: 'All time' },
			];
			const isoDay = (d) => new Date(d).toISOString().slice(0, 10);
			function problemsRange() {
				if (PROBLEM_RANGE.preset === 'all') return null;
				if (PROBLEM_RANGE.preset === 'custom') {
					if (!PROBLEM_RANGE.from && !PROBLEM_RANGE.to) return null;
					return { from: PROBLEM_RANGE.from, to: PROBLEM_RANGE.to };
				}
				const days = Number(PROBLEM_RANGE.preset);
				return { from: isoDay(Date.now() - (days - 1) * 86400000), to: isoDay(Date.now()) };
			}
			function problemsQuery() {
				const r = problemsRange();
				if (!r) return '';
				const p = [];
				if (r.from) p.push('from=' + encodeURIComponent(r.from));
				if (r.to) p.push('to=' + encodeURIComponent(r.to));
				return p.length ? '?' + p.join('&') : '';
			}

			/* Which of the three views is on screen: the metrics, what is going
			 * wrong, or how Harper itself is doing. Remembered across reloads — if you
			 * opened one because you were chasing something, a refresh mid-chase
			 * shouldn't drop you back to the front page.
			 *
			 * One variable, not a boolean per panel: the views are mutually exclusive,
			 * and two independent flags can represent states that are not supposed to
			 * exist (both on, both off after a partial write). */
			const MODE_KEY = 'ww-dashboard-mode';
			const MODES = ['dashboard', 'problems', 'server'];
			let MODE = 'dashboard';
			try {
				const saved = localStorage.getItem(MODE_KEY);
				if (MODES.includes(saved)) MODE = saved;
				// Migrate the old boolean so an open Problems view survives the upgrade.
				else if (localStorage.getItem('ww-dashboard-show-problems') === '1') MODE = 'problems';
			} catch {
				/* private mode — default to the dashboard */
			}
			function setMode(next) {
				MODE = MODES.includes(next) ? next : 'dashboard';
				try {
					localStorage.setItem(MODE_KEY, MODE);
				} catch {
					/* private mode — the switch still works for this session */
				}
			}

			/* What the badge counts.
			 *
			 * Deliberately NOT refusals. A refusal is the server saying "not enough
			 * materials" — that is the game working, and every player generates them,
			 * so a lifetime refusal count would sit in the thousands and mean nothing.
			 * Badging it would train you to ignore the badge, which is the one failure
			 * mode a hidden panel cannot survive.
			 *
			 * Crashes and records that will not decode are different: neither should
			 * ever happen, so any number above zero is worth the walk. */
			function problemCount() {
				const crashes = (GAMEPLAYHEALTH && GAMEPLAYHEALTH.clientErrors && GAMEPLAYHEALTH.clientErrors.total) || 0;
				const badSaves = (SAVEHEALTH && SAVEHEALTH.affected) || 0;
				return { crashes: n(crashes), badSaves: n(badSaves), total: n(crashes) + n(badSaves) };
			}

			/* Is Harper itself in trouble? Separate from problemCount(), which counts
			 * things PLAYERS hit. A server at its thread ceiling with a rising 5xx rate
			 * is a different emergency from a crash in the journal panel, and collapsing
			 * them into one badge would let either hide the other. */
			function serverTrouble() {
				const h = SERVERHEALTH;
				if (!h) return null;
				if (!h.readable) return 'telemetry unreadable';
				const bits = [];
				if (n(h.http && h.http.serverErrors) > 0) return `${fmt(h.http.serverErrors)} server errors`;
				const u = h.threads && h.threads.utilizationPct;
				if (u != null && u >= 85) bits.push(`threads at ${pct(u)}`);
				const st = h.storage || {};
				if (st.databaseBytes && st.volumeBytes && st.databaseBytes / st.volumeBytes >= 0.85)
					bits.push('storage nearly full');
				return bits.length ? bits.join(' · ') : null;
			}

			function syncProblemsButton() {
				const btn = document.getElementById('problems');
				const label = document.getElementById('problems-label');
				if (btn && label) {
					// Nothing to show at all (endpoints unavailable) — hide the control
					// rather than offer a button that opens an empty page.
					const havePanels = !!(GAMEPLAYHEALTH || SAVEHEALTH);
					btn.hidden = !havePanels;
					if (havePanels) {
						const p = problemCount();
						const bits = [];
						if (p.crashes) bits.push(`${fmt(p.crashes)} ${p.crashes === 1 ? 'crash' : 'crashes'}`);
						if (p.badSaves) bits.push(`${fmt(p.badSaves)} unreadable ${p.badSaves === 1 ? 'save' : 'saves'}`);
						label.innerHTML = 'Problems' + (p.total ? `<span class="pbadge">${fmt(p.total)}</span>` : '');
						btn.title = p.total
							? bits.join(' · ') + ' — plus every refusal the server has given'
							: 'No crashes or unreadable saves. Click for refusals and the full breakdown.';
						btn.classList.toggle('on', MODE === 'problems');
						btn.classList.toggle('bad', p.total > 0);
						btn.setAttribute('aria-pressed', MODE === 'problems' ? 'true' : 'false');
					}
				}

				const sbtn = document.getElementById('serverbtn');
				const slabel = document.getElementById('serverbtn-label');
				if (sbtn && slabel) {
					sbtn.hidden = !SERVERHEALTH;
					if (SERVERHEALTH) {
						const trouble = serverTrouble();
						slabel.innerHTML = 'Server' + (trouble ? `<span class="pbadge">!</span>` : '');
						sbtn.title = trouble ? `Harper: ${trouble}` : "Harper's own telemetry — threads, storage, responses, replication.";
						sbtn.classList.toggle('on', MODE === 'server');
						sbtn.classList.toggle('bad', !!trouble);
						sbtn.setAttribute('aria-pressed', MODE === 'server' ? 'true' : 'false');
					}
				}

				// One way back, shown only when you are not already home. Labeling a
				// mode switch by what it conceals leaves you hunting for the way out.
				const back = document.getElementById('backbtn');
				if (back) back.hidden = MODE === 'dashboard';
			}

			/* The last payload, kept so the date picker can redraw without refetching.
			 * The range only scopes a chart the server already sent in full, so a
			 * round-trip per click would be latency for nothing. */
			let LAST_DATA = null;
			function rerender() {
				if (LAST_DATA) render(LAST_DATA);
			}

			function render(data) {
				LAST_DATA = data;
				const s = (data && data.summary) || {};
				const players = (data && data.players) || [];
				const A = s.audience || {},
					E = s.engagement || {},
					R = s.retention || {},
					P = s.progression || {};
				const flt = (data && data.filters) || {};
				const out = [];

				/* ---- Overview KPIs ---- */
				const versionLabel = flt.version ? `v${flt.version}${flt.versionMode === 'min' ? ' & newer' : ''}` : '';
				const activeFilters = [versionLabel, flt.edition, flt.platform].filter(Boolean).map(esc);
				const overviewSub = activeFilters.length
					? `filtered to ${activeFilters.join(' · ')}`
					: 'who is out there right now';
				out.push(
					sec(
						'Overview',
						overviewSub,
						`<div class="grid kpis kpis-6">${[
							kpi(fmt(s.players), 'Total caretakers', 'unique anonymous saves'),
							kpi(
								`<span class="accent">${fmt(A.activeNow)}</span>`,
								'Active now',
								n(A.activeNow) > 0 ? 'seen in the last 5 minutes · click for who' : 'seen in the last 5 minutes',
								n(A.activeNow) > 0 ? 'active-now' : null,
							),
							kpi(fmt(A.activeLast24h), 'Active · 24h'),
							kpi(fmt(A.activeLast7d), 'Active · 7d'),
							kpi(fmt(A.activeLast14d), 'Active · 14d'),
							kpi(fmt(A.newLast24h), 'New · 24h', `${fmt(A.newLast7d)} in the last 7 days`),
						].join('')}</div>`,
					),
				);

				/* ---- New caretakers per day ----
				 * Directly under Overview: same audience question with a time axis, and
				 * the 24h / 7d tiles above are two points on this line. */
				const dailySection = dailyHTML(s);
				if (dailySection) out.push(dailySection);

				/* ---- What is going wrong ----
				 * Everything else on this page counts what players DID. That leaves a whole
				 * class of problem invisible: a recipe gated on the wrong biome refuses
				 * everyone who finds it and every activity counter still looks healthy,
				 * because a refusal isn't an activity. A crash in the interface is worse —
				 * it produces no events at all, and the player just closes the game.
				 *
				 * Refusals are keyed by message key rather than message text, so one problem
				 * doesn't split across languages. */
				let healthSection = '';
				// Renders whenever the endpoint answers, including at zero — unlike Save
				// health below, which stays quiet because an unreadable save is genuinely
				// exceptional. Refusals are not: any player who runs short of materials
				// makes one, so a count of zero here almost certainly means the panel
				// isn't wired up rather than that nothing has gone wrong. Hiding it made
				// those two states look identical, and left no way to tell a healthy
				// instance from an endpoint that never deployed.
				if (GAMEPLAYHEALTH) {
					const gh = GAMEPLAYHEALTH;
					const ref = gh.refusals || {};
					const cli = gh.clientErrors || {};
					// The key's last segment reads well enough on its own ("notEnough",
					// "recipeLocked") and the full path is noise in a bar chart.
					const shortCode = (c) => String(c).split('.').pop();
					const win = gh.window || null;
					const day = (ms) =>
						ms ? new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
					/* In a window, the count column shows what happened IN it, with the
					 * all-time figure kept beside it in gray. A row whose buckets predate
					 * the per-day counters reads "—" rather than 0: there is no evidence
					 * either way, and printing a zero would be inventing some. */
					const hits = (r) => {
						if (!win) return fmt(r.count);
						if (r.windowCount === null || r.windowCount === undefined)
							return `<span title="This row predates the per-day counters, so its history in this range is unknown.">—</span> <span class="alltime">${fmt(r.count)} all-time</span>`;
						return `${fmt(r.windowCount)} <span class="alltime">${fmt(r.count)} all-time</span>`;
					};
					/* A row can be cleared from the database. Only these two tables are
					 * clearable — see /ClearProblem/, which resolves `kind` against two
					 * hard-coded names and never uses the id to pick a table. A refusal
					 * that has been fixed, or a crash from a build nobody runs any more,
					 * otherwise sits in the counter forever and slowly trains you to
					 * stop reading the page. No confirmation on these: the rows are
					 * regenerable counters, and a real one comes straight back. */
					const del = (kind, id, what) =>
						id
							? `<td class="num"><button type="button" class="delbtn" data-del-kind="${kind}" data-del-id="${esc(id)}" ` +
								`title="Delete this record from the database" aria-label="Delete ${esc(what)}">×</button></td>`
							: `<td class="num"></td>`;
					const refusalRows = (ref.top || [])
						.map(
							(r) =>
								`<tr><td><code>${esc(shortCode(r.code))}</code></td><td class="num">${hits(r)}</td>` +
								`<td class="num">${r.status || '—'}</td>` +
								`<td class="num">${day(r.lastSeenAt)}</td>` +
								del('refusal', r.id, shortCode(r.code)) +
								`</tr>`,
						)
						.join('');
					const crashRows = (cli.top || [])
						.map(
							(e) =>
								`<tr><td>${esc(e.message)}</td><td><code>${esc(e.where || '?')}</code></td>` +
								`<td class="num">${hits(e)}</td>` +
								`<td class="num">${day(e.lastSeenAt)}</td>` +
								del('crash', e.id, e.message) +
								`</tr>`,
						)
						.join('');
					const picker =
						`<div class="dpick">` +
						PROBLEM_PRESETS.map(
							(p) =>
								`<button type="button" class="dbtn${PROBLEM_RANGE.preset === p.key ? ' on' : ''}" data-prange="${p.key}">${p.label}</button>`,
						).join('') +
						`<span class="dsep"></span>` +
						`<label>From <input type="date" class="dinput" data-prange-from value="${esc(PROBLEM_RANGE.from)}"></label>` +
						`<label>To <input type="date" class="dinput" data-prange-to value="${esc(PROBLEM_RANGE.to)}"></label>` +
						`</div>`;
					const kpiCrash = win && cli.windowTotal != null ? cli.windowTotal : cli.total;
					const kpiRef = win && ref.windowTotal != null ? ref.windowTotal : ref.total;
					healthSection = sec(
						'What is going wrong',
						win
							? `${esc(win.from || 'the beginning')} → ${esc(win.to || 'today')} · refusals and interface crashes`
							: 'refusals and interface crashes — counts and message keys only',
						picker +
							`<div class="grid kpis">${[
								kpi(
									`<span class="accent">${fmt(kpiCrash)}</span>`,
									'Interface crashes',
									`${fmt(cli.distinct)} distinct${win ? ' in range' : ''}`,
								),
								kpi(fmt(kpiRef), 'Refusals', `${fmt(ref.distinct)} distinct reasons`),
								kpi(fmt(ref.serverFaults), 'Server faults', '5xx — the game falling over, not saying no'),
							].join('')}</div>` +
							/* The counters only exist from the day they shipped, so a range
							 * reaching further back covers less than it looks like it does.
							 * Said on the page, because a quiet chart and a chart with no data
							 * are indistinguishable otherwise. */
							(win
								? `<p class="emptynote">Per-day counting began ${win.earliestBucket ? `on ${esc(win.earliestBucket)}` : 'recently'} — ` +
									`this range covers ${fmt(win.daysWithData)} ${win.daysWithData === 1 ? 'day' : 'days'} with data. ` +
									`Rows older than that show <b>—</b> and keep only their all-time total. Server faults are always all-time.</p>`
								: '') +
							(refusalRows
								? `<div class="card" style="margin-top:.8rem"><h3>Most refused<span class="tag">what players are being turned away from</span></h3>` +
									`<table class="tbl"><thead><tr><th>Reason</th><th class="num">Hits</th><th class="num">Status</th><th class="num">Last seen</th><th class="num"><span class="vh">Clear</span></th></tr></thead><tbody>${refusalRows}</tbody></table></div>`
								: '') +
							(crashRows
								? `<div class="card" style="margin-top:.8rem"><h3>Crashes<span class="tag">top 25 by count</span></h3>` +
									`<table class="tbl"><thead><tr><th>Message</th><th>Where</th><th class="num">Hits</th><th class="num">Last seen</th><th class="num"><span class="vh">Clear</span></th></tr></thead><tbody>${crashRows}</tbody></table></div>`
								: '') +
							(!refusalRows && !crashRows
								? `<div class="card" style="margin-top:.8rem"><h3>Nothing recorded yet<span class="tag">the panel is live</span></h3>` +
									`<p class="emptynote">No refusals or crashes have been reported since this instance started collecting. ` +
									`Refusals are ordinary — a player short on materials makes one — so if this stays empty during real play, ` +
									`check that the <code>Refusal</code> and <code>ClientError</code> tables exist.</p></div>`
								: ''),
										'problems',
					);
				}

				/* ---- Save health ----
				 * Records that would not decode, from GET /SaveHealth/. Sits directly above
				 * the player highlights: an unreadable save is the only thing on this page a
				 * player feels directly, and it used to be visible only to someone tailing
				 * server logs. Renders nothing at zero, so a healthy instance stays quiet. */
				let saveSection = '';
				if (SAVEHEALTH && SAVEHEALTH.affected > 0) {
					const sh = SAVEHEALTH;
					const KIND_LABELS = { unreadable: 'Could not decode at all', refused: 'Partial — salvage refused' };
					const rows = (sh.recent || [])
						.map(
							(r) =>
								`<tr><td><code>${esc(r.table || '?')}</code></td><td><code>${esc(r.recordId || '?')}</code></td>` +
								`<td>${esc(KIND_LABELS[r.kind] || r.kind || '?')}</td><td class="num">${fmt(r.count)}</td>` +
								`<td class="num">${r.lastSeenAt ? new Date(r.lastSeenAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'}</td></tr>`,
						)
						.join('');
					saveSection = sec(
						'Save health',
						'stored records that could not be read — ids and counts only',
						`<div class="grid kpis">${[
							kpi(
								`<span class="accent">${fmt(sh.savesAffected)}</span>`,
								'Saves affected',
								'player rows that would not open',
							),
							kpi(fmt(sh.affected), 'Records affected', 'across every table'),
							kpi(fmt(sh.events), 'Read failures', 'total attempts that hit a bad record'),
						].join('')}</div><div class="grid two" style="margin-top:.8rem">` +
							cardTitled('By table', 'which data is rotting', barRows(objToEntries(sh.byTable), { cls: 'gold' })) +
							cardTitled(
								'By kind',
								'how it failed',
								barRows(objToEntries(sh.byKind), { labelMap: KIND_LABELS, cls: 'gold' }),
							) +
							`</div>` +
							(rows
								? `<div class="card" style="margin-top:.8rem"><h3>Most recent<span class="tag">last 25</span></h3>` +
									`<table class="tbl"><thead><tr><th>Table</th><th>Record</th><th>Failure</th><th class="num">Hits</th><th class="num">Last seen</th></tr></thead><tbody>${rows}</tbody></table></div>`
								: ''),
										'problems',
					);
				}

				/* ---- Landing page (site traffic) ----
				 * Fed by the GET /LandingStats/ rollup — visits, first-time visitors,
				 * outbound link clicks and classroom-PDF downloads. Counts only; the
				 * mailing list that used to contribute a signups series here is gone,
				 * table and all. Loaded best-effort alongside /Metrics/; the section
				 * simply doesn't render if the endpoint isn't deployed yet. Unaffected
				 * by the version/edition filters — these are site numbers, not game
				 * numbers.
				 *
				 * Built here (it needs `LANDING`) and pushed under Engagement — see the
				 * push a little further down. */

				/* ---- Classroom (the coding kit) ----
				 * Fed by GET /LessonStats/. Anonymous counters only — see the contract
				 * note on LessonEvent in server/resources.ts. Same best-effort loading
				 * as the landing section: if the endpoint isn't deployed, the section
				 * simply doesn't render.
				 *
				 * The FUNNEL leads, because it is the only number here that tells you
				 * what to do next. Everything else is context for it: the errors are a
				 * work queue for explanation copy, the ideas say which prompts students
				 * actually pick, and the health strip is the only way to find out that
				 * a school network is silently blocking the API. */
				/* EDUCATION IS TWO KITS, NOT ONE SECTION.
				 *
				 * These used to be a single "Classroom" block, which put a grades-5-8
				 * ecology activity and a grades-9-12 web-development course under one
				 * heading and one funnel. They share a hub and nothing else: different
				 * ages, different subjects, different teachers, and completely
				 * different shapes of evidence. The science kit is measured by pages
				 * read and PDFs taken away, because the activity happens in the game
				 * and on paper; the coding kit is measured by what students did in the
				 * editor, because all of it happens on this site.
				 *
				 * Averaging those together produced numbers that described neither. */
				let codingSection = '';
				/* Set inside the two payload blocks below and read by the science
				   section, which is assembled last because it needs both. */
				let reachById = {};
				let kitSplit = null;
				let pdfDownloads = null;
				let pdfToday = 0;
				let schoolCopies = 0;
				if (CLASSROOM && CLASSROOM.totals) {
					const C = CLASSROOM.totals;
					const cN = (k) => n(C[k]) || 0;

					/* Drop-off, expressed against the step before it rather than the top.
					 * "Half the people who opened the builder ran their code" is a
					 * sentence you can act on; "6% of hub visitors downloaded" is not. */
					const funnelRows = (CLASSROOM.funnel || []).map((f, i, all) => {
						const prev = i ? n(all[i - 1].n) : 0;
						const drop = i && prev ? Math.round((n(f.n) / prev) * 100) : null;
						return [f.label + (drop != null ? ` (${drop}% of previous)` : ''), n(f.n)];
					});

					const ERROR_LABELS = {
						'fetch-failed': 'Could not reach the data',
						'null-property': 'Element not on the page',
						'undefined-property': 'Field not in the data',
						'not-defined': 'Name not recognized',
						'not-a-function': 'Not something you can call',
						'unexpected-eof': 'Something left open',
						'json-parse': 'Answer was not JSON',
						'await-async': 'await outside async',
						'const-assign': 'Reassigned a const',
						'not-iterable': 'Not a list',
						'object-object': 'Rendered [object Object]',
						'undefined-text': 'Rendered "undefined"',
						masked: 'Browser hid the reason',
						syntax: 'Other syntax mistake',
						other: 'Unclassified',
					};

					const DURATIONS = [
						['Under 5 min', 'duration_lt5m'],
						['5–15 min', 'duration_5to15m'],
						['15–30 min', 'duration_15to30m'],
						['30–60 min', 'duration_30to60m'],
						['Over an hour', 'duration_gt60m'],
					];
					const durationRows = DURATIONS.map(([label, key]) => [label, cN(key)]).filter((r) => r[1]);
					const sessions = n(CLASSROOM.sessions) || 0;
					/* A midpoint estimate, labeled as one. The buckets are deliberate —
					 * a precise per-session duration is a behavioral trace of one person
					 * — so this is the honest way to answer "roughly how long?" from them. */
					const MIDPOINT = { duration_lt5m: 2.5, duration_5to15m: 10, duration_15to30m: 22, duration_30to60m: 45, duration_gt60m: 75 };
					const bucketed = DURATIONS.reduce((a, [, k]) => a + cN(k), 0);
					const typicalMin = bucketed ? Math.round(DURATIONS.reduce((a, [, k]) => a + cN(k) * MIDPOINT[k], 0) / bucketed) : 0;
					const longSessions = cN('duration_30to60m') + cN('duration_gt60m');

					/* TIME IN THE LESSON, which is a different question from time in the
					 * builder and was not being asked at all.
					 *
					 * The builder is a workshop you sit down at; the lesson is ten chapters
					 * somebody has to get through inside a period, and "does it fit in
					 * forty-five minutes" is the thing a teacher decides on. The server
					 * bands it and hands over the midpoints it used, so the estimate here
					 * is not a second, quietly different piece of arithmetic. */
					const LT = (CLASSROOM.time && CLASSROOM.time.session) || { buckets: [], n: 0, meanMinutes: null };
					const lessonTimeRows = (LT.buckets || []).filter((b) => n(b.n)).map((b) => [b.label, n(b.n)]);
					const lessonTypical = LT.meanMinutes == null ? null : Math.round(LT.meanMinutes);
					const lessonFullPeriod = (LT.buckets || [])
						.filter((b) => b.id === '30to60m' || b.id === 'gt60m')
						.reduce((a, b) => a + n(b.n), 0);

					/* WHERE THAT TIME WENT, per chapter, ranked by how long people stay.
					 *
					 * Collected since the lesson was written and never once displayed. It
					 * is the only counter that can say a chapter is too long — a chapter
					 * that everybody reaches and nobody lingers in was skimmed, and one
					 * that eats ten minutes is either the best thing on the page or the
					 * place the period runs out. */
					const chapterTime = ((CLASSROOM.time && CLASSROOM.time.chapters) || []).filter((c) => n(c.n) > 0);
					const chapterTimeRows = chapterTime
						.map((c) => [`Ch ${c.chapter}`, c.meanMinutes == null ? 0 : Math.round(c.meanMinutes * 10) / 10])
						.filter((r) => r[1] > 0);
					const stickiest = chapterTime.slice().sort((a, b) => (b.meanMinutes || 0) - (a.meanMinutes || 0))[0];

					/* `unique` is null for a page that does not report first-visits yet,
					   and that is not the same as zero: one means "nobody new", the other
					   means "not measured". The row shows nothing rather than a 0. */
					for (const r of CLASSROOM.reach || []) reachById[r.id] = r;
					kitSplit = { science: cN('nav_science'), coding: cN('nav_coding') };

					/* The coding kit's own pages. The science page and the teachers hub
					   are deliberately not here: one belongs to the other kit, and the
					   hub belongs to both, so it is reported with the site rather than
					   claimed by either. */
					const CODING_PAGES = ['coding', 'learn', 'lesson', 'builder', 'developers'];
					const reachRows = (CLASSROOM.reach || [])
						.filter((r) => CODING_PAGES.includes(r.id) && n(r.views) > 0)
						.sort((a, b) => n(b.views) - n(a.views))
						.map((r) => [r.label, n(r.views), r.unique == null ? null : n(r.unique), r.path]);
					const reachMax = Math.max(...reachRows.map((r) => r[1]), 1);

					const ARRIVAL_LABELS = {
						direct: 'Typed it or had it bookmarked',
						search: 'A search engine',
						social: 'Reddit, Bluesky or another social site',
						internal: 'Another page on this site',
						other: 'Somewhere else',
					};
					const arrivalRows = (CLASSROOM.arrivals || []).map((a) => [ARRIVAL_LABELS[a.key] || a.key, a.n]);

					const h = CLASSROOM.health || {};
					const fetchTotal = n(h.fetchOk) + n(h.fetchFailed);
					const blockedPct = fetchTotal ? Math.round((n(h.fetchFailed) / fetchTotal) * 100) : 0;

					codingSection = sec(
						'Coding kit',
						'/learn and /developers — intro to APIs & web development, grades 9-12',
						`<div class="grid kpis">${[
							kpi(fmt(sessions), 'Builder sessions', `${fmt(cN('returning_day2') + cN('returning_day3'))} came back another day`),
							kpi(
								`<span class="accent">${typicalMin ? typicalMin + 'm' : '—'}</span>`,
								'Typical time in the builder',
								`${fmt(longSessions)} ${longSessions === 1 ? 'session' : 'sessions'} over half an hour`,
							),
							kpi(
								`<span class="accent">${lessonTypical ? lessonTypical + 'm' : '—'}</span>`,
								'Typical time in the lesson',
								LT.n
									? `${fmt(lessonFullPeriod)} of ${fmt(LT.n)} ${LT.n === 1 ? 'visit' : 'visits'} ran half an hour or more`
									: 'no visits measured yet',
							),
							kpi(fmt(cN('first_fetch_ok')), 'Reached real data', 'students whose own fetch worked'),
							kpi(
								blockedPct > 10 ? `<span class="accent">${blockedPct}%</span>` : `${blockedPct}%`,
								'Fetches that failed',
								fetchTotal ? `${fmt(h.fetchFailed)} of ${fmt(fetchTotal)} — a blocked school network looks like this` : 'no fetches yet',
							),
						].join('')}</div>` +
							`<div style="margin-top:.8rem">` +
							cardTitled('Funnel', 'the student path, and where it loses people', barRows(funnelRows)) +
							`</div>` +
							/* REACH, next to the funnel and deliberately not inside it.
							 *
							 * The funnel is ONE path: hub, coding kit, lesson, builder, run,
							 * fetch, download. Most of the site is not on it — the science kit
							 * is a different classroom, the API docs are for somebody who is
							 * not in a classroom at all — and forcing them in as "steps" made
							 * every drop-off percentage below them meaningless.
							 *
							 * Two numbers per page. Views is traffic; first-time browsers is
							 * reach. A page whose two numbers are close is finding new people;
							 * one where views run far ahead is being reloaded by the same few,
							 * and those are opposite problems. */
							`<div style="margin-top:.8rem">` +
							cardTitled(
								'Its pages, side by side',
								'visits this period, and how many of them were somebody new',
								reachRows.length
									? `<div class="bars">${reachRows
											.map(
												([lab, views, uniq, path]) =>
													`<div class="bar"><span class="lab" title="${esc(path)}">${esc(lab)}</span>` +
													`<span class="track" style="position:relative"><span class="fill" style="width:${Math.max(2, (views / reachMax) * 100)}%"></span>` +
													/* The first-visit share, drawn INSIDE the same track rather than as
													   a second bar: the question is what fraction of this page's traffic
													   was somebody new, and two bars side by side make that a subtraction
													   the reader has to do. */
													(uniq == null
														? ''
														: `<span class="fill" style="width:${Math.max(2, (uniq / reachMax) * 100)}%;opacity:.45;position:absolute;left:0;top:0"></span>`) +
													`</span>` +
													`<span class="num">${fmt(views)}${uniq == null ? '' : ` · ${fmt(uniq)} new`}</span></div>`,
											)
											.join('')}</div>`
									: `<div class="emptynote">No page views recorded yet.</div>`,
							) +
							`</div>` +
							(arrivalRows.length
								? `<div style="margin-top:.8rem">` +
									cardTitled('How they arrived', 'resolved in the browser, never sent as a URL', barRows(arrivalRows)) +
									`</div>`
								: '') +
							`<div class="grid two" style="margin-top:.8rem">` +
							cardTitled(
								'Errors students hit',
								'ranked — this is the queue for explanation copy',
								barRows((CLASSROOM.errors || []).map((e) => [ERROR_LABELS[e.key] || e.key, e.n])),
							) +
							cardTitled('Time in the builder', 'active time, bucketed', barRows(durationRows)) +
							`</div>` +
							`<div class="grid two" style="margin-top:.8rem">` +
							cardTitled(
								'Time in the lesson',
								'whole visits — on screen and not idle, bucketed',
								lessonTimeRows.length
									? barRows(lessonTimeRows)
									: `<div class="emptynote">No lesson visits measured yet.</div>`,
							) +
							cardTitled(
								'Where that time goes',
								stickiest
									? `estimated minutes per chapter — longest is chapter ${stickiest.chapter}`
									: 'estimated minutes per chapter',
								chapterTimeRows.length
									? barRows(chapterTimeRows)
									: `<div class="emptynote">No chapter timings yet.</div>`,
							) +
							`</div>` +
							`<div class="grid two" style="margin-top:.8rem">` +
							cardTitled(
								'Ideas students picked',
								'which prompts earn their place',
								barRows((CLASSROOM.ideas || []).slice(0, 12).map((i) => [i.id.replace(/-/g, ' '), i.n])),
							) +
							cardTitled(
								'How it is used',
								'view, theme and console choices',
								barRows(
									[
										['Split view', cN('view_split')],
										['Code only', cN('view_code')],
										['Page only', cN('view_preview')],
										['Opened in a new tab', cN('open_tab')],
										['Downloaded', cN('download')],
										['Dark mode', cN('theme_dark')],
										['Console collapsed', cN('console_collapsed')],
										['Ideas opened', cN('ideas_opened')],
									].filter((r) => r[1]),
								),
							) +
							`</div>`,
										'website',
					);
				}

				let landingSection = '';
				if (LANDING && LANDING.totals) {
					const lt = LANDING.totals;
					const CLICK_LABELS = {
						appstore: 'Mac App Store',
						itch: 'itch.io',
						demo: 'Free demo',
						play: 'Free demo',
						theme: 'Theme played',
						gallery: 'Gallery opened',
						privacy: 'Privacy page',
						support: 'Support page',
						'get-nav': 'Get the game (nav)',
						'edu-nav': 'For teachers (nav)',
						// `edu-page` is the science kit's OLD self-report. Its page view moved
						// to /LessonEvent/ as `view_science` so it could be compared with the
						// other kits; the historical series stays labeled and readable
						// rather than being quietly renamed under its own numbers.
						'edu-page': 'Science kit (viewed, before Aug 2026)',
						'privacy-page': 'Privacy policy (viewed)',
						'support-page': 'Support page (viewed)',
						'rating-page': 'Age suitability (viewed)',
						'pdf-guide': 'Educator guide (click)',
						'pdf-worksheets': 'Worksheets (click)',
						'school-copy': 'Classroom copy request',
						reddit: 'Reddit community',
						other: 'Other',
					};
					/* The primary CTA reported `demo` while it pointed at itch's storefront,
					 * and reports `play` now that it opens the demo on wildwillows.app. Same
					 * button, same intent, so they render as ONE series — otherwise the
					 * headline CTA number appears to reset to zero on the day the link
					 * changed, and the old total looks like it was lost.
					 *
					 * Folded HERE and not in the stored counters, which is the whole point:
					 * LandingStat keeps `demo` and `play` apart on disk forever, so "how many
					 * people did we send to itch before we hosted it ourselves" stays an
					 * answerable question. Merging on write would have destroyed that. */
					function mergeCtaClicks(clicks) {
						const out = { ...(clicks || {}) };
						if (out.demo) {
							out.play = n(out.play) + n(out.demo);
							delete out.demo;
						}
						return out;
					}
					const ldays = LANDING.days || [];
					const todayRow = ldays.find((d) => d.day === LANDING.today) || {};
					// Server-side download counts from the two PDF endpoints — the honest
					// number, since it also catches direct links teachers pass around,
					// which never fire the landing page's click beacon.
					const dl = lt.downloads || {};
					const dlToday = todayRow.downloads || {};
					const DL_LABELS = { guide: 'Educator Guide', worksheets: 'Student Worksheets' };
					/* Handed to the science section below. The PDFs ARE the science kit —
					   the guide and the six worksheets — so the breakdown belongs with it
					   rather than under the landing page that happens to link to them. */
					pdfDownloads = dl;
					pdfToday = Object.values(dlToday).reduce((a, v) => a + n(v), 0);
					schoolCopies = n((lt.clicks || {})['school-copy']);
					/* Where people arrived from, in the only vocabulary this site has:
					 * nine buckets, resolved in the visitor's own browser. The referrer
					 * URL is never sent — see LANDING_SOURCES in server/resources.ts.
					 *
					 * Counted on a page's once-per-session ping, so this is arrivals,
					 * not events: a visitor who clicks six links still arrived once. */
					const SOURCE_LABELS = {
						google: 'Google',
						bing: 'Bing',
						duckduckgo: 'DuckDuckGo',
						reddit: 'Reddit',
						itch: 'itch.io',
						apple: 'Apple',
						bluesky: 'Bluesky',
						direct: 'Direct or bookmarked',
						other: 'Somewhere else',
					};
					const srcTotal = Object.values(lt.sources || {}).reduce((a, v) => a + n(v), 0);
					const sourcesCard = cardTitled(
						'Where visitors come from',
						srcTotal
							? `${fmt(srcTotal)} ${srcTotal === 1 ? 'arrival' : 'arrivals'} all-time`
							: 'nothing recorded yet — this starts filling once the change is deployed',
						barRows(objToEntries(lt.sources), { labelMap: SOURCE_LABELS, cls: 'sky' }),
					);
					/* Daily visits used to be a fixed last-14-days histogram wedged into
					 * the two-up grid beside "Clicks by link". It now gets the same
					 * control — and the same dense day-column chart — as New caretakers
					 * per day: presets plus a From/To pair, scoped to this chart only.
					 * Full width for the same reason that one is: ninety columns do not
					 * fit in half a card. */
					const lShown = visibleLandingDays();
					const lTotal = lShown.reduce((a, d) => a + n(d.visits), 0);
					const lBusiest = lShown.slice().sort((a, b) => n(b.visits) - n(a.visits))[0];
					const lPicker = dayRangePicker('landing', LANDING_DAY_RANGE, lShown, {}, 'Date range for daily visits');
					const lSub = lShown.length
						? `${fmt(lTotal)} ${lTotal === 1 ? 'visit' : 'visits'} in ${fmt(lShown.length)} ${lShown.length === 1 ? 'day' : 'days'}` +
							(lBusiest && lBusiest.visits ? ` · busiest ${esc(lBusiest.day)} with ${fmt(lBusiest.visits)}` : '')
						: 'no days in this range';
					const dailyVisitsCard = ldays.length
						? `<div style="margin-top:.8rem">${lPicker}${cardTitled('Daily visits', lSub, dayCols(lShown, 'visits'))}</div>`
						: '';
					landingSection = sec(
						'Landing page',
						'wildwillows.app — visits, arrivals, link clicks and where the hub sends people',
						`<div class="grid kpis">${[
							kpi(fmt(lt.visits), 'Visits', `${fmt(lt.uniques)} first-time visitors`),
							kpi(
								`<span class="accent">${fmt(todayRow.visits)}</span>`,
								'Visits today',
								`${fmt(todayRow.totalClicks)} link ${n(todayRow.totalClicks) === 1 ? 'click' : 'clicks'} today`,
							),
							kpi(fmt(lt.totalClicks), 'Link clicks', 'store, demo & theme buttons'),
							kpi(
								fmt(lt.totalDownloads),
								'PDF downloads',
								`${fmt(dl.guide)} guide · ${fmt(dl.worksheets)} worksheets`,
							),
							// A "Mailing list" tile stood here. The list is gone — signup form,
							// MailingListSignup table and the admin-only reader — so there is no
							// number behind it any more, not even a frozen one.
						].join('')}</div>` +
							// Daily visits sits directly under the KPI row, above the two-up
							// grid: the KPIs answer "how many, all-time and today", and the
							// day columns are the shape behind those same numbers, so they
							// read together. Clicks by link and Classroom PDFs are the
							// breakdown of WHERE people went, which follows from that.
							dailyVisitsCard +
							`<div class="grid two" style="margin-top:.8rem">` +
							cardTitled(
								'Clicks by link',
								'all-time',
								barRows(objToEntries(mergeCtaClicks(lt.clicks)), { labelMap: CLICK_LABELS, cls: 'gold' }),
							) +
							/* Where the Classroom PDFs card used to sit. It moved into the
							   science kit's own section; what belongs here instead is the
							   thing the hub is FOR, which is deciding which kit to take. */
							cardTitled(
								'The teachers hub',
								'/teachers — which kit a visitor took from it',
								kitSplit && (kitSplit.science || kitSplit.coding)
									? barRows([
											['Took the science kit', kitSplit.science],
											['Took the coding kit', kitSplit.coding],
											reachById.hub ? ['Reached the hub at all', n(reachById.hub.views)] : null,
										])
									: '<div class="emptynote">No hub navigation recorded yet.</div>',
							) +
							`</div>` +
							// Acquisition is its own question — not a breakdown of the
							// clicks above it — so it gets its own full-width row rather
							// than a third column squeezed into the two-up grid.
							`<div style="margin-top:.8rem">${sourcesCard}</div>`,
										'website',
					);
				}

				/* The five achievements the most caretakers have, and how long each took
			 * from the moment the save was created.
			 *
			 * Median leads and the mean sits beside it: one person who left the game
			 * open overnight before finishing the tutorial moves a mean by hours and
			 * the median not at all, and with a few dozen saves that is the common
			 * case rather than the exception. The spread is shown for the same
			 * reason — "median 4m, fastest 40s, slowest 3h" is a different fact from
			 * "median 4m" and the second one on its own invites the wrong plan. */
			function topAchievementsHTML(s) {
				const a = (s && s.achievements) || {};
				const top = a.topAchievements || [];
				if (!top.length) return '';
				const cov = a.timingCoverage || {};
				// fmtDur rounds to whole minutes, which turns "earned it in 40 seconds"
				// into "1m" and "in 8 seconds" into "0m" — the fast end is the
				// interesting end for a first milestone, so keep seconds below a minute.
				const dur = (sec) => (n(sec) < 60 ? `${Math.round(n(sec))}s` : fmtDur(sec));
				const rows = top
					.map((t) => {
						const spread =
							t.timed > 1 && t.fastestSeconds != null
								? `<span class="alltime">${dur(t.fastestSeconds)}–${dur(t.slowestSeconds)}</span>`
								: '';
						return (
							`<tr><td>${esc(t.name)}</td>` +
							`<td class="num">${fmt(t.players)}</td>` +
							`<td class="num">${t.medianSecondsToEarn == null ? '—' : dur(t.medianSecondsToEarn)}</td>` +
							`<td class="num">${t.avgSecondsToEarn == null ? '—' : dur(t.avgSecondsToEarn)}</td>` +
							`<td class="num">${spread || '—'}</td></tr>`
						);
					})
					.join('');
				// A top five drawn from four saves is not a top five. Say the base.
				const missing = n(cov.savesWithAchievements) - n(cov.savesWithTimestamps);
				/* Idle windows are counted in "Caretakers" and excluded from every
				 * duration beside it — the server drops them (see achEarnedBy in
				 * server/resources.ts) because time-to-earn is wall clock, and a window
				 * left open over lunch stamps a first-session milestone hours after the
				 * save began. Said out loud, because a Caretakers column that does not
				 * match the column the median was drawn from is otherwise just a
				 * discrepancy the reader has to invent an explanation for. */
				const idleSkipped = n(cov.idleSkipped);
				return (
					`<div class="card" style="margin-top:.8rem"><h3>First five milestones<span class="tag">most earned · time from starting the save</span></h3>` +
					`<table class="tbl"><thead><tr><th>Achievement</th><th class="num">Caretakers</th><th class="num">Median</th>` +
					`<th class="num">Mean</th><th class="num">Range</th></tr></thead><tbody>${rows}</tbody></table>` +
					(missing > 0
						? `<p class="emptynote">Based on ${fmt(cov.savesWithTimestamps)} of ${fmt(cov.savesWithAchievements)} saves. ` +
							`The other ${fmt(missing)} last reported before per-achievement timestamps existed, so they count for nothing here until they next sync.</p>`
						: '') +
					(idleSkipped > 0
						? `<p class="emptynote">Median, mean and range exclude ${fmt(idleSkipped)} ${idleSkipped === 1 ? 'save that was' : 'saves that were'} ` +
							`left open rather than played — the clock kept running while nobody did, so the durations on those are hours of nothing. ` +
							`They still count under Caretakers: the milestone was earned, it just can't say how long it took.</p>`
						: '') +
					`</div>`
				);
			}

			/* ---- Engagement KPIs ----
			 * Ahead of the Landing page section. Both used to be the other way round,
			 * on the argument that the page should read as a funnel from arrivals
			 * down. In practice the game numbers are what this dashboard is opened
			 * for, and site traffic — visits, link clicks, mailing list — is a
			 * different subject that was interrupting the run from Overview into how
			 * people actually play. Landing page still sits high, just below this. */
				out.push(
					sec(
						'Engagement',
						'time spent tending the wild',
						`<div class="grid kpis">${[
							kpi(`${fmt(E.totalPlayHours)}<small>hrs</small>`, 'Total play time'),
							kpi(`${fmt(E.avgPlayMinutesPerPlayer)}<small>min</small>`, 'Avg per caretaker'),
							kpi(fmt(E.totalSessions), 'Sessions', `${n(E.avgSessionsPerPlayer)} avg per caretaker`),
							kpi(`${fmt(E.avgSessionMinutes)}<small>min</small>`, 'Avg session length'),
							kpi(fmt(E.totalActions), 'Total actions', `${fmt(E.avgActionsPerPlayer)} avg per caretaker`),
							kpi(
								`<span class="accent">${pct(R.returningRatePct)}</span>`,
								'Return rate',
								`${fmt(R.returningPlayers)} came back`,
							),
						].join('')}</div>` + sessionShapeHTML(s) + topAchievementsHTML(s) + clockNoteHTML(s),
					),
				);

				/* ---- Landing page (site traffic, not game numbers) ----
				 * Built further up (it needs LANDING, which loads separately) and
				 * pushed here, under Engagement. It sat at the very bottom once, which
				 * read as an afterthought and buried the number upstream of every other
				 * number on this page: how many people arrived at all. High but not
				 * first is the compromise — the game numbers lead, the traffic follows
				 * immediately. */
				/* ---- Science kit ----
				 *
				 * Assembled here rather than with the other two because it needs BOTH
				 * payloads: its reach comes from /LessonStats/ and its downloads from
				 * /LandingStats/, since the PDF links are shared with the landing page
				 * and always have been.
				 *
				 * IT IS MEASURED DIFFERENTLY ON PURPOSE. There is no funnel here and no
				 * error ranking, because there is almost nothing to instrument: the
				 * activity happens inside the game and on paper. What a teacher does on
				 * this site is read the guide and take the PDFs away, so reach and
				 * downloads are not a thin version of the coding numbers — they are the
				 * whole of what this kit can honestly report. */
				let scienceSection = '';
				{
					const sci = reachById.science;
					const guide = n((pdfDownloads || {}).guide);
					const sheets = n((pdfDownloads || {}).worksheets);
					const anything = (sci && n(sci.views)) || guide || sheets || schoolCopies;
					if (anything) {
						scienceSection = sec(
							'Science kit',
							'/teachers/science — ecosystems & habitat, grades 5-8',
							`<div class="grid kpis">${[
								kpi(
									fmt(sci ? sci.views : 0),
									'Kit page views',
									sci && sci.unique != null ? `${fmt(sci.unique)} first-time visitors` : 'first-time visitors not measured yet',
								),
								kpi(fmt(guide + sheets), 'PDFs taken', `${fmt(pdfToday)} today`),
								kpi(fmt(guide), 'Educator guides', 'the eight-page lesson plan'),
								kpi(
									schoolCopies ? `<span class="accent">${fmt(schoolCopies)}</span>` : '0',
									'Classroom copy requests',
									'teachers asking for free copies of the game',
								),
							].join('')}</div>` +
								`<div class="grid two" style="margin-top:.8rem">` +
								cardTitled(
									'What they took away',
									'downloaded all-time — the kit itself',
									pdfDownloads && Object.keys(pdfDownloads).length
										? barRows(objToEntries(pdfDownloads), {
												labelMap: { guide: 'Educator Guide', worksheets: 'Student Worksheets' },
												cls: 'gold',
											})
										: '<div class="emptynote">No downloads recorded yet.</div>',
								) +
								cardTitled(
									'Read, then taken',
									'how much of the reading turns into a download',
									sci && n(sci.views)
										? barRows([
												['Opened the kit page', n(sci.views)],
												[`Took a PDF (${Math.round(((guide + sheets) / n(sci.views)) * 100)}% of readers)`, guide + sheets],
												schoolCopies ? [`Asked for classroom copies`, schoolCopies] : null,
											])
										: '<div class="emptynote">No page views recorded yet.</div>',
								) +
								`</div>` +
								`<p class="emptynote" style="margin-top:.8rem">Nothing else is counted here, and that is not a gap. The science activity happens in the game and on the worksheets, so once a teacher has the PDFs this site stops being able to see anything — by design.</p>`,
							'website',
						);
					}
				}

				if (landingSection) out.push(landingSection);

				/* Directly under Landing page: all three are site numbers rather than
				 * game numbers, and the education funnels start where the landing one
				 * ends. Science first because it is the older and larger of the two
				 * kits, and because its numbers are the shorter read. */
				if (scienceSection) out.push(scienceSection);
				if (codingSection) out.push(codingSection);

				/* ---- Editions: demo vs full ---- */
				const edOf = (p) => (p.edition === 'demo' ? 'demo' : 'full');
				const demoPlayers = players.filter((p) => edOf(p) === 'demo');
				const fullPlayers = players.filter((p) => edOf(p) === 'full');
				const dStat = editionStats(demoPlayers),
					fStat = editionStats(fullPlayers);
				const edSum = s.editions || {};
				const playersDonut = donut(
					[
						{ label: 'Full', value: edSum.full != null ? edSum.full : fStat.count, color: '#4a7c46' },
						{ label: 'Demo', value: edSum.demo != null ? edSum.demo : dStat.count, color: 'var(--s3)' },
					].filter((x) => x.value),
				);
				const vsRows = [
					{ key: 'count', label: 'Caretakers' },
					{ key: 'playHours', label: 'Total play time', suf: 'h' },
					{ key: 'avgMin', label: 'Avg play / caretaker', suf: 'm' },
					{ key: 'avgSessions', label: 'Avg sessions / caretaker' },
					{ key: 'totalActions', label: 'Total actions' },
					{ key: 'avgActions', label: 'Avg actions / caretaker' },
					{ key: 'avgAch', label: 'Avg achievements earned' },
					{ key: 'avgHealth', label: 'Avg biome health', suf: '%' },
					{ key: 'avgBiomes', label: 'Avg biomes unlocked' },
					{ key: 'returningPct', label: 'Returned (2+ sessions)', suf: '%' },
					{ key: 'collected', label: 'Collected a resource', suf: '%' },
					{ key: 'crafted', label: 'Crafted an item', suf: '%' },
					{ key: 'placed', label: 'Placed an object', suf: '%' },
					{ key: 'attractedAnimal', label: 'Attracted an animal', suf: '%' },
					{ key: 'unlockedSecondBiome', label: 'Unlocked 2nd biome', suf: '%' },
				];
				out.push(
					sec(
						'Editions · demo vs full',
						'how the free demo compares to the full game',
						cardTitled('Caretakers by edition', 'who is playing', playersDonut) +
							`<div class="card" style="margin-top:.8rem"><h3>Every metric, side by side<span class="tag">demo vs full</span></h3>` +
							vsTable(vsRows, dStat, fStat) +
							`</div>`,
					),
				);

				/* ---- Player highlights (rendered here, appended at the bottom) ---- */
				let charSection = '';
				// Everyone who played more than 5 minutes — most engaged first. Each card is
				// clickable and opens a full breakdown modal (looked up by playerId).
				PLAYERS_BY_ID = {};
				for (const p of players) if (p && p.playerId) PLAYERS_BY_ID[p.playerId] = p;
				/* Idle windows are excluded from this section outright.
				 *
				 * The 5-minute gate is a PLAY-TIME gate, and a window left open all
				 * afternoon clears it without anybody touching the game — so the idle
				 * saves were not just present here, they sorted to the TOP, and
				 * "Most playtime" was being awarded to an abandoned tab. A section
				 * called Player highlights should show players.
				 *
				 * They are only hidden from this wall, not dropped: they still count in
				 * the head count, the funnel and every aggregate above, they are still in
				 * PLAYERS_BY_ID so a modal opened for one still works, and the count of
				 * what was left out is printed in the subtitle rather than left implied. */
				const qualified = players.filter((p) => p && n(p.playSeconds) > 300);
				const idleHidden = qualified.filter((p) => p.idle).length;
				const engaged = qualified.filter((p) => !p.idle);
				if (engaged.length) {
					const sortCfg = HL_SORTS.find((o) => o.key === HL_SORT.key) || HL_SORTS[0];
					/* Ties fall back to the original ranking — playtime, then actions, then
					 * achievement points. Sorting by a sparse field (a wall of nobody having
					 * returned an animal yet) would otherwise leave the tail in whatever
					 * order the rows arrived in, which changes between loads. */
					const tiebreak = (a, b) =>
						n(b.playSeconds) - n(a.playSeconds) ||
						n(b.totalActions) - n(a.totalActions) ||
						n(b.achievements && b.achievements.points) - n(a.achievements && a.achievements.points);
					/* Compared rather than subtracted: recency ranks unknowns at -Infinity,
					 * and Infinity - Infinity is NaN, which makes a comparator incoherent
					 * and the resulting order implementation-defined. */
					const desc = (x, y) => (x === y ? 0 : x > y ? -1 : 1);
					const top = [...engaged].sort((a, b) => desc(sortCfg.val(a), sortCfg.val(b)) || tiebreak(a, b));

					// Superlative badges: each dimension's true leader (within the shown set)
					// earns its tag; a standout who leads several shows up to two of them.
					// Keyed by the row object itself rather than by position, so a badge keeps
					// naming the same caretaker no matter which sort moved them where — and so
					// rows with no playerId can't collide on a shared empty key.
					const supTags = new Map();
					const assignSup = (key, label) => {
						let best = 0,
							winner = null;
						top.forEach((p) => {
							const v = n(key(p));
							if (v > best) {
								best = v;
								winner = p;
							}
						});
						if (winner) supTags.set(winner, (supTags.get(winner) || []).concat(label));
					};
					assignSup((p) => p.playSeconds, 'Most playtime');
					assignSup((p) => p.totalActions, 'Most active');
					assignSup((p) => p.achievements && p.achievements.earned, 'Most achievements');
					assignSup((p) => p.biomeSummary && p.biomeSummary.biomesFullyRestored, 'Most restored');
					assignSup((p) => hlMenuSeconds(p), 'Most time in menus');

					const stat = (v, l) => `<div class="hlstat"><b>${v}</b><span>${l}</span></div>`;
					// "Active now" uses the same 5-minute window as the Overview KPI, so the two
					// always agree about who is currently playing.
					const isActiveNow = (p) => p.minutesSinceActive != null && n(p.minutesSinceActive) <= 5;

					/* Page the wall. Superlatives and the sort are computed over the WHOLE
					 * set above, so a badge still names the true leader and paging never
					 * changes who "Most playtime" belongs to — only which forty cards are
					 * drawn. Clamped here rather than where it is set, because the page
					 * count moves whenever a filter or a refresh changes the row count. */
					const pageCount = Math.max(1, Math.ceil(top.length / HL_PAGE_SIZE));
					HL_PAGE.index = Math.min(Math.max(0, HL_PAGE.index), pageCount - 1);
					const pageStart = HL_PAGE.index * HL_PAGE_SIZE;
					const pageRows = top.slice(pageStart, pageStart + HL_PAGE_SIZE);

					const cards = pageRows
						.map((p) => {
							const bs = p.biomeSummary || {};
							const edi = p.edition === 'demo' ? 'demo' : 'full';
							const live = isActiveNow(p);
							const tags = (supTags.get(p) || [])
								.slice(0, 2)
								.map((t) => `<span class="hltag">${t}</span>`)
								.join('');
							// The green border is the ask, but color alone isn't a reliable cue, so the
							// card also carries it in its tooltip and an aria-label for screen readers.
							const liveTag = live ? `<span class="hltag hllive">Active now</span>` : '';
							// The best thing a card can say about a player: they played the
							// demo, bought the game, and carried this meadow across.
							const cv = p.conversion || {};
							const convTag = p.convertedFromDemo
								? `<span class="hltag hlconv" title="Played the demo${cv.demoPlaySeconds ? ` for ${fmtDur(cv.demoPlaySeconds)}` : ''}, then bought the game and imported this save${cv.at ? ` · ${cv.exact ? '' : 'around '}${new Date(cv.at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}` : ''}">demo → full</span>`
								: '';
							/* When the wall is ordered by recency, the gap being sorted on should
							 * be legible on the card — otherwise the order looks arbitrary. The
							 * "Active now" pill already says it for the top of that list, so it
							 * isn't printed twice, and the stats grid stays a clean 3 × 2. */
							/* No menu-dwell pill here. It was the one tag on the card that
							 * qualified itself rather than saying something — "12% in menus"
							 * needs the whole tooltip to mean anything, and it rode on every
							 * card at once. The number itself is not gone: the wall can still
							 * be sorted by it, "Most time in menus" is still awarded, the
							 * per-menu breakdown is still in the modal one click away, and the
							 * site-wide "Time in menus" panel is untouched. */
							const since = hlSinceMinutes(p);
							const sinceTag =
								sortCfg.key === 'recent' && !live
									? `<span class="hltag hlsince" title="Time since this caretaker was last active">${isFinite(since) ? `${fmtSince(since)} ago` : 'last played unknown'}</span>`
									: '';
							/* How far into the ten-goal starter chain this save got.
							 *
							 * Drawn only for rows that carry `starterTotal` — a snapshot
							 * uplinked before the chain existed reports starterStep 0, and a
							 * bar pinned at 0/10 would read as "this player did nothing"
							 * rather than "this save predates the measurement". Same reason
							 * the funnel above excludes them from its denominator.
							 *
							 * A pre-chain save (`starterLegacy`) finished the old three-goal
							 * opening and is reported as complete by the server so it doesn't
							 * aggregate as stalled. Its bar is hatched and reads "pre-chain"
							 * rather than "10/10", because that ten was inferred. */
							const stTotal = n(p.starterTotal);
							const stStep = Math.max(0, Math.min(n(p.starterStep), stTotal));
							const stPct = stTotal ? (stStep / stTotal) * 100 : 0;
							const chainRow = stTotal
								? `<div class="hlchain${p.starterDone ? ' done' : ''}${p.starterLegacy ? ' legacy' : ''}" title="${
										p.starterLegacy
											? 'Started before the ten-goal chain shipped — it finished the old three-goal opening, so its step is inferred rather than observed.'
											: `Claimed ${stStep} of the ${stTotal} starter goals${p.starterDone ? ' — chain finished' : ''}`
									}"><span class="lab">Starter</span><span class="track"><span class="fill" style="width:${stPct}%"></span></span><span class="num">${
										p.starterLegacy ? 'pre-chain' : `${stStep}/${stTotal}`
									}</span></div>`
								: '';
							return `<div class="hlcard${live ? ' active-now' : ''}" data-pid="${esc(p.playerId || '')}" role="button" tabindex="0" title="${live ? 'Active now · c' : 'C'}lick for full breakdown"${live ? ' aria-label="Active now"' : ''}><div class="hlav">${avatarSVG(p.appearance)}</div><div class="hlbody"><div class="hltop">${liveTag}${sinceTag}${convTag}${tags}<span class="hledi ${edi}">${edi}</span></div><div class="hlstats">${[
								stat(fmtDur(p.playSeconds), 'played'),
								stat(fmt(n(p.sessions)), n(p.sessions) === 1 ? 'session' : 'sessions'),
								stat(fmt(n(p.totalActions)), 'actions'),
								stat(`${n(p.achievements && p.achievements.earned)}★`, 'achievements'),
								stat(fmt(n(bs.totalAnimalsReturned)), 'animals'),
								stat(fmt(n(p.unlockedBiomes || bs.biomesUnlocked)), 'biomes'),
							].join('')}</div>${chainRow}</div></div>`;
						})
						.join('');
					/* Sort control. Same pill group as the per-day chart's presets, and like
					 * that one it only reorders what is already on screen — the set of
					 * cards shown never changes, so nothing can hide behind a sort. It
					 * does send you back to page one, because staying on page 4 of a
					 * re-ranked list means landing somewhere arbitrary. */
					const picker =
						`<div class="dpick hlpick" role="group" aria-label="Sort player highlights">` +
						`<span class="hlpicklabel">Sort by</span>` +
						HL_SORTS.map(
							(o) =>
								`<button type="button" class="dbtn${HL_SORT.key === o.key ? ' on' : ''}" data-hlsort="${o.key}" aria-pressed="${HL_SORT.key === o.key ? 'true' : 'false'}">${o.label}</button>`,
						).join('') +
						`</div>`;
					/* Pager. Only drawn when there is more than one page — a single
					 * "Page 1 of 1" with two dead arrows is furniture, not a control.
					 * The page numbers are buttons rather than a dropdown so the shape of
					 * the list (how many pages there are) is visible without opening
					 * anything; past nine pages the run is windowed around the current
					 * one with the first and last always reachable. */
					const pager = (() => {
						if (pageCount < 2) return '';
						const btn = (i, label, disabled) =>
							`<button type="button" class="dbtn${!disabled && i === HL_PAGE.index ? ' on' : ''}" data-hlpage="${i}"${disabled ? ' disabled' : ''}${
								label ? '' : ` aria-label="Page ${i + 1}"`
							} aria-pressed="${i === HL_PAGE.index ? 'true' : 'false'}">${label || i + 1}</button>`;
						const WINDOW = 9;
						let nums = [];
						if (pageCount <= WINDOW) {
							for (let i = 0; i < pageCount; i++) nums.push(i);
						} else {
							const half = Math.floor((WINDOW - 2) / 2);
							let lo = Math.max(1, HL_PAGE.index - half);
							let hi = Math.min(pageCount - 2, lo + (WINDOW - 3));
							lo = Math.max(1, hi - (WINDOW - 3));
							nums.push(0);
							for (let i = lo; i <= hi; i++) nums.push(i);
							nums.push(pageCount - 1);
						}
						const body = nums
							.map((i, k) => {
								// A gap in the run gets an ellipsis, so a jump from 1 to 14 does
								// not read as though the pages in between do not exist.
								const gap = k > 0 && i - nums[k - 1] > 1 ? `<span class="hlgap">…</span>` : '';
								return gap + btn(i, null, false);
							})
							.join('');
						return (
							`<div class="dpick hlpager" role="group" aria-label="Player highlights pages">` +
							btn(HL_PAGE.index - 1, '‹ Prev', HL_PAGE.index === 0) +
							body +
							btn(HL_PAGE.index + 1, 'Next ›', HL_PAGE.index === pageCount - 1) +
							`</div>`
						);
					})();
					const firstShownRank = top.length ? pageStart + 1 : 0;
					const lastShownRank = pageStart + pageRows.length;
					charSection = sec(
						'Player highlights',
						`everyone who played more than 5 min · ${top.length} caretakers` +
							(idleHidden ? ` · ${fmt(idleHidden)} idle ${idleHidden === 1 ? 'window' : 'windows'} hidden` : '') +
							` · sorted by ${sortCfg.label.toLowerCase()}` +
							(pageCount > 1
								? ` · showing ${fmt(firstShownRank)}–${fmt(lastShownRank)} (page ${HL_PAGE.index + 1} of ${pageCount})`
								: '') +
							` · click a card for the full breakdown`,
						`<div class="card">${picker}<div class="hlgrid">${cards}</div>${pager}</div>`,
					);
				}

				/* ---- Acquisition + Activation funnels ---- */
				const acq = s.acquisition || {};
				const kg = acq.keyboardGate || {};
				const fun = s.funnel || {};
				const dc = s.demoCompletion || {};
				const dn = dc.nudge || {};
				const de = dc.endScreen || {};
				/* ---- Where they came from ----
				 * Devices and conversion per channel. Sorted by conversion, not by
				 * size, because size is the number you can't trust across channels:
				 * inside itch's game iframe the device id lives in THIRD-PARTY storage
				 * that browsers partition or clear on their own, so one itch player can
				 * count as several devices while a wildwillows.app player (first-party)
				 * counts as one. The rate survives that; the totals don't. Both are
				 * shown — the caption says which to believe. */
				const chanRows = Object.entries(acq.channels || {}).sort((a, b) => n(b[1].converted) - n(a[1].converted));
				/* Rendered INSIDE the acquisition card rather than as its own: it answers
				 * the same question the funnel above it does — where these devices came
				 * from — and the acquisition card is half-height next to the activation
				 * one, so it was sitting on a column of empty space. */
				const channelBlock = chanRows.length
					? `<h4 class="sub-h">Where they came from</h4>` +
						`<p class="emptynote" style="margin:-.2rem 0 .5rem">compare on conversion — device counts are not comparable across stores</p>` +
							`<table class="tbl"><thead><tr><th>Channel</th><th class="num">Devices</th>` +
								`<th class="num">Made a character</th><th class="num">Conversion</th></tr></thead><tbody>` +
								chanRows
									.map(
										([key, c]) =>
											`<tr><td>${esc(CHANNEL_LABELS[key] || key)}</td>` +
											`<td class="num">${fmt(c.devices)}</td>` +
											`<td class="num">${fmt(c.converted)}</td>` +
											`<td class="num"><span class="accent">${pct(c.conversionPct)}</span></td></tr>`,
									)
									.join('') +
								`</tbody></table>`
					: '';
				/* Say what came out. A funnel that silently shrank is worse than one which
				 * admits it dropped your own launches. */
				const own = acq.ownDevices || {};
				const ownNote = own.matched
					? `<p class="emptynote" style="margin-top:.6rem">Excluding ${fmt(own.matched)} of your own device${own.matched === 1 ? '' : 's'} (${fmt(own.opens)} opens). Append <code>?includeDev=1</code> to the URL to put them back.</p>`
					: '';
				const acqCards = cardTitled(
					'Acquisition funnel',
					'per device',
					funnel([
						{ label: 'Opened the app', value: acq.devices },
						/* "Started playing" = made a character OR returned to a save. This
						 * step was creation alone, which counted every returning player as a
						 * bounce — so the rate got WORSE as retention improved. Creation is
						 * still its own step below. */
						{ label: 'Started playing', value: acq.played != null ? acq.played : acq.converted },
						{ label: 'Created a character', value: acq.converted },
					]) +
						`<div class="grid kpis" style="margin-top:1rem">${[
							// Raw app opens used to sit here, and it was the one number a single
							// machine could dominate: every launch counted, so weeks of development
							// launches swamped it. Conversion and bounce are per-DEVICE, so one
							// developer moves them by one device out of hundreds. Dropping the tile
							// removes the distortion at its source instead of filtering around it.
							kpi(
								`<span class="accent">${pct(acq.playedPct != null ? acq.playedPct : acq.conversionPct)}</span>`,
								'Played',
								`${fmt(acq.played != null ? acq.played : acq.converted)} of ${fmt(acq.devices)} devices` +
									(n(acq.resumed) ? ` · ${fmt(acq.resumed)} came back to a save` : ''),
							),
							kpi(pct(acq.bounceRatePct), 'Bounced', `${fmt(acq.bounced)} never started playing`),
							// Sits beside Bounced on purpose: these devices are counted in it,
							// and they are the part of it that is not a choice anyone made.
							kpi(
								fmt(kg.turnedAway),
								'Turned away',
								`needed a keyboard${n(kg.pctOfBounced) ? ` · ${pct(kg.pctOfBounced)} of bounces` : ''}`,
							),
						].join('')}</div>` +
						ownNote +
						(channelBlock ? `<div style="margin-top:1rem">${channelBlock}</div>` : ''),
				);

				/* ---- Turned away by the keyboard gate ----
				 * The game needs WASD, so a device with no keyboard gets the "Wild Willows
				 * needs a keyboard" screen instead of the game. Broken out by operating
				 * system because the question this number is really being asked to answer
				 * is "how many of these are phones?".
				 *
				 * Only devices that opened the game after the gate started reporting can
				 * appear, so the card dates itself rather than implying it covers all time.
				 * The card is hidden entirely until the first one arrives — a card reading
				 * zero would say "nobody is turned away" when it means "not measured yet". */
				/* The keyboard gate has no card of its own. It is one number — how many
				 * devices could not play — and it already sits in the acquisition tiles
				 * beside Bounced, which is the only place it means anything (those devices
				 * ARE part of the bounce, and the part nobody chose). A half-page card for
				 * a count of one was mostly whitespace. `keyboardGate` is still on the
				 * endpoint in full, byOs included, for anyone reading it directly. */

				const demoCard = dc.demoInstalls
					? cardTitled(
							'Demo completion',
							'reached the end of the demo',
							funnel([
								{ label: 'Made a character', value: dc.createdCharacter },
								{ label: 'Finished the demo', value: dc.reachedGoal },
							]) +
								`<div class="grid three" style="margin-top:1rem">${[
									kpi(fmt(dc.demoInstalls), 'Demo installs'),
									kpi(
										`<span class="accent">${pct(dc.completionPct)}</span>`,
										'Completion',
										'of demo players who started',
									),
									kpi(fmt(dc.reachedGoal), 'Finished'),
								].join('')}</div>` +
								/* The "are you done playing?" prompt. Only rendered once it has
								 * actually been shown to someone — a row of zeros here would read
								 * as "nobody responds to it" when it means "not measured yet".
								 * Exported is the number that justifies the interruption; if it
								 * stays near zero the prompt is a tax and should be softened. */
								(n(dn.shown)
									? `<h4 class="sub-h" style="margin-top:1rem">"Are you done playing?"</h4>` +
										`<div class="grid three">${[
											kpi(fmt(dn.shown), 'Prompt shown', 'devices, once each'),
											kpi(
												`<span class="accent">${pct(dn.exportPct)}</span>`,
												'Saved their meadow',
												`${fmt(dn.exported)} exported from the prompt`,
											),
											kpi(pct(dn.storePct), 'Went to a store', `${fmt(dn.storeClicked)} clicked through`),
										].join('')}</div>`
									: ''),
						)
					: '';

				/* ---- The end of the demo ----
				 * Two halves of one moment, so one card. The end-of-demo screen is the
				 * hard stop where the buy links live; "carried over" is who acted on them
